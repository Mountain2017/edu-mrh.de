<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordCraft Realm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12121c;
    --bg-deep: #0b0b12;
    --panel: #1d1e2c;
    --panel-light: #262840;
    --panel-border: #3a3d5c;
    --grass: #6fae3e;
    --grass-dark: #4f7f2c;
    --grass-glow: #9ee06a;
    --dirt: #9a6a3c;
    --stone: #7d7f95;
    --gold: #e8b33d;
    --gold-glow: #ffd873;
    --sky: #7ecbe0;
    --ember: #e8703d;
    --cave: #7c5cb5;
    --text: #f2ede0;
    --text-dim: #a8a4b8;
    --text-faint: #6c6a82;
    --danger: #d9534f;
    --ok: #6fae3e;
    --radius: 10px;
    --font-display: 'Press Start 2P', monospace;
    --font-body: 'Baloo 2', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(126,203,224,0.08), transparent 55%),
      radial-gradient(ellipse at 90% 110%, rgba(124,92,181,0.10), transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:920px;margin:0 auto;padding:18px 16px 60px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:22px; flex-wrap:wrap;
  }
  .brand{
    font-family:var(--font-display);
    font-size:13px;
    color:var(--gold-glow);
    letter-spacing:1px;
    text-shadow:0 0 12px rgba(232,179,61,0.35);
    display:flex; align-items:center; gap:10px;
    cursor:pointer;
    user-select:none;
  }
  .brand .cube{width:20px;height:20px;flex:none;}
  .hud{
    display:flex; align-items:center; gap:14px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:999px;
    padding:6px 16px 6px 6px;
  }
  .hud .lvl{
    width:30px;height:30px;border-radius:50%;
    background:linear-gradient(145deg, var(--gold-glow), var(--gold));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-weight:700;font-size:13px;color:#3a2a05;
    flex:none;
  }
  .xpbar-wrap{width:110px;}
  .xpbar-label{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);letter-spacing:0.5px;}
  .xpbar{height:7px;border-radius:6px;background:#0e0e17;overflow:hidden;border:1px solid var(--panel-border);}
  .xpbar-fill{height:100%;background:linear-gradient(90deg, var(--grass-dark), var(--grass-glow));transition:width .5s ease;}
  .gems{display:flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:13px;color:var(--gold-glow);}

  nav.tabs{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap;}
  .tab-btn{
    font-family:var(--font-body); font-weight:700; font-size:14px;
    background:var(--panel); color:var(--text-dim);
    border:1px solid var(--panel-border); border-radius:8px;
    padding:8px 14px; cursor:pointer; transition:all .15s ease;
  }
  .tab-btn:hover{border-color:var(--gold); color:var(--text);}
  .tab-btn.active{background:var(--panel-light); color:var(--gold-glow); border-color:var(--gold);}

  /* ---------- Story banner ---------- */
  .story-banner{
    background:linear-gradient(160deg, var(--panel-light), var(--panel));
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:24px;
    position:relative;
    overflow:hidden;
  }
  .story-banner::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 10px, transparent 10px 20px);
    pointer-events:none;
  }
  .story-banner h1{
    font-family:var(--font-display); font-size:15px; line-height:1.7;
    color:var(--gold-glow); margin:0 0 10px; text-shadow:0 0 10px rgba(232,179,61,.25);
  }
  .story-banner p{margin:0; color:var(--text-dim); font-size:15.5px; line-height:1.55; max-width:60ch;}

  /* ---------- World map ---------- */
  .map-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr));
    gap:16px;
  }
  .biome-card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    padding:16px;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    position:relative;
  }
  .biome-card:hover:not(.locked){transform:translateY(-3px); border-color:var(--gold);}
  .biome-card.locked{cursor:not-allowed; opacity:0.55;}
  .biome-card.done{border-color:var(--grass-glow); box-shadow:0 0 0 1px var(--grass-glow) inset;}

  .cube-wrap{display:flex; justify-content:center; margin-bottom:12px; height:78px; align-items:center;}
  .cube{ position:relative; width:64px; height:64px; transform-style:preserve-3d; }
  .cube .face{position:absolute;}
  .cube .top{
    width:64px;height:37px; top:-18px; left:0;
    clip-path:polygon(50% 0, 100% 30%, 50% 60%, 0 30%);
  }
  .cube .left{
    width:32px;height:44px; top:14px; left:0;
    clip-path:polygon(0 15%, 100% 0, 100% 100%, 0 85%);
  }
  .cube .right{
    width:32px;height:44px; top:14px; left:32px;
    clip-path:polygon(0 0, 100% 15%, 100% 85%, 0 100%);
  }

  .biome-name{font-family:var(--font-display); font-size:11px; text-align:center; color:var(--text); margin-bottom:6px; letter-spacing:0.5px;}
  .biome-sub{font-size:12.5px; text-align:center; color:var(--text-faint); font-family:var(--font-mono); margin-bottom:10px;}
  .biome-progress{height:6px; border-radius:6px; background:#0e0e17; overflow:hidden; border:1px solid var(--panel-border);}
  .biome-progress-fill{height:100%;}
  .lock-badge{
    position:absolute; top:10px; right:10px; font-size:16px;
  }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:var(--font-body); font-weight:700; font-size:15px;
    background:var(--grass); color:#0e1a05;
    border:none; border-radius:8px; padding:10px 18px;
    cursor:pointer; transition:filter .15s ease, transform .1s ease;
  }
  .btn:hover{filter:brightness(1.1);}
  .btn:active{transform:scale(0.97);}
  .btn.secondary{background:var(--panel-light); color:var(--text); border:1px solid var(--panel-border);}
  .btn.gold{background:linear-gradient(145deg, var(--gold-glow), var(--gold)); color:#3a2a05;}
  .btn.danger{background:var(--danger); color:#fff;}
  .btn:disabled{opacity:0.45; cursor:not-allowed; filter:none;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}

  /* ---------- Biome detail ---------- */
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--text-faint); font-family:var(--font-mono); font-size:13px;
    cursor:pointer; margin-bottom:14px; background:none; border:none; padding:0;
  }
  .back-link:hover{color:var(--gold);}
  .game-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-top:18px;}
  .game-card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius);
    padding:16px; cursor:pointer; transition:border-color .15s ease, transform .15s ease;
  }
  .game-card:hover{border-color:var(--gold); transform:translateY(-2px);}
  .game-icon{font-size:28px; margin-bottom:8px;}
  .game-title{font-weight:800; font-size:16px; margin-bottom:4px;}
  .game-desc{font-size:13px; color:var(--text-dim); line-height:1.4;}
  .boss-card{
    grid-column:1/-1;
    background:linear-gradient(120deg, rgba(232,112,61,0.15), var(--panel));
    border:1px solid var(--ember);
  }
  .boss-card:hover{border-color:var(--gold-glow);}

  /* ---------- Game shell ---------- */
  .game-shell{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius);
    padding:24px; text-align:center;
  }
  .game-shell .prompt-label{font-family:var(--font-mono); font-size:12px; color:var(--text-faint); letter-spacing:1px; margin-bottom:10px;}
  .word-hint{font-size:16px; color:var(--text-dim); margin-bottom:18px; min-height:22px;}
  .word-hint b{color:var(--sky);}

  .scramble-letters{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
  .scramble-tile{
    width:44px; height:52px; background:var(--panel-light); border:1px solid var(--panel-border);
    border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; font-size:22px; cursor:pointer; user-select:none;
    transition:transform .1s ease, background .15s ease;
  }
  .scramble-tile:hover{transform:translateY(-3px); border-color:var(--gold);}
  .scramble-tile.used{opacity:0.25; pointer-events:none;}
  .answer-slots{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:20px; min-height:56px;}
  .answer-slot{
    width:44px; height:52px; border-bottom:3px solid var(--panel-border);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; font-size:22px; cursor:pointer;
  }
  .answer-slot.filled{border-color:var(--grass-glow); color:var(--grass-glow);}

  input.spell-input{
    font-family:var(--font-mono); font-size:24px; text-align:center;
    background:var(--bg-deep); color:var(--text); border:2px solid var(--panel-border);
    border-radius:8px; padding:12px 16px; width:min(320px, 90%); letter-spacing:2px;
    outline:none;
  }
  input.spell-input:focus{border-color:var(--gold);}
  input.spell-input.correct{border-color:var(--ok); color:var(--grass-glow);}
  input.spell-input.wrong{border-color:var(--danger); color:#ff9d99;}

  .feedback{min-height:26px; font-weight:700; margin-top:12px; font-size:15px;}
  .feedback.ok{color:var(--grass-glow);}
  .feedback.bad{color:#ff9d99;}

  /* match game */
  .match-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px;}
  @media (max-width:520px){ .match-grid{grid-template-columns:repeat(3,1fr);} }
  .match-tile{
    background:var(--panel-light); border:1px solid var(--panel-border); border-radius:8px;
    min-height:76px; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:8px; font-size:13.5px; cursor:pointer; transition:all .15s ease;
  }
  .match-tile.word{font-family:var(--font-mono); font-weight:700; font-size:16px;}
  .match-tile.selected{border-color:var(--gold); background:#33304a;}
  .match-tile.matched{opacity:0.3; border-color:var(--grass-glow); pointer-events:none;}
  .match-tile.shake{animation:shake .3s ease;}
  @keyframes shake{ 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

  /* boss */
  .boss-health-wrap{margin-bottom:20px;}
  .boss-health-label{font-family:var(--font-mono); font-size:12px; color:var(--text-faint); margin-bottom:6px;}
  .boss-health{height:16px; border-radius:8px; background:#0e0e17; border:1px solid var(--panel-border); overflow:hidden;}
  .boss-health-fill{height:100%; background:linear-gradient(90deg, var(--ember), #ff9a5c); transition:width .4s ease;}
  .boss-emoji{font-size:56px; margin-bottom:6px; display:block; transition:transform .2s ease;}
  .boss-emoji.hit{animation:hitshake .3s ease;}
  @keyframes hitshake{ 0%,100%{transform:scale(1);} 50%{transform:scale(0.85) rotate(-6deg);} }
  .boss-options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  @media (max-width:460px){ .boss-options{grid-template-columns:1fr;} }
  .boss-opt{
    background:var(--panel-light); border:1px solid var(--panel-border); border-radius:8px;
    padding:12px; font-family:var(--font-mono); font-size:16px; cursor:pointer; transition:all .15s ease;
  }
  .boss-opt:hover{border-color:var(--gold);}
  .boss-opt.right{border-color:var(--ok); background:rgba(111,174,62,0.2);}
  .boss-opt.wrong{border-color:var(--danger); background:rgba(217,83,79,0.2);}

  /* result panel */
  .result-panel{text-align:center; padding:30px 20px;}
  .result-panel .big-emoji{font-size:64px; margin-bottom:8px;}
  .result-panel h2{font-family:var(--font-display); font-size:16px; color:var(--gold-glow); margin-bottom:10px;}
  .result-stats{display:flex; justify-content:center; gap:26px; margin:18px 0; flex-wrap:wrap;}
  .result-stat{text-align:center;}
  .result-stat .n{font-family:var(--font-mono); font-size:26px; font-weight:700; color:var(--sky);}
  .result-stat .l{font-size:12px; color:var(--text-faint);}

  /* inventory */
  .inv-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .inv-card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius);
    padding:14px;
  }
  .inv-word{font-family:var(--font-mono); font-weight:700; font-size:17px; color:var(--text);}
  .inv-de{font-size:12.5px; color:var(--text-faint); margin-bottom:8px;}
  .stars{font-size:13px; letter-spacing:2px;}
  .star-filled{color:var(--gold-glow);}
  .star-empty{color:#3a3a52;}
  .inv-empty{color:var(--text-faint); font-size:14px; padding:30px 0; text-align:center;}

  /* admin */
  .admin-form{display:grid; gap:12px; max-width:480px;}
  .admin-form label{font-size:13px; color:var(--text-dim); display:block; margin-bottom:4px;}
  .admin-form input, .admin-form select, .admin-form textarea{
    width:100%; background:var(--bg-deep); border:1px solid var(--panel-border); border-radius:6px;
    color:var(--text); padding:9px 10px; font-family:var(--font-body); font-size:14.5px; outline:none;
  }
  .admin-form input:focus, .admin-form select:focus, .admin-form textarea:focus{border-color:var(--gold);}
  .admin-list{margin-top:22px;}
  .admin-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px;
    padding:10px 14px; margin-bottom:8px; font-size:14px;
  }
  .admin-row .aw{font-family:var(--font-mono); font-weight:700;}
  .admin-row .meta{color:var(--text-faint); font-size:12.5px;}
  .del-btn{background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:16px;}
  .del-btn:hover{color:var(--danger);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--panel-light); border:1px solid var(--gold); color:var(--text);
    padding:10px 18px; border-radius:8px; font-size:14px; z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .loading{text-align:center; color:var(--text-faint); padding:40px; font-family:var(--font-mono); font-size:13px;}
  .footnote{color:var(--text-faint); font-size:12px; text-align:center; margin-top:36px; font-family:var(--font-mono);}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading the realm…</div></div>

<script>
(function(){

/* ================= DATA ================= */

const BIOMES = [
  {id:'meadow', name:'WHISPERING MEADOW', color:'var(--grass)', top:'var(--grass-glow)', left:'var(--grass-dark)', right:'#3d641f',
   sub:'Level 1 · Beginner', order:0,
   story:"The bridge out of the village crumbled long ago. The old signpost is missing half its letters. To rebuild it, you'll need to relearn the simplest words \u2014 the ones every explorer starts with."},
  {id:'cave', name:'GLIMMER CAVES', color:'var(--stone)', top:'#a6a8c0', left:'var(--stone)', right:'#4d4f63',
   sub:'Level 2 · Explorer', order:1,
   story:"Deep beneath the meadow, the caves echo with unfinished sentences. Something down here traps words in stone \u2014 only careful spelling sets them free."},
  {id:'mountain', name:'IRONPEAK RIDGE', color:'#8b8fa3', top:'#c7cadb', left:'#8b8fa3', right:'#4a4d5c',
   sub:'Level 3 · Adventurer', order:2,
   story:"The climb is steep and the air thin. Old carvings on the rock face are half-worn away. Piece together what they once said, and the path to the summit will open."},
  {id:'ocean', name:'SUNKEN SHOALS', color:'var(--sky)', top:'#b9e6f2', left:'var(--sky)', right:'#3f7d90',
   sub:'Level 4 · Voyager', order:3,
   story:"The tide pulls at old shipwrecks full of scattered letters. Somewhere below, a message in a bottle is waiting \u2014 if you can read between the waves."},
];

const WORDS = [
  // meadow
  {id:'explore', biome:'meadow', word:'explore', de:'erkunden', ex:"Let's explore the forest before it gets dark."},
  {id:'shelter', biome:'meadow', word:'shelter', de:'die Unterkunft / der Schutz', ex:"We built a shelter out of branches and leaves."},
  {id:'gather', biome:'meadow', word:'gather', de:'sammeln', ex:"Gather some wood before the sun goes down."},
  {id:'journey', biome:'meadow', word:'journey', de:'die Reise', ex:"It was a long journey across the meadow."},
  {id:'discover', biome:'meadow', word:'discover', de:'entdecken', ex:"You might discover something amazing behind that hill."},
  {id:'village', biome:'meadow', word:'village', de:'das Dorf', ex:"The village was quiet in the early morning."},
  // cave
  {id:'torch', biome:'cave', word:'torch', de:'die Fackel', ex:"He held up a torch to light the tunnel."},
  {id:'tunnel', biome:'cave', word:'tunnel', de:'der Tunnel', ex:"The tunnel went deeper than we expected."},
  {id:'echo', biome:'cave', word:'echo', de:'das Echo', ex:"My voice made a strange echo in the cave."},
  {id:'treasure', biome:'cave', word:'treasure', de:'der Schatz', ex:"They found a hidden treasure behind the wall."},
  {id:'narrow', biome:'cave', word:'narrow', de:'eng / schmal', ex:"The passage was too narrow to walk through side by side."},
  {id:'careful', biome:'cave', word:'careful', de:'vorsichtig', ex:"Be careful, the floor is slippery down here."},
  // mountain
  {id:'summit', biome:'mountain', word:'summit', de:'der Gipfel', ex:"We finally reached the summit at sunset."},
  {id:'climb', biome:'mountain', word:'climb', de:'klettern', ex:"It took hours to climb the steep ridge."},
  {id:'boulder', biome:'mountain', word:'boulder', de:'der Felsblock', ex:"A huge boulder was blocking the path."},
  {id:'exhausted', biome:'mountain', word:'exhausted', de:'erschöpft', ex:"By the top, everyone was completely exhausted."},
  {id:'steep', biome:'mountain', word:'steep', de:'steil', ex:"The trail got steep near the peak."},
  {id:'breathe', biome:'mountain', word:'breathe', de:'atmen', ex:"Stop and breathe \u2014 the air is thinner up here."},
  // ocean
  {id:'current', biome:'ocean', word:'current', de:'die Strömung', ex:"The current pulled the boat away from shore."},
  {id:'coral', biome:'ocean', word:'coral', de:'die Koralle', ex:"Bright coral grew along the sunken ship."},
  {id:'drift', biome:'ocean', word:'drift', de:'treiben', ex:"The bottle began to drift out to sea."},
  {id:'surface', biome:'ocean', word:'surface', de:'die Oberfläche', ex:"We swam back up to the surface for air."},
  {id:'shore', biome:'ocean', word:'shore', de:'das Ufer', ex:"The waves crashed gently against the shore."},
  {id:'wreck', biome:'ocean', word:'wreck', de:'das Wrack', ex:"An old wreck lay quietly on the seabed."},
];

const CUSTOM_KEY = 'wc_custom_words';
const STATE_KEY = 'wc_player_state';

/* ================= STATE ================= */

let customWords = [];
let allWords = [...WORDS];

let state = {
  xp: 0,
  unlocked: ['meadow'],
  completedBiomes: [],
  mastery: {},      // wordId -> 0..5
  attempts: {},      // wordId -> {seen, correct}
};

let view = { screen: 'map', biome: null, game: null };

function xpToLevel(xp){ return Math.floor(xp/100)+1; }
function xpIntoLevel(xp){ return xp % 100; }

function wordsFor(biomeId){ return allWords.filter(w=>w.biome===biomeId); }
function masteryOf(id){ return state.mastery[id]||0; }
function isBiomeUnlocked(id){ return state.unlocked.includes(id); }
function isBiomeDone(id){ return state.completedBiomes.includes(id); }

function biomeProgress(biomeId){
  const ws = wordsFor(biomeId);
  if(ws.length===0) return 0;
  const total = ws.reduce((s,w)=>s+masteryOf(w.id),0);
  return Math.round((total/(ws.length*5))*100);
}

async function saveState(){
  try{
    await window.storage.set(STATE_KEY, JSON.stringify(state), false);
  }catch(e){ console.error('save failed', e); }
}
async function loadState(){
  try{
    const r = await window.storage.get(STATE_KEY, false);
    if(r && r.value){ state = Object.assign(state, JSON.parse(r.value)); }
  }catch(e){ /* no state yet */ }
}
async function saveCustomWords(){
  try{
    await window.storage.set(CUSTOM_KEY, JSON.stringify(customWords), false);
  }catch(e){ console.error('save failed', e); }
}
async function loadCustomWords(){
  try{
    const r = await window.storage.get(CUSTOM_KEY, false);
    if(r && r.value){ customWords = JSON.parse(r.value); }
  }catch(e){ customWords = []; }
  allWords = [...WORDS, ...customWords];
}

function addXP(n){
  state.xp += n;
  saveState();
}
function recordAttempt(wordId, correct){
  if(!state.attempts[wordId]) state.attempts[wordId] = {seen:0, correct:0};
  state.attempts[wordId].seen++;
  if(correct){
    state.attempts[wordId].correct++;
    state.mastery[wordId] = Math.min(5, (state.mastery[wordId]||0)+1);
    addXP(10);
  } else {
    addXP(2);
  }
  saveState();
}
function maybeUnlockNext(biomeId){
  const idx = BIOMES.findIndex(b=>b.id===biomeId);
  if(!state.completedBiomes.includes(biomeId)) state.completedBiomes.push(biomeId);
  if(idx>=0 && idx+1<BIOMES.length){
    const next = BIOMES[idx+1].id;
    if(!state.unlocked.includes(next)) state.unlocked.push(next);
  }
  saveState();
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ================= GAME STATE ================= */

let G = {}; // scratch state for the active mini-game

function startGame(biomeId, type){
  G = { biomeId, type, words: shuffle(wordsFor(biomeId)), idx: 0, correctCount:0, wrongCount:0 };
  view = { screen:'game', biome: biomeId, game: type };
  if(type==='scramble') setupScramble();
  if(type==='forge') setupForge();
  if(type==='match') setupMatch();
  if(type==='boss') setupBoss();
  renderScreen();
}

function gameScreen(){
  if(G.type==='scramble') return scrambleHTML();
  if(G.type==='forge') return forgeHTML();
  if(G.type==='match') return matchHTML();
  if(G.type==='boss') return bossHTML();
  return '';
}

/* ---- Ore Scramble (anagram) ---- */
function setupScramble(){
  nextScramble();
}
function nextScramble(){
  if(G.idx >= G.words.length){ return finishGame(); }
  const w = G.words[G.idx];
  let letters = w.word.split('');
  let scrambled;
  do{ scrambled = shuffle(letters); } while(scrambled.join('')===w.word && letters.length>1);
  G.current = { word: w, scrambled, picked: [] };
}
function scrambleHTML(){
  const {word, scrambled, picked} = G.current;
  const usedIdx = picked.map(p=>p.i);
  const tiles = scrambled.map((ch,i)=>`
    <div class="scramble-tile ${usedIdx.includes(i)?'used':''}" onclick="WC.scramblePick(${i})">${ch.toUpperCase()}</div>
  `).join('');
  const slots = Array.from({length:word.word.length}).map((_,i)=>{
    const filled = picked[i];
    return `<div class="answer-slot ${filled?'filled':''}" onclick="${filled?`WC.scrambleUndo(${i})`:''}">${filled?filled.ch.toUpperCase():''}</div>`;
  }).join('');
  return `
    <button class="back-link" onclick="WC.abandonGame()">\u2190 leave realm</button>
    <div class="game-shell">
      <div class="prompt-label">ORE SCRAMBLE \u00b7 ${G.idx+1} / ${G.words.length}</div>
      <div class="word-hint">Clue: <b>${word.de}</b> \u2014 <i>"${word.ex}"</i></div>
      <div class="answer-slots">${slots}</div>
      <div class="scramble-letters">${tiles}</div>
      <div class="feedback ${G.feedback?G.feedback.cls:''}">${G.feedback?G.feedback.msg:''}</div>
    </div>
  `;
}
window.WC = window.WC || {};
WC.scramblePick = function(i){
  const {word, scrambled, picked} = G.current;
  if(picked.length>=word.word.length) return;
  const ch = scrambled[i];
  picked.push({i, ch});
  if(picked.length===word.word.length){
    const guess = picked.map(p=>p.ch).join('').toLowerCase();
    const correct = guess===word.word.toLowerCase();
    recordAttempt(word.id, correct);
    G.feedback = correct
      ? {cls:'ok', msg:'\u2728 Mined! "'+word.word+'" = '+word.de}
      : {cls:'bad', msg:'Not quite \u2014 it was "'+word.word+'". Try the next one!'};
    if(correct) G.correctCount++; else G.wrongCount++;
    setTimeout(()=>{ G.idx++; G.feedback=null; nextScramble(); renderScreen(); }, 1400);
  }
  renderScreen();
};
WC.scrambleUndo = function(i){
  G.current.picked = G.current.picked.filter(p=>{
    return !(G.current.picked.indexOf(p)===i);
  });
  // simpler: rebuild by removing the i-th picked entry
  G.current.picked.splice(i,1);
  renderScreen();
};

/* ---- Forge Type (spelling input) ---- */
function setupForge(){ nextForge(); }
function nextForge(){
  if(G.idx >= G.words.length){ return finishGame(); }
  G.current = { word: G.words[G.idx], value:'', checked:false };
}
function forgeHTML(){
  const {word, value, checked} = G.current;
  return `
    <button class="back-link" onclick="WC.abandonGame()">\u2190 leave realm</button>
    <div class="game-shell">
      <div class="prompt-label">FORGE TYPE \u00b7 ${G.idx+1} / ${G.words.length}</div>
      <div class="word-hint">German clue: <b>${word.de}</b><br><i>"${word.ex.replace(word.word, '_____')}"</i></div>
      <input id="forgeInput" class="spell-input ${checked?(G.lastCorrect?'correct':'wrong'):''}" type="text"
        autocomplete="off" autocapitalize="off" spellcheck="false"
        value="${value}" placeholder="type the word..." onkeydown="WC.forgeKey(event)" oninput="WC.forgeInput(this.value)"/>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn gold" onclick="WC.forgeCheck()">Forge It \u2692\uFE0F</button>
      </div>
      <div class="feedback ${G.feedback?G.feedback.cls:''}">${G.feedback?G.feedback.msg:''}</div>
    </div>
  `;
}
WC.forgeInput = function(v){ G.current.value = v; };
WC.forgeKey = function(e){ if(e.key==='Enter') WC.forgeCheck(); };
WC.forgeCheck = function(){
  if(G.current.checked) return;
  const {word, value} = G.current;
  const correct = value.trim().toLowerCase()===word.word.toLowerCase();
  G.lastCorrect = correct;
  G.current.checked = true;
  recordAttempt(word.id, correct);
  if(correct){ G.correctCount++; G.feedback={cls:'ok', msg:'\u2728 Perfectly forged!'}; }
  else { G.wrongCount++; G.feedback={cls:'bad', msg:'The correct spelling is "'+word.word+'". Keep going!'}; }
  renderScreen();
  const inp = document.getElementById('forgeInput');
  if(inp) inp.focus();
  setTimeout(()=>{ G.idx++; G.feedback=null; nextForge(); renderScreen(); const i2=document.getElementById('forgeInput'); if(i2) i2.focus(); }, 1500);
};

/* ---- Rune Match (pairs) ---- */
function setupMatch(){
  const chosen = shuffle(wordsFor(G.biomeId)).slice(0, Math.min(6, wordsFor(G.biomeId).length));
  G.pairsLeft = chosen.length;
  const left = chosen.map(w=>({key:w.id, type:'word', label:w.word}));
  const right = chosen.map(w=>({key:w.id, type:'def', label:w.de}));
  G.tiles = shuffle([...left, ...right]).map((t,i)=>({...t, uid:i, matched:false}));
  G.selected = [];
}
function matchHTML(){
  const tiles = G.tiles.map(t=>{
    const sel = G.selected.includes(t.uid);
    return `<div class="match-tile ${t.type==='word'?'word':''} ${sel?'selected':''} ${t.matched?'matched':''} ${G.shakeUid===t.uid?'shake':''}"
      onclick="WC.matchPick(${t.uid})">${t.label}</div>`;
  }).join('');
  return `
    <button class="back-link" onclick="WC.abandonGame()">\u2190 leave realm</button>
    <div class="game-shell">
      <div class="prompt-label">RUNE MATCH \u00b7 pairs left: ${G.pairsLeft}</div>
      <div class="word-hint">Tap an English word, then its German meaning.</div>
      <div class="match-grid">${tiles}</div>
      <div class="feedback ${G.feedback?G.feedback.cls:''}">${G.feedback?G.feedback.msg:''}</div>
    </div>
  `;
}
WC.matchPick = function(uid){
  const tile = G.tiles.find(t=>t.uid===uid);
  if(!tile || tile.matched || G.selected.includes(uid)) return;
  G.selected.push(uid);
  if(G.selected.length===2){
    const [a,b] = G.selected.map(u=>G.tiles.find(t=>t.uid===u));
    if(a.key===b.key){
      a.matched = true; b.matched = true;
      G.pairsLeft--;
      recordAttempt(a.key, true);
      G.correctCount++;
      G.feedback = {cls:'ok', msg:'\u2728 Runes aligned!'};
      G.selected = [];
      renderScreen();
      if(G.pairsLeft===0){ setTimeout(finishGame, 900); }
    } else {
      G.wrongCount++;
      G.shakeUid = b.uid;
      G.feedback = {cls:'bad', msg:'Not a match \u2014 try again.'};
      renderScreen();
      setTimeout(()=>{ G.selected=[]; G.shakeUid=null; G.feedback=null; renderScreen(); }, 700);
    }
  } else {
    renderScreen();
  }
};

/* ---- Boss battle (rapid quiz) ---- */
function setupBoss(){
  const ws = shuffle(wordsFor(G.biomeId));
  G.bossQuestions = ws.map(w=>{
    const distractors = shuffle(allWords.filter(x=>x.id!==w.id)).slice(0,3).map(x=>x.de);
    const opts = shuffle([w.de, ...distractors]);
    return {word:w, opts, answered:false};
  });
  G.bossIdx = 0;
  G.bossHealth = 100;
  G.bossStep = Math.ceil(100 / G.bossQuestions.length);
}
function bossHTML(){
  if(G.bossIdx >= G.bossQuestions.length){
    return `<div class="loading">Golem defeated\u2026</div>`;
  }
  const q = G.bossQuestions[G.bossIdx];
  const opts = q.opts.map(o=>{
    let cls = '';
    if(q.picked!==undefined){
      if(o===q.word.de) cls='right';
      else if(o===q.picked && o!==q.word.de) cls='wrong';
    }
    return `<div class="boss-opt ${cls}" onclick="WC.bossAnswer('${o.replace(/'/g,"\\'")}')">${o}</div>`;
  }).join('');
  return `
    <button class="back-link" onclick="WC.abandonGame()">\u2190 flee the battle</button>
    <div class="game-shell">
      <div class="prompt-label">WORD GOLEM \u00b7 question ${G.bossIdx+1} / ${G.bossQuestions.length}</div>
      <span class="boss-emoji ${G.bossHit?'hit':''}">\uD83D\uDC7E</span>
      <div class="boss-health-wrap">
        <div class="boss-health-label">GOLEM HEALTH</div>
        <div class="boss-health"><div class="boss-health-fill" style="width:${G.bossHealth}%"></div></div>
      </div>
      <div class="word-hint">What does <b>${q.word.word}</b> mean?</div>
      <div class="boss-options">${opts}</div>
      <div class="feedback ${G.feedback?G.feedback.cls:''}">${G.feedback?G.feedback.msg:''}</div>
    </div>
  `;
}
WC.bossAnswer = function(pick){
  const q = G.bossQuestions[G.bossIdx];
  if(q.picked!==undefined) return;
  q.picked = pick;
  const correct = pick===q.word.de;
  recordAttempt(q.word.id, correct);
  if(correct){
    G.correctCount++;
    G.bossHealth = Math.max(0, G.bossHealth - G.bossStep);
    G.bossHit = true;
    G.feedback = {cls:'ok', msg:'\u2694\uFE0F Hit! The golem staggers.'};
  } else {
    G.wrongCount++;
    G.bossHit = false;
    G.feedback = {cls:'bad', msg:'Missed \u2014 it was "'+q.word.de+'".'};
  }
  renderScreen();
  setTimeout(()=>{ G.bossHit=false; G.bossIdx++; G.feedback=null; renderScreen(); if(G.bossIdx>=G.bossQuestions.length) finishBoss(); }, 1100);
};
function finishBoss(){
  const total = G.bossQuestions.length;
  const scorePct = Math.round((G.correctCount/total)*100);
  const won = scorePct >= 70;
  if(won) maybeUnlockNext(G.biomeId);
  view = {screen:'result', biome:G.biomeId, game:'boss'};
  G.won = won;
  G.scorePct = scorePct;
  renderScreen();
}

/* ---- shared finish for non-boss games ---- */
function finishGame(){
  view = {screen:'result', biome:G.biomeId, game:G.type};
  renderScreen();
}

WC.addCustomWord = async function(){
  const word = document.getElementById('af-word').value.trim();
  const de = document.getElementById('af-de').value.trim();
  const ex = document.getElementById('af-ex').value.trim();
  const biome = document.getElementById('af-biome').value;
  const msg = document.getElementById('af-msg');
  if(!word || !de || !ex){
    msg.className='feedback bad'; msg.textContent='Please fill in the word, meaning, and an example sentence.';
    return;
  }
  if(!ex.toLowerCase().includes(word.toLowerCase())){
    msg.className='feedback bad'; msg.textContent='The example sentence should include the word itself.';
    return;
  }
  const id = word.toLowerCase().replace(/[^a-z]/g,'') + '_' + Date.now();
  customWords.push({id, word, de, ex, biome});
  allWords = [...WORDS, ...customWords];
  await saveCustomWords();
  msg.className='feedback ok'; msg.textContent='\u2728 Added to '+BIOMES.find(b=>b.id===biome).name+'!';
  document.getElementById('af-word').value='';
  document.getElementById('af-de').value='';
  document.getElementById('af-ex').value='';
  renderScreen();
};
WC.deleteCustomWord = async function(i){
  customWords.splice(i,1);
  allWords = [...WORDS, ...customWords];
  await saveCustomWords();
  renderScreen();
};

/* ================= NAV ================= */

WC.go = function(screen){ view = {screen, biome:null, game:null}; render(); window.scrollTo(0,0); };
WC.openBiome = function(biomeId){ view = {screen:'biome', biome:biomeId, game:null}; render(); window.scrollTo(0,0); };
WC.startGame = function(biomeId, type){ startGame(biomeId, type); window.scrollTo(0,0); };
WC.abandonGame = function(){ WC.openBiome(G.biomeId); };

/* ================= INIT ================= */

async function init(){
  await Promise.all([loadState(), loadCustomWords()]);
  render();
}
init();

})();
</script>
