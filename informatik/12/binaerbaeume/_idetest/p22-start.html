<script type="text/plain" title="Binaerbaum.java">
/**
 * Das Spielerverzeichnis als geordneter Binärbaum. wurzel ist nie null:
 * Im leeren Baum ist die Wurzel ein Abschluss.
 */
public class Binaerbaum {
   private BaumElement wurzel;

   public Binaerbaum() {
      wurzel = new Abschluss();
   }

   public BaumElement getWurzel() {
      return wurzel;
   }

   // Rückgabe false, wenn der Name schon vergeben ist
   public boolean einfuegen(DatenElement d) {
      if (suchen(d) != null) {
         return false;
      }
      // TODO 3c (Aufgabe 3): wurzel.einfuegen(d) aufrufen – und die Rückgabe?
      return true;
   }

   public DatenElement suchen(DatenElement d) {
      return wurzel.suchen(d);
   }
}
</script>
<script type="text/plain" title="BaumElement.java">
/**
 * Gemeinsamer Typ von Knoten und Abschluss (Entwurfsmuster Kompositum,
 * wie ListenElement in Station 1.4).
 */
public abstract class BaumElement {

   // Fügt d ein. Rückgabe: das Element, das danach an dieser Stelle steht.
   public abstract BaumElement einfuegen(DatenElement d);

   // Sucht Daten mit demselben Schlüssel wie d.
   // Rückgabe: die gespeicherten Daten oder null, wenn es sie nicht gibt.
   public abstract DatenElement suchen(DatenElement d);
}
</script>

<script type="text/plain" title="DatenElement.java">
/**
 * Der Vertrag für alles, was im Verzeichnis stehen darf (wie in 1.3 und 1.4).
 */
public interface DatenElement {
   String gibSchluesselwert();

   boolean istGleich(DatenElement d);        // gleicher Schlüssel

   boolean istGroesserAls(DatenElement d);   // eigener Schlüssel kommt im Alphabet später
}
</script>
<script type="text/plain" title="Spieler.java">
/**
 * Ein Account im Online-Spiel Sternenstaub. Der Schlüssel ist der Name.
 */
public class Spieler implements DatenElement {
   private String name;
   private int level;

   public Spieler(String name, int level) {
      this.name = name;
      this.level = level;
   }

   // Zum Suchen: ein Spieler, von dem man nur den Namen kennt
   public Spieler(String name) {
      this.name = name;
      this.level = 0;
   }

   public String getName() {
      return name;
   }

   public int getLevel() {
      return level;
   }

   public String gibSchluesselwert() {
      return name;
   }

   public boolean istGleich(DatenElement d) {
      return name.equals(d.gibSchluesselwert());
   }

   // compareTo vergleicht Texte alphabetisch: Ergebnis > 0, wenn name später kommt
   public boolean istGroesserAls(DatenElement d) {
      return name.compareTo(d.gibSchluesselwert()) > 0;
   }
}
</script>
<script type="text/plain" title="BaumZeichner.java" data-online-ide="{ 'readOnly': true }">
/**
 * Zeichnet einen Binärbaum in die Welt. Fertig, muss nicht verändert werden.
 * Knoten: orange Kreise. Abschlüsse: kleine graue Quadrate.
 * Ab Ebene 6 wird nicht weiter gezeichnet (Pünktchen).
 */
public class BaumZeichner {

   public void zeichne(Binaerbaum baum) {
      zeichneTeilbaum(baum.getWurzel(), 400, 45, 200, 1);
   }

   private void zeichneTeilbaum(BaumElement e, double x, double y, double abstand, int ebene) {
      if (e instanceof Knoten) {
         Knoten k = (Knoten) e;
         if (ebene > 6) {
            Text t = new Text(x - 10, y - 20, 28, "…");
            t.setFillColor(Color.white);
            return;
         }
         zeichneAst(k.getLinks(), x, y, -abstand, ebene);
         zeichneAst(k.getRechts(), x, y, abstand, ebene);
         Circle c = new Circle(x, y, 30);
         c.setFillColor(Color.orange);
         c.setBorderColor(Color.white);
         Text t = new Text(x, y - 11, 20, k.getDaten().gibSchluesselwert());
         t.setAlignment(Alignment.center);
         t.setFillColor(Color.black);
      } else {
         Rectangle q = new Rectangle(x - 7, y - 7, 14, 14);
         q.setFillColor(Color.gray);
         q.setBorderColor(Color.gray);
      }
   }

   // Linie zum Kind; ein Abschluss hängt nur kurz unter dem Knoten
   private void zeichneAst(BaumElement kind, double x, double y, double dx, int ebene) {
      double zx = x + dx;
      double zy = y + 75;
      if (!(kind instanceof Knoten)) {
         zx = x + dx / Math.abs(dx) * Math.min(Math.abs(dx), 28);
         zy = y + 50;
      }
      Line l = new Line(x, y, zx, zy);
      l.setBorderColor(Color.gray);
      zeichneTeilbaum(kind, zx, zy, Math.abs(dx) / 2, ebene + 1);
   }
}
</script>
<script type="text/plain" title="BaumTest.java" data-online-ide="{ 'readOnly': true }">
/**
 * Selbsttest des Spielerverzeichnisses. Bitte nicht verändern!
 * Starten: Klick auf das kleine Dreieck links neben "@Test"
 * (ganz oben: alle Tests) oder auf der Website "Tests starten".
 */
public class BaumTest {

   private String name(BaumElement e) {
      if (e instanceof Knoten) {
         return ((Knoten) e).getDaten().gibSchluesselwert();
      }
      return "Abschluss";
   }

   private BaumElement links(BaumElement e) {
      if (e instanceof Knoten) {
         return ((Knoten) e).getLinks();
      }
      return e;
   }

   private BaumElement rechts(BaumElement e) {
      if (e instanceof Knoten) {
         return ((Knoten) e).getRechts();
      }
      return e;
   }

   private Binaerbaum elf() {
      Binaerbaum b = new Binaerbaum();
      b.einfuegen(new Spieler("Mika", 34));
      b.einfuegen(new Spieler("Emil", 12));
      b.einfuegen(new Spieler("Tara", 27));
      b.einfuegen(new Spieler("Bo", 8));
      b.einfuegen(new Spieler("Ines", 41));
      b.einfuegen(new Spieler("Pia", 19));
      b.einfuegen(new Spieler("Zoe", 3));
      b.einfuegen(new Spieler("Dana", 22));
      b.einfuegen(new Spieler("Kai", 15));
      b.einfuegen(new Spieler("Ruby", 50));
      b.einfuegen(new Spieler("Vik", 9));
      return b;
   }

   private Knoten dreiKnoten() {
      // Mika, darunter Emil und Tara: nur mit Knoten.einfuegen gebaut
      Knoten k = new Knoten(new Spieler("Mika", 34));
      k.einfuegen(new Spieler("Emil", 12));
      k.einfuegen(new Spieler("Tara", 27));
      return k;
   }

   @Test
   public void abschlussEinfuegen() {
      BaumElement e = new Abschluss().einfuegen(new Spieler("Mika", 34));
      Assertions.assertEquals("Mika", name(e), "Abschluss.einfuegen() muss einen neuen Knoten mit Mika zurückgeben.");
   }

   @Test
   public void knotenLiefertSichSelbst() {
      Knoten k = new Knoten(new Spieler("Mika", 34));
      BaumElement e = k.einfuegen(new Spieler("Emil", 12));
      Assertions.assertEquals("Emil", name(k.getLinks()), "Emil muss links unter Mika eingefügt werden.");
      Assertions.assertTrue(e == k, "Knoten.einfuegen() muss sich selbst (this) zurückgeben.");
   }

   @Test
   public void kleinerNachLinks() {
      Knoten k = dreiKnoten();
      Assertions.assertEquals("Emil", name(k.getLinks()), "Emil kommt im Alphabet vor Mika und gehört in den linken Teilbaum.");
   }

   @Test
   public void groesserNachRechts() {
      Knoten k = dreiKnoten();
      Assertions.assertEquals("Tara", name(k.getRechts()), "Tara kommt im Alphabet nach Mika und gehört in den rechten Teilbaum.");
   }

   @Test
   public void tieferEinfuegen() {
      Knoten k = dreiKnoten();
      k.einfuegen(new Spieler("Ines", 41));
      Assertions.assertEquals("Ines", name(rechts(k.getLinks())), "Ines kommt vor Mika (links) und nach Emil (rechts): Sie muss rechts unter Emil hängen.");
   }

   @Test
   public void gleicherNameNichtDoppelt() {
      Knoten k = dreiKnoten();
      Assertions.assertEquals("Emil", name(k.getLinks()), "Emil muss links unter Mika eingefügt werden.");
      k.einfuegen(new Spieler("Emil", 1));
      Assertions.assertEquals("Abschluss", name(links(k.getLinks())), "Emil gibt es schon: Unter Emil darf kein zweiter Knoten entstehen.");
      Assertions.assertEquals("Abschluss", name(rechts(k.getLinks())), "Emil gibt es schon: Unter Emil darf kein zweiter Knoten entstehen.");
   }

   @Test
   public void binaerbaumEinfuegen() {
      Binaerbaum b = new Binaerbaum();
      b.einfuegen(new Spieler("Mika", 34));
      b.einfuegen(new Spieler("Emil", 12));
      Assertions.assertEquals("Mika", name(b.getWurzel()), "Binaerbaum.einfuegen(): Nach dem ersten Einfügen muss die Wurzel ein Knoten sein. Trägst du die Rückgabe in wurzel ein?");
      Assertions.assertEquals("Emil", name(links(b.getWurzel())), "Binaerbaum.einfuegen(): Emil muss links unter Mika hängen.");
   }

   @Test
   public void elfAccounts() {
      BaumElement w = elf().getWurzel();
      Assertions.assertEquals("Dana", name(rechts(links(links(w)))), "Dana gehört rechts unter Bo.");
      Assertions.assertEquals("Ruby", name(rechts(links(rechts(w)))), "Ruby gehört rechts unter Pia.");
      Assertions.assertEquals("Vik", name(links(rechts(rechts(w)))), "Vik gehört links unter Zoe.");
   }

   @Test
   public void suchenAbschluss() {
      Assertions.assertTrue(new Abschluss().suchen(new Spieler("Kai")) == null, "Abschluss.suchen(): Im Abschluss ist nichts gespeichert.");
   }

   @Test
   public void suchenWurzel() {
      DatenElement x = elf().suchen(new Spieler("Mika"));
      Assertions.assertTrue(x != null, "Mika steht in der Wurzel und muss gefunden werden.");
      Assertions.assertEquals(34, ((Spieler) x).getLevel(), "suchen() muss die gespeicherten Daten zurückgeben (Mika hat Level 34), nicht den Suchbegriff.");
   }

   @Test
   public void suchenTief() {
      Binaerbaum b = elf();
      DatenElement x = b.suchen(new Spieler("Ruby"));
      Assertions.assertTrue(x != null, "Ruby (rechts unter Pia) muss gefunden werden.");
      Assertions.assertEquals(50, ((Spieler) x).getLevel(), "Ruby hat Level 50.");
      DatenElement y = b.suchen(new Spieler("Dana"));
      Assertions.assertTrue(y != null, "Dana (rechts unter Bo) muss gefunden werden.");
   }

   @Test
   public void suchenNichtVorhanden() {
      Binaerbaum b = elf();
      Assertions.assertTrue(b.suchen(new Spieler("Kai")) != null, "Kai muss gefunden werden. Erst danach zählt, ob Olaf und Aaron fehlen.");
      Assertions.assertTrue(b.suchen(new Spieler("Olaf")) == null, "Olaf gibt es nicht: suchen() muss null liefern.");
      Assertions.assertTrue(b.suchen(new Spieler("Aaron")) == null, "Aaron gibt es nicht: suchen() muss null liefern.");
   }

   @Test
   public void doppelterName() {
      Binaerbaum b = elf();
      Assertions.assertTrue(b.suchen(new Spieler("Kai")) != null, "Kai muss gefunden werden: Erst muss suchen() funktionieren.");
      Assertions.assertFalse(b.einfuegen(new Spieler("Kai", 1)), "Kai ist schon vergeben: einfuegen() muss false liefern.");
      Assertions.assertEquals(15, ((Spieler) b.suchen(new Spieler("Kai"))).getLevel(), "Der erste Kai (Level 15) muss erhalten bleiben.");
   }
}
</script>
