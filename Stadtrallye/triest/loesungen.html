<h1>Lösungen, Route und Ablauf</h1>
<div class="warn">
  <b>Nur für Begleitpersonen.</b> Gebt die Adresse und das Passwort nicht an die
  Gruppen weiter &ndash; die Rallye selbst liegt unter
  <a href="triest.html">triest.html</a>.
</div>

<h2>Auf einen Blick</h2>
<div class="card">
  <table>
    <tr><th>Start &amp; Ziel</th><td>Piazza dell&rsquo;Unità d&rsquo;Italia (Bushalt an den Rive)</td></tr>
    <tr><th>Stationen</th><td>8 Pflichtstationen + 1 optionale Bonusstation</td></tr>
    <tr><th>Strecke</th><td>ca. 3&nbsp;km, davon ca. 65&nbsp;Höhenmeter hinauf zum Dom</td></tr>
    <tr><th>Reine Gehzeit</th><td>ca. 55&nbsp;Minuten</td></tr>
    <tr><th>Gesamtdauer</th><td><b>2 bis 2,5&nbsp;Stunden</b> bei mittlerem bis langsamem Rätseltempo</td></tr>
    <tr><th>Bonus</th><td>+ ca. 20&nbsp;Minuten (Uferpromenade, nur bei Zeitüberschuss)</td></tr>
    <tr><th>Punkte</th><td>max. 24 (8&nbsp;&times;&nbsp;3) + 3 Bonuspunkte</td></tr>
    <tr><th>Freischaltcode</th><td><code>LIGNANO-Q12</code> (Groß-/Kleinschreibung egal)</td></tr>
  </table>
</div>

<div class="tip">
  <b>Der Freischaltcode</b> wird in der Rallye unter &bdquo;Hilfe &rarr; Wenn das GPS streikt&ldquo;
  eingegeben. Danach erscheint in jeder Station ein Knopf, mit dem die Gruppe den Ort
  von Hand als besucht markieren kann. Solche Stationen bekommen im Ergebnis ein
  &#9873;-Zeichen &ndash; ihr seht also, wo nicht per Ortung bestätigt wurde.
  Gebt den Code nur heraus, wenn die Ortung tatsächlich nicht funktioniert.
</div>

<h2>Wie schwer die Rätsel sind</h2>
<div class="card">
  <p>Die Stufen unterscheiden sich nicht nur in der Formulierung, sondern darin,
     <i>wie viel</i> sie preisgeben:</p>
  <ul>
    <li><b>Schwer (3&nbsp;P)</b> nennt den gesuchten Gegenstand nicht beim Namen und
        liefert keine Begriffe zum Nachschlagen frei Haus. Mehrere Rätsel sind nur
        lösbar, wenn die Gruppe vor Ort etwas erkennt <i>und</i> dazu etwas
        nachschlägt.</li>
    <li><b>Mittel (2&nbsp;P)</b> benennt das Thema und grenzt ein, lässt den
        entscheidenden Schritt aber offen.</li>
    <li><b>Leicht (1&nbsp;P)</b> führt bis kurz vor die Antwort (Buchstabenraster,
        direkte Definition).</li>
    <li><b>Vor-Ort-Hinweis:</b> jede Station hat einen zusätzlichen Tipp, der auf das
        richtige Detail zeigt. Er verlangt zweierlei &ndash; die Gruppe muss dicht am Ort
        stehen (25&ndash;70&nbsp;m), <i>und</i> er bleibt auf der schweren Stufe gesperrt.</li>
  </ul>
  <div class="tip" style="margin-bottom:0">
    <b>Praktische Folge:</b> Die Gruppen brauchen unterwegs Internet. In EU-Verträgen
    greift das Roaming, bei Prepaid-Karten lohnt eine Kontrolle vorher. Ohne Netz
    bleiben mehrere schwere Varianten unlösbar &ndash; die mittleren und leichten Stufen
    funktionieren aber auch offline, die Rallye selbst ohnehin.
  </div>
</div>

<h2>Route und Wegzeiten</h2>
<div class="card">
  <div class="tbl-wrap">
  <table>
    <tr><th>#</th><th>Station in der Rallye</th><th>Ort</th><th>Koordinaten</th><th>Radius</th><th>Weg</th></tr>

    <tr><td>2</td><td>Molo Audace</td><td>&mdash;</td><td>45.65229, 13.76608</td><td>130&nbsp;m</td><td>4&nbsp;Min</td></tr>
    <tr><td>3</td><td>Piazza della Borsa</td><td>&mdash;</td><td>45.65027, 13.77043</td><td>70&nbsp;m</td><td>6&nbsp;Min</td></tr>
    <tr><td>4</td><td>Canal Grande / Ponte Rosso</td><td>&mdash;</td><td>45.65219, 13.77220</td><td>55&nbsp;m</td><td>4&nbsp;Min</td></tr>
    <tr><td>5</td><td><i>Die Kirche mit den blauen Kuppeln</i></td><td>San Spiridione</td><td>45.65146, 13.77332</td><td>45&nbsp;m</td><td>2&nbsp;Min</td></tr>
    <tr><td>6</td><td>Teatro Romano</td><td>&mdash;</td><td>45.64917, 13.77167</td><td>70&nbsp;m</td><td>5&nbsp;Min</td></tr>

    <tr><td>8</td><td>Cattedrale di San Giusto</td><td>&mdash;</td><td>45.64639, 13.77250</td><td>95&nbsp;m</td><td>12&ndash;15&nbsp;Min bergauf</td></tr>

    <tr><td>&#9733;</td><td>Le Rive &ndash; Uferpromenade <i>(Bonus)</i></td><td>Molo Venezia</td><td>45.64756, 13.76136</td><td>150&nbsp;m</td><td>10&nbsp;Min hin, 10&nbsp;zurück</td></tr>

  </div>
  <p class="meta">Station&nbsp;5 heißt in der Rallye bewusst nicht nach ihrem Heiligen &ndash;
     der Name wäre die halbe Lösung. Der angegebene Radius ist der Grundwert; zusätzlich zieht
     die Rallye die vom Gerät gemeldete Messungenauigkeit ab (höchstens 100&nbsp;m), damit
     schlechte Fixes in den Altstadtgassen keine Gruppe aussperren. Ein einmal besuchter Ort
     bleibt dauerhaft freigeschaltet &ndash; die Gruppen dürfen zum Knobeln ins Café.</p>
</div>

<h2>Vorher ansagen</h2>
<div class="card">
  <ul>
    <li><b>Ein Handy pro Gruppe</b> legt die Gruppe an &ndash; das mit dem meisten Akku.
        Die Dauer-Ortung zieht spürbar Strom; in der Rallye gibt es dafür einen
        Pause-Knopf für die Café-Phase.</li>
    <li><b>Standortfreigabe erlauben</b>, wenn der Browser fragt. Ohne sie schaltet
        sich keine Station frei.</li>
    <li><b>Nachschlagen ist ausdrücklich erlaubt</b> und bei den schweren Varianten oft
        nötig. Die Lösungen selbst stehen nirgends im Netz &ndash; gesucht werden muss nach
        Sachwissen, nicht nach der Rallye.</li>
    <li><b>Sicherungscode</b>: Nach ein paar Stationen einmal unter &bdquo;Hilfe&ldquo;
        den Code kopieren und in einen Gruppenchat schicken. Dann ist der Stand auch
        bei leerem Akku nicht verloren.</li>
    <li><b>Treffpunkt und Uhrzeit</b> an der Piazza dell&rsquo;Unità fest vereinbaren.
        Die Rallye zeigt zwar eine Uhr, aber keinen Countdown.</li>
    <li><b>Bonusstation</b> nur freigeben, wenn eine Gruppe deutlich vor der Zeit liegt.</li>
    <li><b>Verkehr:</b> Auf dem Weg zum Teatro Romano und zum Dom wird mehrfach eine
        befahrene Straße gequert. Kurz erwähnen.</li>
  </ul>
</div>

<h2>Die Lösungen</h2>

<div class="card st">
  <h3>1 &middot; Piazza dell&rsquo;Unità d&rsquo;Italia</h3>
  <p class="meta">Fontana dei Quattro Continenti (1751&ndash;1754, G. B. Mazzoleni)</p>
  <div class="lvl"><b>Schwer:</b> Vier Figuren gehören zu einer Reihe, deren letztes Glied
     zur Bauzeit noch kein gesichertes Wissen war; eine englische Expedition schloss die
     Lücke zwei Jahrzehnte später. Was fehlt? <i>(Der Brunnen wird nicht benannt &ndash; die
     Gruppe muss selbst darauf kommen, dass es um Erdteile geht, und Cooks Reise finden.)</i></div>
  <div class="lvl"><b>Mittel:</b> Es geht um Erdteile; der Brunnen heißt <i>Fontana dei
     Quattro Continenti</i>; Cook 1770.</div>
  <div class="lvl"><b>Leicht:</b> Europa, Asien, Afrika, Amerika sind dargestellt &ndash;
     gesucht: Kontinent und Land zugleich, Hauptstadt Canberra.</div>
  <p class="sol">&rarr; Australien</p>
  <p class="meta">Akzeptiert: Australien, Australia</p>
</div>

<div class="card st">
  <h3>2 &middot; Molo Audace</h3>
  <p class="meta">Bronzene Windrose von 1925 am Kopf des Molos</p>
  <div class="lvl"><b>Schwer:</b> Einer der acht Windnamen auf der Scheibe steht heute für
     das Wetterereignis, das Triest prägt. <i>(Kein Hinweis auf Richtung, Geschwindigkeit
     oder Boreas &ndash; „Triest Wind“ zu suchen führt aber sofort zum Ziel.)</i></div>
  <div class="lvl"><b>Mittel:</b> Fallwind aus Nordosten über den Karst, über 150&nbsp;km/h,
     Name vom griechischen Gott des Nordwinds in italienischer Kurzform.</div>
  <div class="lvl"><b>Leicht:</b> Boreas &rarr; vier Buchstaben, B&nbsp;&ndash;&nbsp;O&nbsp;&ndash;&nbsp;R&nbsp;&ndash;&nbsp;?</div>
  <p class="sol">&rarr; Bora</p>
</div>

<div class="card st">
  <h3>3 &middot; Piazza della Borsa</h3>
  <p class="meta">Fontana del Nettuno (1755), davor die Borsa Vecchia</p>
  <div class="lvl"><b>Schwer:</b> Die Gestalt auf dem Brunnen gebietet über das Risiko,
     mit dem hier gehandelt wurde; vier Jahrzehnte nach 1806 gab sie ihren Namen an einen
     Himmelskörper ab, „den man zuerst berechnete und erst danach fand“. Römischer Name?
     <i>(Zwei Wege: Mythologie oder die Entdeckung des Neptun 1846.)</i></div>
  <div class="lvl"><b>Mittel:</b> Römischer Meeresgott mit Dreizack; der achte Planet,
     1846 entdeckt.</div>
  <div class="lvl"><b>Leicht:</b> Griechisch Poseidon; sechs Buchstaben, N-E-P … -N.</div>
  <p class="sol">&rarr; Neptun</p>
  <p class="meta">Akzeptiert: Neptun, Neptune, Nettuno, Neptunus</p>
</div>

<div class="card st">
  <h3>4 &middot; Canal Grande / Ponte Rosso</h3>
  <p class="meta">Bronzestatue von James Joyce auf der Brücke (2004)</p>
  <div class="lvl"><b>Schwer:</b> Ire, kam kurz nach 1900 an die Adria, unterrichtete über
     ein Jahrzehnt Sprachen; berühmt für einen Roman, der an einem einzigen Tag spielt &ndash;
     dem Tag seines ersten Spaziergangs mit seiner späteren Frau, weltweit unter eigenem
     Namen gefeiert. <i>(Weder Joyce noch Datum noch „Bloomsday“ werden genannt. Über die
     Tafel an der Statue oder eine Suche nach „Statue Ponte Rosso Triest“ lösbar.)</i></div>
  <div class="lvl"><b>Mittel:</b> James Joyce, Dublin, 16.&nbsp;Juni 1904, Bloomsday.</div>
  <div class="lvl"><b>Leicht:</b> Lateinisch-englischer Name des Odysseus: U l y s _ _ _</div>
  <p class="sol">&rarr; Ulysses</p>
  <p class="meta">Akzeptiert: Ulysses, Ulisse, Ulixes</p>
</div>

<div class="card st">
  <h3>5 &middot; Die Kirche mit den blauen Kuppeln</h3>
  <p class="meta">Tempio serbo-ortodosso di San Spiridione (1861&ndash;1869, Carlo Maciachini)</p>
  <div class="lvl"><b>Schwer:</b> Nur die kyrillische Zeile <b>СВЕТИ СПИРИДОН</b> &ndash;
     ohne Schlüssel, ohne Übersetzung, ohne Angabe, welches Wort gesucht ist.
     <i>(Lösbar durch Transliteration, durch Lesen der Fassade bzw. des Straßenschilds
     oder durch eine Suche nach der kyrillischen Zeichenfolge.)</i></div>
  <div class="lvl"><b>Mittel:</b> СВЕТИ = „Heiliger“, Bischof auf Zypern im 4.&nbsp;Jh.,
     dazu der Buchstabenschlüssel.</div>
  <div class="lvl"><b>Leicht:</b> Zeichen für Zeichen eingesetzt: S‑P‑I‑R‑I‑D‑O‑N.</div>
  <p class="sol">&rarr; Spiridon</p>
  <p class="meta">Akzeptiert: Spiridon, Spyridon, Spiridion, Spiridione, San Spiridione, Sveti Spiridon</p>
</div>

<div class="card st">
  <h3>6 &middot; Teatro Romano</h3>
  <p class="meta">Zuschauerkapazität &ndash; Recherche plus römische Ziffern</p>
  <div class="lvl"><b>Schwer:</b> „Der niedrigere der beiden gängigen Schätzwerte &ndash;
     notiert in römischen Ziffern.“ <i>(Die Zahl selbst wird nicht genannt; sie muss
     recherchiert und dann umgeschrieben werden.)</i></div>
  <div class="lvl"><b>Mittel:</b> Der Wert ist 3500; M&nbsp;=&nbsp;1000, D&nbsp;=&nbsp;500.</div>
  <div class="lvl"><b>Leicht:</b> 3500 = M M M D, ohne Leerzeichen schreiben.</div>
  <p class="sol">&rarr; MMMD</p>
  <p class="meta">Akzeptiert: MMMD, 3500, 3.500, dreitausendfünfhundert
     (die Ziffernform wird mitgezählt, damit niemand allein an der Schreibweise scheitert).<br>
     Obere Schätzung: 6000. Erbaut Ende 1.&nbsp;Jh. n.&nbsp;Chr., ausgebaut unter Trajan,
     freigelegt 1938.</p>
</div>

<div class="card st">
  <h3>7 &middot; Arco di Riccardo</h3>
  <p class="meta">Namensetymologie &ndash; römischer Städtebau</p>
  <div class="warn" style="margin:.5rem 0">
    <b>Geändert:</b> Dieses Rätsel fragt <i>nicht</i> mehr nach Richard Löwenherz.
    Der wäre durch den Namen des Bogens und jedes Ortsschild verraten gewesen &ndash;
    er ist jetzt die falsche Fährte im Rätseltext.
  </div>
  <div class="lvl"><b>Schwer:</b> Der Volksname sei aus dem lateinischen Wort für die
     Nord-Süd-Hauptachse einer römischen Stadt verschliffen. Wie heißt diese Straße?
     <i>(Verlangt Kenntnis oder Recherche zum römischen Stadtraster.)</i></div>
  <div class="lvl"><b>Mittel:</b> Die Ost-West-Achse heißt <i>decumanus maximus</i> &ndash;
     gesucht ist die andere.</div>
  <div class="lvl"><b>Leicht:</b> Sie heißt <i>cardo</i>, von lateinisch „Türangel“.</div>
  <p class="sol">&rarr; Cardo</p>
  <p class="meta">Akzeptiert: Cardo, cardo maximus, der Cardo, Kardo, cardus.
     <b>Nicht</b> akzeptiert: decumanus, Richard Löwenherz.</p>
</div>

<div class="card st">
  <h3>8 &middot; Cattedrale di San Giusto</h3>
  <p class="meta">Die Alabarda &ndash; im Stadtwappen überall in Triest zu sehen</p>
  <div class="lvl"><b>Schwer:</b> Der Gegenstand wird nicht beschrieben: nur, dass Triest
     seit dem 13.&nbsp;Jh. ein einziges Zeichen führt, dass es 303 vom Himmel fiel, als der
     Legionär Sergius in Syrien starb, und dass das Original im Domschatz liegt.
     Gefragt ist der <i>deutsche Fachbegriff</i>.
     <i>(Die Gruppe muss das Wappen tatsächlich angeschaut haben und die Waffenart benennen
     können &ndash; „Stangenwaffe mit Beil“ zu suchen führt zum Ziel.)</i></div>
  <div class="lvl"><b>Mittel:</b> Stangenwaffe mit Beil, Haken und Stoßdorn; italienisch
     <i>alabarda</i>; zehn Buchstaben.</div>
  <div class="lvl"><b>Leicht:</b> Waffe der Schweizergarde, H E L L E _ _ _ _ _</div>
  <p class="sol">&rarr; Hellebarde</p>
  <p class="meta">Akzeptiert: Hellebarde, Alabarda, Halberd, Helmbarte</p>
</div>

<div class="card st bonus">
  <h3>&#9733; &middot; Le Rive &ndash; Uferpromenade <i>(Bonus)</i></h3>
  <p class="meta">Station zum Durchatmen, nicht zum Hetzen</p>
  <div class="lvl"><b>Schwer:</b> Größte Segelregatta der Welt nach Teilnehmerzahl,
     über 2000 Boote, Rekord 2018: 2689. Wie heißt sie? <i>(Der Stadtteilname wird
     bewusst nicht genannt.)</i></div>
  <div class="lvl"><b>Mittel:</b> Benannt nach dem Küstenstreifen <i>Barcola</i>,
     plus Endung.</div>
  <div class="lvl"><b>Leicht:</b> B A R C O L A _ A</div>
  <p class="sol">&rarr; Barcolana</p>
</div>

<h2>Hinweise zu den Orten</h2>
<div class="card">
  <ul>
    <li>Alle acht Pflichtstationen sind <b>frei zugänglich und kostenlos</b>, auch ohne
        ein Gebäude zu betreten. Die Rätsel lassen sich sämtlich von außen lösen.</li>
    <li><b>San Spiridione</b> und der <b>Dom</b> haben Öffnungszeiten und sind über Mittag
        oft geschlossen. Für die Rätsel ist das egal &ndash; wer aber hineinschauen will,
        plant den Dom besser vor 12&nbsp;Uhr oder nach 15:30&nbsp;Uhr ein. In beiden
        Kirchen gelten übliche Kleiderregeln (Schultern und Knie bedeckt).</li>
    <li>Das <b>Teatro Romano</b> ist eine Grabung unterhalb des Straßenniveaus und wird
        von der Balustrade aus betrachtet; das Areal selbst ist normalerweise nicht betretbar.</li>
    <li>Das <b>Castello di San Giusto</b> liegt direkt neben dem Dom. Der Vorplatz mit
        dem Blick über den Golf ist frei; für Museum und Wehrgang wird Eintritt verlangt.
        Die Rallye braucht ihn nicht.</li>
    <li>Der Aufstieg zum Dom über die <b>Scala dei Giganti</b> oder die Via della Cattedrale
        ist steil und bei Hitze anstrengend. Trinkwasser mitnehmen &ndash; oben gibt es
        Brunnen, unterwegs eher nicht.</li>
  </ul>
</div>

<h2>Auswertung</h2>
<div class="card">
  <p>Die Gruppe zeigt am Ende den Reiter <b>Ergebnis</b>: Gesamtpunktzahl, Rangtitel und
     eine Tabelle, welche Station auf welcher Stufe gelöst wurde. Ein &#9873; markiert
     Stationen, die über den Freischaltcode von Hand bestätigt wurden.</p>
  <p>Zum Einsammeln eignet sich die Schaltfläche <b>Als Datei sichern</b> (JSON) oder
     der <b>Sicherungscode</b>. Beides enthält Teamname, Namen, Zeiten und Punkte.</p>
  <div class="tip" style="margin-bottom:0">
    <b>Punkteschlüssel:</b> 3&nbsp;P = auf der schweren Variante gelöst &middot;
    2&nbsp;P = mittlere &middot; 1&nbsp;P = leichte &middot; 0&nbsp;P = alle neun Versuche
    verbraucht. Maximal 24&nbsp;P, mit Bonusstation 27&nbsp;P.
  </div>
</div>

<h2 id="pwtool-h">Passwortschutz</h2>
<div class="card" id="pwtool">
  <p>Der Schutz sitzt in dieser Datei ganz unten im <code>&lt;script&gt;</code>-Block.
     <b>Eine Zeile schaltet ihn um:</b></p>
  <p><code>var PASSWORTSCHUTZ = true;</code> &nbsp;&rarr;&nbsp; auf <code>false</code>
     setzen, und die Seite ist ohne Passwort zugänglich.</p>

  <p style="margin-top:1.2rem"><b>Passwort ändern:</b> Das Passwort steht nicht im Klartext
     in der Datei, sondern als Prüfsumme. Neues Passwort hier eintippen &ndash; unten
     erscheint die Zeile zum Hineinkopieren:</p>
  <input type="text" id="newpw" placeholder="neues Passwort" autocomplete="off" spellcheck="false">
  <p style="margin:.7rem 0 0"><code id="newline">var PASSWORT_HASH  = '…';</code></p>

  <div class="warn" style="margin-top:1.2rem">
    <b>Was der Schutz leistet &ndash; und was nicht.</b> Er hält die Seite von Suchmaschinen
    und von neugierigen Blicken frei: Der Inhalt steht in einem <code>&lt;template&gt;</code>,
    wird ohne Passwort gar nicht erst in die Seite eingebaut und ist mit den
    Entwicklerwerkzeugen nicht einfach „wieder einblendbar“. Wer aber den
    <i>Quelltext</i> der Datei öffnet, liest alles &ndash; das ist bei jeder rein
    clientseitigen Lösung so, solange die Datei ohne Build-Schritt von Hand
    bearbeitbar bleiben soll. Wenn es fester sein muss, gehört zusätzlich ein
    <code>.htaccess</code>-Schutz auf den Ordner; beides zusammen ist kein Widerspruch.
  </div>
</div>

<script>
(function(){
'use strict';

/* ===================================================================
   PASSWORTSCHUTZ  –  diese eine Zeile schaltet ihn ein und aus:
   =================================================================== */
var PASSWORTSCHUTZ = true;               /* false = Seite frei zugänglich */
/* =================================================================== */

var PASSWORT_HASH  = 'a28acec8';         /* Prüfsumme des Passworts */
var SALT = 'tergeste-2026:';
var SKEY = 'edu-mrh.triest-loesungen';   /* merkt die Freigabe für diese Sitzung */

/* Dieselbe Normalisierung und Prüfsumme wie in der Rallye. */
function norm(s){
  return String(s==null?'':s)
    .normalize('NFC').toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]/g,'');
}
function fnv(s){
  var x=0x811c9dc5;
  for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,0x01000193)>>>0;}
  return ('0000000'+x.toString(16)).slice(-8);
}
function hash(s){return fnv(SALT+norm(s));}

function oeffnen(){
  var tpl=document.getElementById('inhalt');
  document.getElementById('ziel').appendChild(tpl.content.cloneNode(true));
  tpl.remove();                                  /* Vorlage aus dem DOM nehmen */
  var gate=document.getElementById('gate');
  if(gate) gate.remove();
  werkzeug();
}

/* Kleines Hilfsmittel: neues Passwort -> fertige Codezeile zum Kopieren. */
function werkzeug(){
  var inp=document.getElementById('newpw'), out=document.getElementById('newline');
  if(!inp||!out) return;
  inp.addEventListener('input',function(){
    var v=inp.value.trim();
    out.textContent = v
      ? "var PASSWORT_HASH  = '"+hash(v)+"';"
      : "var PASSWORT_HASH  = '…';";
  });
}

if(!PASSWORTSCHUTZ){
  oeffnen();
}else{
  var frei=false;
  try{frei=sessionStorage.getItem(SKEY)==='1';}catch(e){}
  if(frei){
    oeffnen();
  }else{
    var gate=document.getElementById('gate');
    gate.hidden=false;
    var pw=document.getElementById('pw'), msg=document.getElementById('msg');
    var pruefen=function(){
      if(hash(pw.value)===PASSWORT_HASH){
        try{sessionStorage.setItem(SKEY,'1');}catch(e){}
        oeffnen();
      }else{
        msg.textContent='Passwort stimmt nicht.';
        pw.value=''; pw.focus();
      }
    };
    document.getElementById('go').addEventListener('click',pruefen);
    pw.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();pruefen();}});
    pw.focus();
  }
}

})();
</script>
