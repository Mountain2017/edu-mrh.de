<h1>Lösungen, Route und Ablauf</h1>
<div class="warn">
  <b>Nur für Begleitpersonen.</b> Gebt die Adresse und das Passwort nicht an die
  Gruppen weiter &ndash; die Rallye selbst liegt unter
  <a href="triest.html">triest.html</a>.
</div>

<h2>Auf einen Blick</h2>
<div class="card">
  <table>
    <tr><th>Start &amp; Ziel</th><td>Piazza dell&rsquo;Unità d&rsquo;Italia (Bushalt an den Rive)</td></tr>
    <tr><th>Stationen</th><td>8 Pflichtstationen + 1 optionale Bonusstation</td></tr>
    <tr><th>Strecke</th><td>ca. 3&nbsp;km, davon ca. 65&nbsp;Höhenmeter hinauf zum Dom</td></tr>
    <tr><th>Reine Gehzeit</th><td>ca. 55&nbsp;Minuten</td></tr>
    <tr><th>Gesamtdauer</th><td><b>2,5 bis 3&nbsp;Stunden</b> – die Rätsel verlangen Recherche</td></tr>
    <tr><th>Bonus</th><td>+ ca. 20&nbsp;Minuten (Uferpromenade, nur bei Zeitüberschuss)</td></tr>
    <tr><th>Punkte</th><td>max. 24 (8&nbsp;&times;&nbsp;3) + 3 Bonuspunkte</td></tr>
    <tr><th>Freischaltcode</th><td><code>LIGNANO-Q12</code> (Groß-/Kleinschreibung egal)</td></tr>
  </table>
</div>

<div class="tip">
  <b>Der Freischaltcode</b> wird in der Rallye unter &bdquo;Hilfe &rarr; Wenn das GPS streikt&ldquo;
  eingegeben. Danach erscheint in jeder Station ein Knopf, mit dem die Gruppe den Ort
  von Hand als besucht markieren kann. Solche Stationen bekommen im Ergebnis ein
  &#9873;-Zeichen &ndash; ihr seht also, wo nicht per Ortung bestätigt wurde.
  Gebt den Code nur heraus, wenn die Ortung tatsächlich nicht funktioniert.
</div>

<h2>Wie schwer die R&auml;tsel sind</h2>
<div class="card">
  <p>Grundsatz: <b>Keine Stufe verschenkt Punkte.</b> Auch &bdquo;leicht&ldquo; nennt nie die
     Antwort und l&auml;sst sich nicht in drei Versuchen durchprobieren &ndash; sie sagt der
     Gruppe nur, <i>wonach</i> sie sucht; herleiten muss sie die Antwort selbst
     (&uuml;bersetzen, umrechnen, ein Wort bilden). Wer alle neun Versuche verbraucht, bekommt
     <b>0&nbsp;Punkte</b>.</p>
  <ul>
    <li><b>Schwer (3&nbsp;P)</b> nennt den gesuchten Gegenstand nicht und liefert keine
        Suchbegriffe frei Haus. Mehrere Stationen verlangen eine Kette aus zwei bis vier
        Schl&uuml;ssen, davon mindestens einer aus dem Netz oder aus dem Kopf.</li>
    <li><b>Mittel (2&nbsp;P)</b> benennt Thema und Umfeld, l&auml;sst den entscheidenden
        Schritt aber offen.</li>
    <li><b>Leicht (1&nbsp;P)</b> f&uuml;hrt bis vor den letzten Schritt &ndash; und der bleibt
        eine echte Leistung: eine r&ouml;mische Zahl schreiben, ein franz&ouml;sisches Wort
        bilden, einen deutschen Fachbegriff kennen.</li>
    <li><b>Vor-Ort-Hinweis:</b> zeigt auf das richtige Detail. Er verlangt zweierlei &ndash;
        die Gruppe muss dicht am Ort stehen (25&ndash;70&nbsp;m), <i>und</i> er bleibt auf der
        schweren Stufe gesperrt.</li>
  </ul>
  <div class="tip">
    <b>Die Gruppen brauchen unterwegs Internet.</b> In EU-Vertr&auml;gen greift das Roaming,
    bei Prepaid lohnt eine Kontrolle vorher. Ohne Netz sind mehrere schwere und einige
    mittlere Varianten nicht l&ouml;sbar; die leichten funktionieren offline, die Rallye
    selbst ohnehin.
  </div>
  <div class="warn" style="margin-bottom:0">
    <b>Zeitbudget:</b> Mit diesem Niveau liegt die realistische Dauer bei
    <b>2,5 bis 3&nbsp;Stunden</b> statt der urspr&uuml;nglichen 2 bis 2,5. Wenn es k&uuml;rzer
    sein muss, ist der sauberste Schnitt <b>Station&nbsp;5</b> (die Kirche): Sie liegt nur zwei
    Gehminuten hinter Station&nbsp;4, der Wegverlauf &auml;ndert sich also kaum.
    Dazu in <code>triest.html</code> im Skriptblock oben einfach den Stationsblock
    <code>id:'san-spiridione'</code> &hellip; l&ouml;schen &ndash; H&ouml;chstpunktzahl,
    Z&auml;hlung und Nummerierung ziehen automatisch nach. Nur zwei Prosas&auml;tze
    (Begr&uuml;&szlig;ung und Hilfe-Kasten) nennen die Acht noch ausgeschrieben.
  </div>
</div>

<h2>Route und Wegzeiten</h2>

  <div class="tbl-wrap">
  <table>

    <tr><td>4</td><td>Canal Grande / Ponte Rosso</td><td>&mdash;</td><td>45.65219, 13.77220</td><td>55&nbsp;m</td><td>4&nbsp;Min</td></tr>

  <p class="meta">Station&nbsp;5 heißt in der Rallye bewusst nicht nach ihrem Heiligen &ndash;
     der Name wäre die halbe Lösung. Der angegebene Radius ist der Grundwert; zusätzlich zieht
     die Rallye die vom Gerät gemeldete Messungenauigkeit ab (höchstens 100&nbsp;m), damit
     schlechte Fixes in den Altstadtgassen keine Gruppe aussperren. Ein einmal besuchter Ort
     bleibt dauerhaft freigeschaltet &ndash; die Gruppen dürfen zum Knobeln ins Café.</p>
</div>

<h2>Vorher ansagen</h2>
<div class="card">
  <ul>
    <li><b>Ein Handy pro Gruppe</b> legt die Gruppe an &ndash; das mit dem meisten Akku.
        Die Dauer-Ortung zieht spürbar Strom; in der Rallye gibt es dafür einen
        Pause-Knopf für die Café-Phase.</li>
    <li><b>Standortfreigabe erlauben</b>, wenn der Browser fragt. Ohne sie schaltet
        sich keine Station frei.</li>
    <li><b>Nachschlagen ist ausdrücklich erlaubt</b> und bei den schweren Varianten oft
        nötig. Die Lösungen selbst stehen nirgends im Netz &ndash; gesucht werden muss nach
        Sachwissen, nicht nach der Rallye.</li>
    <li><b>Sicherungscode</b>: Nach ein paar Stationen einmal unter &bdquo;Hilfe&ldquo;
        den Code kopieren und in einen Gruppenchat schicken. Dann ist der Stand auch
        bei leerem Akku nicht verloren.</li>
    <li><b>Treffpunkt und Uhrzeit</b> an der Piazza dell&rsquo;Unità fest vereinbaren.
        Die Rallye zeigt zwar eine Uhr, aber keinen Countdown.</li>
    <li><b>Bonusstation</b> nur freigeben, wenn eine Gruppe deutlich vor der Zeit liegt.</li>
    <li><b>Verkehr:</b> Auf dem Weg zum Teatro Romano und zum Dom wird mehrfach eine
        befahrene Straße gequert. Kurz erwähnen.</li>
  </ul>
</div>

<h2>Die Lösungen</h2>

<div class="card st">
  <h3>1 &middot; Piazza dell&rsquo;Unit&agrave; d&rsquo;Italia</h3>
  <p class="meta">Fontana dei Quattro Continenti &rarr; Cook &rarr; sein Schiff</p>
  <div class="lvl"><b>Schwer:</b> Vier Figuren geh&ouml;ren zu einer Reihe, deren letztes Glied
     zur Bauzeit noch kein gesichertes Wissen war; 1770 kartierte eine britische Expedition
     seine Ostk&uuml;ste. Wie hie&szlig; deren Schiff? <i>(Dreifachschritt: Erdteile erkennen &rarr;
     Australien &rarr; Cooks erste Reise &rarr; Schiffsname. Der Brunnen wird nicht benannt.)</i></div>
  <div class="lvl"><b>Mittel:</b> Brunnen und fehlender Erdteil werden genannt; gesucht bleibt
     der Name von Cooks Schiff (umgebauter Kohlenfrachter aus Whitby, 1768&ndash;1771).</div>
  <div class="lvl"><b>Leicht:</b> Der Name ist ein englisches Substantiv f&uuml;r
     &bdquo;Bestreben&ldquo;; dieselbe Schreibweise trug das letzte Space Shuttle.
     <i>(Verlangt immer noch, das englische Wort zu kennen oder zu finden.)</i></div>
  <p class="sol">&rarr; Endeavour</p>
  <p class="meta">Akzeptiert: Endeavour, Endeavor, HMS Endeavour, HMS Endeavor, HM Bark Endeavour</p>
</div>

<div class="card st">
  <h3>2 &middot; Molo Audace</h3>
  <p class="meta">Inschrift von 1925 &rarr; 3. November 1918 &rarr; Kriegsende</p>
  <div class="lvl"><b>Schwer:</b> Am Tag, an dem die <i>Audace</i> hier anlegte, wurde bei
     Padua ein Abkommen unterzeichnet, das den Krieg zwischen Italien und
     &Ouml;sterreich-Ungarn beendete; es ist nach dem Landhaus benannt. Wie hei&szlig;t es?</div>
  <div class="lvl"><b>Mittel:</b> Datum und Wirkung werden genannt, der Ortsname nicht &ndash;
     die Gruppe muss den Unterzeichnungsort recherchieren.</div>
  <div class="lvl"><b>Leicht:</b> <i>villa</i> = Landhaus; der Graf hie&szlig; Vettor
     <b>Giusti</b> del Giardino. <i>(Zusammensetzen, nicht ablesen.)</i></div>
  <p class="sol">&rarr; Villa Giusti</p>
  <p class="meta">Akzeptiert: Villa Giusti, Waffenstillstand von Villa Giusti,
     Armistizio di Villa Giusti, Vertrag von Villa Giusti<br>
     Unterzeichnet 3.&nbsp;11.&nbsp;1918, 15&nbsp;Uhr; in Kraft 4.&nbsp;11.&nbsp;1918, 15&nbsp;Uhr.</p>
</div>

<div class="card st">
  <h3>3 &middot; Piazza della Borsa</h3>
  <p class="meta">Fontana del Nettuno &rarr; Planet Neptun &rarr; seine Berechnung 1846</p>
  <div class="lvl"><b>Schwer:</b> Die Brunnenfigur gab einem Planeten den Namen, den niemand
     gesucht hatte &ndash; er wurde aus den Bahnst&ouml;rungen des Uranus vorausberechnet.
     Wer hat gerechnet? <i>(Weder Neptun noch Le Verrier werden genannt.)</i></div>
  <div class="lvl"><b>Mittel:</b> Neptun, Galle, Berliner Sternwarte, 23.&nbsp;9.&nbsp;1846;
     gesucht ist der franz&ouml;sische Astronom, Konkurrent war John Couch Adams.</div>
  <div class="lvl"><b>Leicht:</b> Nachname = Artikel <i>Le</i> + Berufsbezeichnung zu
     <i>verre</i> (Glas). <i>(Wortbildung, keine Vorlage.)</i></div>
  <p class="sol">&rarr; Le Verrier</p>
  <p class="meta">Akzeptiert: Le Verrier, Leverrier, Urbain Le Verrier, Urbain Jean Joseph Le Verrier</p>
</div>

<div class="card st">
  <h3>4 &middot; Canal Grande / Ponte Rosso</h3>
  <p class="meta">Joyce-Statue &rarr; sein Sch&uuml;ler &rarr; dessen Pseudonym</p>
  <div class="lvl"><b>Schwer:</b> Der Bronzemann unterrichtete Englisch; einer seiner
     Sch&uuml;ler war ein Triestiner Gesch&auml;ftsmann, den er mit &uuml;ber sechzig zum
     gefeierten Autor machte und der Z&uuml;ge zur Hauptfigur seines Hauptwerks beisteuerte.
     Wie lautet dessen K&uuml;nstlername? <i>(Weder Joyce noch Svevo werden genannt.)</i></div>
  <div class="lvl"><b>Mittel:</b> Joyce; Sch&uuml;ler = Ettore Schmitz, Autor von
     <i>Zenos Gewissen</i>; das Pseudonym bedeutet &bdquo;der italienische Schwabe&ldquo;.
     <i>(Die italienischen W&ouml;rter muss die Gruppe finden.)</i></div>
  <div class="lvl"><b>Leicht:</b> Erstes Wort = Kurzform f&uuml;r &bdquo;italienisch&ldquo;
     (wie in <i>Italo-Western</i>); zweites = Adjektiv zu <i>Svevia</i> (Schwaben).</div>
  <p class="sol">&rarr; Italo Svevo</p>
  <p class="meta">Akzeptiert: Italo Svevo, Svevo</p>
</div>

<div class="card st">
  <h3>5 &middot; Die Kirche mit den blauen Kuppeln</h3>
  <p class="meta">Kyrillisch lesen &rarr; zweiter Patron der Kirche</p>
  <div class="warn" style="margin:.5rem 0">
    <b>Ge&auml;ndert:</b> Gefragt ist nicht mehr der heilige Spiridon &ndash; der stand an der
    Fassade und auf dem Stra&szlig;enschild. Gesucht ist jetzt der <i>zweite</i> Patron:
    Der volle Name lautet <i>Tempio serbo-ortodosso della Santissima Trinit&agrave; e di
    San Spiridione</i>.
  </div>
  <div class="lvl"><b>Schwer:</b> Nur die kyrillische Zeile <b>&#1057;&#1042;&#1045;&#1058;&#1040;
     &#1058;&#1056;&#1054;&#1032;&#1048;&#1062;&#1040;</b> und der Wink, dass im zweiten Wort die
     slawische Wurzel f&uuml;r &bdquo;drei&ldquo; steckt. Kein Schl&uuml;ssel,
     keine &Uuml;bersetzung.</div>
  <div class="lvl"><b>Mittel:</b> Buchstabenschl&uuml;ssel; &bdquo;heilig&ldquo; + ein
     Glaubensgeheimnis, das drei Personen in einem Wesen zusammenfasst.</div>
  <div class="lvl"><b>Leicht:</b> <i>Sveta Trojica</i> = <i>Santissima Trinit&agrave;</i>;
     gesucht ist der deutsche Begriff. <i>(Muss gewusst oder gefunden werden.)</i></div>
  <p class="sol">&rarr; Dreifaltigkeit</p>
  <p class="meta">Akzeptiert: Dreifaltigkeit, Heilige/Heiligste Dreifaltigkeit, Dreieinigkeit,
     Heilige Dreieinigkeit, Trinit&auml;t, Heilige Trinit&auml;t, Sveta Trojica, Santissima Trinita</p>
</div>

<div class="card st">
  <h3>6 &middot; Teatro Romano</h3>
  <p class="meta">Kaiser bestimmen &rarr; <i>ab urbe condita</i> umrechnen &rarr; r&ouml;mische Ziffern</p>
  <div class="lvl"><b>Schwer:</b> &bdquo;Schreibt das Antrittsjahr jenes Kaisers, unter dem das
     Reich seine gr&ouml;&szlig;te Ausdehnung erreichte (Siegess&auml;ule mit Dakerrelief in Rom),
     in Jahren ab urbe condita und in r&ouml;mischen Ziffern.&ldquo;
     <i>(Vier Schritte: Trajan erkennen &rarr; 98 n.&nbsp;Chr. &rarr; + 753 &rarr; umschreiben.
     Weder Kaiser noch Epoche noch Zahl werden genannt.)</i></div>
  <div class="lvl"><b>Mittel:</b> Trajan, 98 n.&nbsp;Chr., Gr&uuml;ndung Roms 753 v.&nbsp;Chr.
     &ndash; Umrechnung und Ziffern bleiben Aufgabe.</div>
  <div class="lvl"><b>Leicht:</b> 98 + 753 = 851, dazu die Zeichenwerte.
     <i>Die Umschreibung selbst bleibt zu leisten.</i></div>
  <p class="sol">&rarr; DCCCLI</p>
  <p class="meta"><b>Nur DCCCLI wird akzeptiert</b> &ndash; &bdquo;851&ldquo; gilt nicht, sonst
     entfiele der eigentliche Rechenschritt. Die Aufgabenstellung sagt auf allen drei Stufen
     ausdr&uuml;cklich &bdquo;in r&ouml;mischen Ziffern&ldquo;.<br>
     Zur Kontrolle: D&nbsp;500 + CCC&nbsp;300 + L&nbsp;50 + I&nbsp;1 = 851.</p>
</div>

  </div>
  <div class="lvl"><b>Schwer:</b> Der Volksname sei aus dem lateinischen Wort f&uuml;r die
     Nord-S&uuml;d-Hauptachse einer r&ouml;mischen Stadt verschliffen. Wie hei&szlig;t sie?</div>
  <div class="lvl"><b>Mittel:</b> Ost-West-Achse = <i>decumanus maximus</i>; die gesuchte ist

     <i>(R&uuml;ckschluss, kein Ablesen.)</i></div>

<h2>Hinweise zu den Orten</h2>
<div class="card">
  <ul>
    <li>Alle acht Pflichtstationen sind <b>frei zugänglich und kostenlos</b>, auch ohne
        ein Gebäude zu betreten. Die Rätsel lassen sich sämtlich von außen lösen.</li>
    <li><b>San Spiridione</b> und der <b>Dom</b> haben Öffnungszeiten und sind über Mittag
        oft geschlossen. Für die Rätsel ist das egal &ndash; wer aber hineinschauen will,
        plant den Dom besser vor 12&nbsp;Uhr oder nach 15:30&nbsp;Uhr ein. In beiden
        Kirchen gelten übliche Kleiderregeln (Schultern und Knie bedeckt).</li>
    <li>Das <b>Teatro Romano</b> ist eine Grabung unterhalb des Straßenniveaus und wird
        von der Balustrade aus betrachtet; das Areal selbst ist normalerweise nicht betretbar.</li>
    <li>Das <b>Castello di San Giusto</b> liegt direkt neben dem Dom. Der Vorplatz mit
        dem Blick über den Golf ist frei; für Museum und Wehrgang wird Eintritt verlangt.
        Die Rallye braucht ihn nicht.</li>
    <li>Der Aufstieg zum Dom über die <b>Scala dei Giganti</b> oder die Via della Cattedrale
        ist steil und bei Hitze anstrengend. Trinkwasser mitnehmen &ndash; oben gibt es
        Brunnen, unterwegs eher nicht.</li>
  </ul>
</div>

<h2>Auswertung</h2>
<div class="card">
  <p>Die Gruppe zeigt am Ende den Reiter <b>Ergebnis</b>: Gesamtpunktzahl, Rangtitel und
     eine Tabelle, welche Station auf welcher Stufe gelöst wurde. Ein &#9873; markiert
     Stationen, die über den Freischaltcode von Hand bestätigt wurden.</p>
  <p>Zum Einsammeln eignet sich die Schaltfläche <b>Als Datei sichern</b> (JSON) oder
     der <b>Sicherungscode</b>. Beides enthält Teamname, Namen, Zeiten und Punkte.</p>
  <div class="tip" style="margin-bottom:0">
    <b>Punkteschlüssel:</b> 3&nbsp;P = auf der schweren Variante gelöst &middot;
    2&nbsp;P = mittlere &middot; 1&nbsp;P = leichte &middot; 0&nbsp;P = alle neun Versuche
    verbraucht. Maximal 24&nbsp;P, mit Bonusstation 27&nbsp;P.
  </div>
</div>

<h2 id="pwtool-h">Passwortschutz</h2>
<div class="card" id="pwtool">
  <p>Der Schutz sitzt in dieser Datei ganz unten im <code>&lt;script&gt;</code>-Block.
     <b>Eine Zeile schaltet ihn um:</b></p>
  <p><code>var PASSWORTSCHUTZ = true;</code> &nbsp;&rarr;&nbsp; auf <code>false</code>
     setzen, und die Seite ist ohne Passwort zugänglich.</p>

  <p style="margin-top:1.2rem"><b>Passwort ändern:</b> Das Passwort steht nicht im Klartext
     in der Datei, sondern als Prüfsumme. Neues Passwort hier eintippen &ndash; unten
     erscheint die Zeile zum Hineinkopieren:</p>
  <input type="text" id="newpw" placeholder="neues Passwort" autocomplete="off" spellcheck="false">
  <p style="margin:.7rem 0 0"><code id="newline">var PASSWORT_HASH  = '…';</code></p>

  <div class="warn" style="margin-top:1.2rem">
    <b>Was der Schutz leistet &ndash; und was nicht.</b> Er hält die Seite von Suchmaschinen
    und von neugierigen Blicken frei: Der Inhalt steht in einem <code>&lt;template&gt;</code>,
    wird ohne Passwort gar nicht erst in die Seite eingebaut und ist mit den
    Entwicklerwerkzeugen nicht einfach „wieder einblendbar“. Wer aber den
    <i>Quelltext</i> der Datei öffnet, liest alles &ndash; das ist bei jeder rein
    clientseitigen Lösung so, solange die Datei ohne Build-Schritt von Hand
    bearbeitbar bleiben soll. Wenn es fester sein muss, gehört zusätzlich ein
    <code>.htaccess</code>-Schutz auf den Ordner; beides zusammen ist kein Widerspruch.
  </div>
</div>

<script>
(function(){
'use strict';

/* ===================================================================
   PASSWORTSCHUTZ  –  diese eine Zeile schaltet ihn ein und aus:
   =================================================================== */
var PASSWORTSCHUTZ = true;               /* false = Seite frei zugänglich */
/* =================================================================== */

var PASSWORT_HASH  = 'a28acec8';         /* Prüfsumme des Passworts */
var SALT = 'tergeste-2026:';
var SKEY = 'edu-mrh.triest-loesungen';   /* merkt die Freigabe für diese Sitzung */

/* Dieselbe Normalisierung und Prüfsumme wie in der Rallye. */
function norm(s){
  return String(s==null?'':s)
    .normalize('NFC').toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]/g,'');
}
function fnv(s){
  var x=0x811c9dc5;
  for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,0x01000193)>>>0;}
  return ('0000000'+x.toString(16)).slice(-8);
}
function hash(s){return fnv(SALT+norm(s));}

function oeffnen(){
  var tpl=document.getElementById('inhalt');
  document.getElementById('ziel').appendChild(tpl.content.cloneNode(true));
  tpl.remove();                                  /* Vorlage aus dem DOM nehmen */
  var gate=document.getElementById('gate');
  if(gate) gate.remove();
  werkzeug();
}

/* Kleines Hilfsmittel: neues Passwort -> fertige Codezeile zum Kopieren. */
function werkzeug(){
  var inp=document.getElementById('newpw'), out=document.getElementById('newline');
  if(!inp||!out) return;
  inp.addEventListener('input',function(){
    var v=inp.value.trim();
    out.textContent = v
      ? "var PASSWORT_HASH  = '"+hash(v)+"';"
      : "var PASSWORT_HASH  = '…';";
  });
}

if(!PASSWORTSCHUTZ){
  oeffnen();
}else{
  var frei=false;
  try{frei=sessionStorage.getItem(SKEY)==='1';}catch(e){}
  if(frei){
    oeffnen();
  }else{
    var gate=document.getElementById('gate');
    gate.hidden=false;
    var pw=document.getElementById('pw'), msg=document.getElementById('msg');
    var pruefen=function(){
      if(hash(pw.value)===PASSWORT_HASH){
        try{sessionStorage.setItem(SKEY,'1');}catch(e){}
        oeffnen();
      }else{
        msg.textContent='Passwort stimmt nicht.';
        pw.value=''; pw.focus();
      }
    };
    document.getElementById('go').addEventListener('click',pruefen);
    pw.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();pruefen();}});
    pw.focus();
  }
}

})();
</script>
