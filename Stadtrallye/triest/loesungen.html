<h1>Lösungen, Route und Ablauf</h1>
<div class="warn">
  <b>Nur für Begleitpersonen.</b> Gebt die Adresse und das Passwort nicht an die
  Gruppen weiter &ndash; die Rallye selbst liegt unter
  <a href="triest.html">triest.html</a>.
</div>

<h2>Auf einen Blick</h2>
<div class="card">
  <table>
    <tr><th>Start &amp; Ziel</th><td>Piazza dell&rsquo;Unità d&rsquo;Italia (Bushalt an den Rive)</td></tr>
    <tr><th>Stationen</th><td>8 Pflichtstationen + 1 optionale Bonusstation</td></tr>
    <tr><th>Strecke</th><td>ca. 3&nbsp;km, davon ca. 65&nbsp;Höhenmeter hinauf zum Dom</td></tr>
    <tr><th>Reine Gehzeit</th><td>ca. 55&nbsp;Minuten</td></tr>
    <tr><th>Gesamtdauer</th><td><b>2 bis 2,5&nbsp;Stunden</b> bei mittlerem bis langsamem Rätseltempo</td></tr>
    <tr><th>Bonus</th><td>+ ca. 20&nbsp;Minuten (Uferpromenade, nur bei Zeitüberschuss)</td></tr>
    <tr><th>Punkte</th><td>max. 24 (8&nbsp;&times;&nbsp;3) + 3 Bonuspunkte</td></tr>
    <tr><th>Freischaltcode</th><td><code>LIGNANO-Q12</code> (Groß-/Kleinschreibung egal)</td></tr>
  </table>
</div>

<div class="tip">
  <b>Der Freischaltcode</b> wird in der Rallye unter &bdquo;Hilfe &rarr; Wenn das GPS streikt&ldquo;
  eingegeben. Danach erscheint in jeder Station ein Knopf, mit dem die Gruppe den Ort
  von Hand als besucht markieren kann. Solche Stationen bekommen im Ergebnis ein
  &#9873;-Zeichen &ndash; ihr seht also, wo nicht per Ortung bestätigt wurde.
  Gebt den Code nur heraus, wenn die Ortung tatsächlich nicht funktioniert.
</div>

<h2>Wie die R&auml;tsel gebaut sind</h2>
<div class="card">
  <p><b>Gedankenketten &uuml;ber mehrere Ecken.</b> Jede Station beginnt mit einer genauen
     Beobachtung vor Ort und f&uuml;hrt dann in drei bis f&uuml;nf Schritten woandershin.
     Beispiel Station&nbsp;1: vier Figuren am Brunnen &rarr; welcher Erdteil fehlt &rarr; wer ihn
     kartierte &rarr; er lief auf ein Riff &rarr; was wirft man dann &uuml;ber Bord? Antwort:
     Kanonen. Der Brunnen selbst kommt in der Antwort gar nicht mehr vor.</p>
  <p><b>Ohne Nachschlagen l&ouml;sbar.</b> Alles Sachwissen, das die Kette braucht, steht im
     R&auml;tseltext. Gefragt ist das Weiterdenken, nicht das Suchen. Ein Handy mit Netz ist
     <i>nicht</i> n&ouml;tig.</p>
  <p><b>Falsche F&auml;hrten sind Absicht.</b> Fast jede Station legt eine: Neptun steht gro&szlig; da, gesucht ist das Metall des Merkur. Spiridon steht &uuml;ber dem Portal, gesucht ist die Dreifaltigkeit. Auf der Tafel steht 851, gesucht ist 98. Die Regatta hei&szlig;t Barcolana, gesucht ist der Grecale. Wer nur &uuml;berfliegt, tippt die F&auml;hrte ein und verliert einen Versuch – alle diese Zwischenstationen werden ausdr&uuml;cklich abgelehnt.</p>
  <ul>
    <li><b>Schwer (3&nbsp;P)</b> nennt kein Glied der Kette beim Namen und gibt nur die
        Wink&shy;worte.</li>
    <li><b>Mittel (2&nbsp;P)</b> l&ouml;st die mittleren Glieder auf, l&auml;sst den letzten
        Schritt offen.</li>
    <li><b>Leicht (1&nbsp;P)</b> f&uuml;hrt bis vor den letzten Schritt &ndash; der bleibt eine
        echte Leistung: ein Wort bilden, eine Endung anh&auml;ngen, eine Unterscheidung treffen.
        Wer alle neun Versuche verbraucht, bekommt <b>0&nbsp;Punkte</b>.</li>
    <li><b>Die Stufen bleiben stehen.</b> Stufe&nbsp;2 und&nbsp;3 sind <i>Nachtr&auml;ge</i>; die
        Gruppe sieht immer alles Freigeschaltete und kann am Ende die ganze Geschichte
        nachlesen.</li>
    <li><b>Vor-Ort-Hinweis:</b> zeigt auf das richtige Detail. Er verlangt N&auml;he
        (25&ndash;70&nbsp;m) <i>und</i> bleibt auf der schweren Stufe gesperrt.</li>
  </ul>
  <div class="tip" style="margin-bottom:0">
    <b>Erwartung:</b> Auf diesem Niveau wird die schwere Stufe eher selten geknackt. Rechnet mit
    Ergebnissen um 12 bis 18 von 24&nbsp;Punkten; volle 24 w&auml;ren eine Glanzleistung.
    Die Dauer bleibt bei <b>2 bis 2,5&nbsp;Stunden</b>, weil nichts gesucht werden muss &ndash;
    die Texte sind kurz, nur das Denken dauert.
  </div>
</div>

  <p class="meta">Station&nbsp;5 heißt in der Rallye bewusst nicht nach ihrem Heiligen &ndash;
     der Name wäre die halbe Lösung. Der angegebene Radius ist der Grundwert; zusätzlich zieht
     die Rallye die vom Gerät gemeldete Messungenauigkeit ab (höchstens 100&nbsp;m), damit
     schlechte Fixes in den Altstadtgassen keine Gruppe aussperren. Ein einmal besuchter Ort
     bleibt dauerhaft freigeschaltet &ndash; die Gruppen dürfen zum Knobeln ins Café.</p>
</div>

<h2>Vorher ansagen</h2>
<div class="card">
  <ul>
    <li><b>Ein Handy pro Gruppe</b> legt die Gruppe an &ndash; das mit dem meisten Akku.
        Die Dauer-Ortung zieht spürbar Strom; in der Rallye gibt es dafür einen
        Pause-Knopf für die Café-Phase.</li>
    <li><b>Standortfreigabe erlauben</b>, wenn der Browser fragt. Ohne sie schaltet
        sich keine Station frei.</li>
    <li><b>Nachschlagen ist ausdrücklich erlaubt</b> und bei den schweren Varianten oft
        nötig. Die Lösungen selbst stehen nirgends im Netz &ndash; gesucht werden muss nach
        Sachwissen, nicht nach der Rallye.</li>
    <li><b>Sichern</b>: Oben in der Leiste liegen zwei Knöpfe &ndash; <b>QR</b> und
        <b>JSON</b>. Zusätzlich fragt die Rallye nach jedem erreichten Ort und nach
        jeder abgeschlossenen Station von selbst nach (QR / Datei / jetzt nicht).
        Sagt den Gruppen, dass sie das wenigstens ein- bis zweimal annehmen sollen.</li>
    <li><b>Treffpunkt und Uhrzeit</b> an der Piazza dell&rsquo;Unità fest vereinbaren.
        Die Rallye zeigt zwar eine Uhr, aber keinen Countdown.</li>
    <li><b>Bonusstation</b> nur freigeben, wenn eine Gruppe deutlich vor der Zeit liegt.</li>
    <li><b>Verkehr:</b> Auf dem Weg zum Teatro Romano und zum Dom wird mehrfach eine
        befahrene Straße gequert. Kurz erwähnen.</li>
  </ul>
</div>

<h2>Die Lösungen</h2>

<div class="card st">
  <h3>1 &middot; Piazza dell&rsquo;Unit&agrave; d&rsquo;Italia</h3>
  <p class="meta">Kette: vier Figuren z&auml;hlen &rarr; der fehlende Erdteil &rarr; wer ihn
     kartierte &rarr; Riff &rarr; Schiff leichtern</p>
  <div class="lvl"><b>Vor Ort:</b> die vier Attribute am Brunnen (Federkrone, Kamel, Krokodil,
     F&uuml;llhorn) &ndash; und die L&uuml;cke, die niemand gemei&szlig;elt hat.</div>
  <div class="lvl"><b>Schwer:</b> nennt weder Australien noch Cook noch das Schiff. Gefragt:
     Was ging &uuml;ber Bord, als der Rumpf auf Korallen aufri&szlig;? Wink: &bdquo;was am
     schwersten wog und das Schiff bis dahin besch&uuml;tzt hatte&ldquo;.</div>
  <div class="lvl"><b>Mittel:</b> Juni 1770, gr&ouml;&szlig;tes Riff der Welt; aus Eisen, tonnenschwer,
     aber nicht Ballast im Kiel, sondern oben an der Bordwand.</div>
  <div class="lvl"><b>Leicht:</b> sechs St&uuml;ck, 200 Jahre sp&auml;ter geborgen, Gusseisen,
     &bdquo;sprachen mit Pulver&ldquo;.</div>
  <p class="sol">&rarr; KANONEN</p>
  <p class="meta">Akzeptiert: Kanonen, Kanone, Gesch&uuml;tze, Kanonenrohre.
     <b>Nicht:</b> Ballast, Anker, Australien, Endeavour.<br>
     <i>Endeavour</i>, 11.&nbsp;6.&nbsp;1770, rund 50&nbsp;t &uuml;ber Bord, darunter sechs
     gusseiserne Kanonen; 1969 geborgen.</p>
</div>

<div class="card st">
  <h3>2 &middot; Molo Audace</h3>
  <p class="meta">Kette: Sockelinschrift lesen &rarr; der alte Name <i>San Carlo</i> &rarr;
     zwei Schiffe, zwei Flaggen &rarr; wer verlor</p>
  <div class="lvl"><b>Vor Ort:</b> die Bronzescheibe am Molokopf. Die Inschrift steht im
     R&auml;tsel vollst&auml;ndig: <i>Approd&ograve; a questo molo la R. nave Audace prima col
     vessillo d&rsquo;Italia &middot; III novembre MCMXVIII.</i></div>
  <div class="lvl"><b>Schwer:</b> Der Damm hie&szlig; vorher nach der 1740 gesunkenen
     <i>San Carlo</i>, die unter der Flagge des Hauses fuhr, dem Triest seit 1382 geh&ouml;rte.
     Wo ein Schiff das andere abl&ouml;st, wird auch anderes abgel&ouml;st. Gefragt: <i>wessen
     Herrschaft endete?</i></div>
  <div class="lvl"><b>Mittel:</b> MCMXVIII = 1918, von 1382 an 536 Jahre; Wien, Doppeladler,
     seit 1867 zwei H&auml;lften mit Bindestrich.</div>
  <div class="lvl"><b>Leicht:</b> vorletzter Kaiser Franz Joseph, letzter Karl; Haus <i>oder</i>
     Staatsname zul&auml;ssig.</div>
  <p class="sol">&rarr; DIE HABSBURGER / &Ouml;STERREICH-UNGARN</p>
  <p class="meta">Akzeptiert: Habsburger, Habsburg, Haus Habsburg, Habsburgermonarchie,
     Donaumonarchie, &Ouml;sterreich-Ungarn, &Ouml;sterreich, k.u.k. Monarchie.
     <b>Nicht:</b> Venedig, Audace, San Carlo, Italien, 1918.</p>
</div>

<div class="card st">
  <h3>3 &middot; Piazza della Borsa</h3>
  <p class="meta">Kette: falscher Gott auf dem Brunnen &rarr; Gott der Kaufleute &rarr; das
     Metall seines Namens</p>
  <div class="lvl"><b>Vor Ort:</b> der Dreizack der Brunnenfigur &ndash; ausdr&uuml;cklich die
     falsche F&auml;hrte &ndash; und die Tempelfassade der Borsa Vecchia.</div>
  <div class="lvl"><b>Schwer:</b> Fl&uuml;gelfersen, Schlangenstab, Schutzherr der H&auml;ndler
     und Diebe; &bdquo;sein Name h&auml;ngt an einem Metall, das davonl&auml;uft wie er&ldquo;.
     Merkur selbst ist <i>nicht</i> die Antwort.</div>
  <div class="lvl"><b>Mittel:</b> Merkur/Hermes; einziges bei Zimmertemperatur fl&uuml;ssiges
     Metall, zerf&auml;llt in zitternde Kugeln.</div>
  <div class="lvl"><b>Leicht:</b> Thermometer, Barometer, Zeichen Hg, <i>hydrargyros</i> =
     Wassersilber &ndash; &bdquo;aus dem Wasser ist etwas Lebendiges geworden&ldquo;
     (<i>queck</i> = lebendig).</div>
  <p class="sol">&rarr; QUECKSILBER</p>
  <p class="meta">Akzeptiert: Quecksilber, Hg, Hydrargyrum, Mercury, Mercurius.
     <b>Nicht:</b> Merkur, Hermes, Neptun, Silber.</p>
</div>

<div class="card st">
  <h3>4 &middot; Canal Grande / Ponte Rosso</h3>
  <p class="meta">Kette: Statue &rarr; Roman &rarr; Held &rarr; die List in der
     Kyklopenh&ouml;hle</p>
  <div class="lvl"><b>Vor Ort:</b> die Bronzefigur mit Hut, Brille und Buch.</div>
  <div class="lvl"><b>Schwer:</b> Der Riese ruft den Namen, den der Held ihm genannt hatte
     &ndash; und die Br&uuml;der gehen wieder heim. Gefragt ist <i>dieser Name</i>; die Pointe
     ist, dass es keiner ist.</div>
  <div class="lvl"><b>Mittel:</b> Odysseus, Polyphem; &bdquo;kein Name, sondern eine
     Falle&ldquo;.</div>
  <div class="lvl"><b>Leicht:</b> griechisch <i>Outis</i>, lateinisch <i>Nemo</i> &ndash;
     ins Deutsche &uuml;bersetzen.</div>
  <p class="sol">&rarr; NIEMAND</p>
  <p class="meta">Akzeptiert: Niemand, Outis, Nemo, Keiner.
     <b>Nicht:</b> Odysseus, Polyphem, Ulysses, Joyce.</p>
</div>

<div class="card st">
  <h3>5 &middot; Die Kirche mit den blauen Kuppeln</h3>
  <p class="meta">Kyrillisch entziffern + Ich-R&auml;tsel auf die Eigenschaft</p>
  <div class="lvl"><b>Vor Ort:</b> die Zeichen &uuml;ber dem Portal, mit den drei
     T&auml;uschungen &#1057;=S, &#1053;=N, &#1056;=R.</div>
  <div class="lvl"><b>Schwer:</b> Nach dem Entziffern spricht das zweite Wort selbst:
     <i>&bdquo;Ich bin einer und bin drei &hellip; ich bin kein Mensch, und doch z&auml;hlt man
     mich in Personen &hellip; wer mich teilt, hat mich verloren.&ldquo;</i> Der Heilige
     &uuml;ber dem Portal (Spiridon) ist die gelegte F&auml;hrte.</div>
  <div class="lvl"><b>Mittel:</b> voller Buchstabenschl&uuml;ssel; Vater, Sohn, Heiliger Geist
     als ein Wesen.</div>
  <div class="lvl"><b>Leicht:</b> <i>Sveta Trojica</i> / <i>Santissima Trinit&agrave;</i>;
     beginnt mit dem Zahlwort Drei, beide Endungen gelten.</div>
  <p class="sol">&rarr; DREIFALTIGKEIT</p>
  <p class="meta">Akzeptiert: Dreifaltigkeit, Dreieinigkeit, Heilige/Heiligste Dreifaltigkeit,
     Trinit&auml;t, Sveta Trojica, Santissima Trinita.
     <b>Nicht:</b> Spiridon, Kyrill.</p>
</div>

<div class="card st">
  <h3>6 &middot; Teatro Romano</h3>
  <p class="meta">Chronogramm + zweites Datum als Umrechnungsschl&uuml;ssel.
     <b>Auf Stufe&nbsp;1 steht keine einzige arabische Jahreszahl.</b></p>
  <div class="lvl"><b>Vor Ort:</b> Blick von der Br&uuml;stung. Im Einleitungstext steht der
     Fun Fact, dass das Theater fast am Wasser lag (K&uuml;stenlinie weiter landeinw&auml;rts,
     r&ouml;mische Kaimauern unter den Nachbarstra&szlig;en) und dass nur der Flurname
     <i>Rena Vecia</i> es verriet.</div>
  <div class="lvl"><b>Schwer:</b> Eine fingierte Barocktafel im Stil eines <i>Chronogramms</i>,
     die Zahlzeichen gr&ouml;&szlig;er und rot:
     <br><br><code>THEATRVM TERGESTINVM / <b>D</b>E<b>C</b>RETO <b>C</b>IVIVM <b>C</b>ONDITVM /
     <b>L</b>VD<b>I</b>S INAVGVRATVM</code> &rarr; <b>DCCCLI = 851</b>
     <br><br>Dann der Schl&uuml;ssel: ein zweites Datum <i>in derselben Z&auml;hlung</i>,
     <code>ANNO DCCCXXXII</code> (= 832), beschrieben &uuml;ber den Vesuvausbruch &ndash; Berg am
     Golf von Neapel, verschüttete St&auml;dte, ein junger Augenzeuge, der zwei Briefe an Tacitus
     schrieb, Wiederentdeckung nach mehr als anderthalb Jahrtausenden.
     <br><br>Die Gruppe wei&szlig; (oder erschlie&szlig;t), dass das <b>79 n.&nbsp;Chr.</b> war.
     Aus 832 und 79 f&auml;llt der Abstand der beiden Kalender heraus: <b>753</b>. Damit
     851&nbsp;&minus;&nbsp;753.
     <br><br>Weder <i>ab urbe condita</i> noch 753 noch 79 werden auf dieser Stufe genannt.</div>
  <div class="lvl"><b>Mittel:</b> l&ouml;st beide r&ouml;mischen Zahlen auf (851 und 832), nennt
     Vesuv, Plinius den J&uuml;ngeren, Pompeji/Herculaneum und das Jahr 79 &ndash; und weist auf
     die Subtraktion der beiden hin.</div>
  <div class="lvl"><b>Leicht:</b> gibt 832&nbsp;&minus;&nbsp;79&nbsp;=&nbsp;753 samt Merkreim;
     die letzte Subtraktion bleibt.</div>
  <p class="sol">&rarr; 98 (n. Chr.)</p>
  <p class="meta">Rechenweg: DCCCLI&nbsp;=&nbsp;851 &middot; DCCCXXXII&nbsp;=&nbsp;832 &middot;
     832&nbsp;&minus;&nbsp;79&nbsp;=&nbsp;753 &middot; 851&nbsp;&minus;&nbsp;753&nbsp;=&nbsp;<b>98</b>.
     <br>Gleichwertiger Weg: 851&nbsp;&minus;&nbsp;832&nbsp;=&nbsp;19, also
     79&nbsp;+&nbsp;19&nbsp;=&nbsp;98. Beide setzen voraus, dass 79 bekannt ist.
     <br><br>Akzeptiert: 98, 98 n. Chr., 98 nach Christus, achtundneunzig, 98 AD, Jahr 98.
     <b>Nicht</b> akzeptiert: 851, 832, 753, 79, 19, DCCCLI, DCCCXXXII &ndash; s&auml;mtliche
     Zwischenergebnisse werden abgelehnt.
     <br><br><b>Zur Ehrlichkeit:</b> Die Tafel ist erfunden; Chronogramme als Gattung sind echt
     und an barocken Portalen h&auml;ufig. Das steht auch so in der Aufl&ouml;sung f&uuml;r die
     Gruppen. Alles Weitere stimmt: 79&nbsp;n.&nbsp;Chr. = 832&nbsp;a.u.c., 98&nbsp;n.&nbsp;Chr.
     = 851&nbsp;a.u.c., Trajans Thronbesteigung, unter dem das Theater seinen Ausbau erhielt.
     <br><br><b>Warum gerade der Vesuv:</b> Er ist nicht irgendeine Subtraktionszahl, sondern
     liefert den Schl&uuml;ssel selbst &ndash; und thematisch passt er, weil Pompeji dasselbe
     Schicksal hatte wie dieses Theater: unter einer Schicht verschwunden, nach Jahrhunderten
     wieder ausgegraben.</p>
</div>

<div class="card st">
  <h3>7 &middot; Arco di Riccardo</h3>
  <p class="meta">Kette: versunkener Bogen &rarr; fremder Name &rarr; Schiffbruch an dieser
     K&uuml;ste &rarr; Gefangenschaft &rarr; Beiname</p>
  <div class="lvl"><b>Vor Ort:</b> Der Bogen steckt zwei Meter im Boden.</div>
  <div class="lvl"><b>Schwer:</b> Sturm wirft sein Schiff an diese K&uuml;ste; als Pilger
     verkleidet erkannt (Ring bzw. das Huhn am Spie&szlig;); Burg &uuml;ber der Donau; vom
     L&ouml;segeld baute eine fremde Hauptstadt ihre Mauern; &bdquo;sein Beiname nennt das Tier,
     dessen Mut man ihm zusprach&ldquo;. Weder Name noch Land werden genannt.</div>
  <div class="lvl"><b>Mittel:</b> Dezember 1192, Dritter Kreuzzug, K&ouml;nig von England,
     D&uuml;rnstein, Wien; italienisch <i>Riccardo Cuor di Leone</i>.</div>
  <div class="lvl"><b>Leicht:</b> <i>Cuor di Leone</i> = Herz des L&ouml;wen; Vorname ist der
     deutsche Zwilling von Riccardo.</div>
  <p class="sol">&rarr; RICHARD L&Ouml;WENHERZ</p>
  <p class="meta">Akzeptiert: Richard L&ouml;wenherz (auch ohne Umlaut), L&ouml;wenherz,
     Richard&nbsp;I., Riccardo Cuor di Leone, Richard Lionheart.
     <b>Nicht:</b> Cardo, Amphore, D&uuml;rnstein, Wien.<br>
     Zur Ehrlichkeit: Der Bogenname kommt sprachlich von <i>Arco del Cardo</i>; Richard war nie
     in Triest, erlitt aber 1192 bei Aquileia Schiffbruch &ndash; keine 40&nbsp;km von hier.
     Das steht so in der Aufl&ouml;sung.</p>
</div>

<div class="card st">
  <h3>8 &middot; Cattedrale di San Giusto</h3>
  <p class="meta">Einstieg &uuml;ber die Stadtflagge</p>
  <div class="lvl"><b>Vor Ort:</b> die rot-wei&szlig;e Fahne mit dem Ger&auml;t &ndash; an
     Masten, Fassaden, Gullydeckeln. Die Teile des Waffenkopfs sind abz&auml;hlbar.</div>
  <div class="lvl"><b>Schwer:</b> Legende 303/Sergius; genaue Beschreibung (Beil, Haken,
     Sto&szlig;dorn auf langem Schaft); Wink auf die M&auml;nner in gelb-blau gestreiften
     Gew&auml;ndern in Rom.</div>
  <div class="lvl"><b>Mittel:</b> Schweizergarde; italienisch <i>alabarda</i>; zehn
     Buchstaben.</div>
  <div class="lvl"><b>Leicht:</b> <i>helm</i> (Schaft) + <i>barte</i> (Beil) &rarr;
     <i>helmbarte</i> &ndash; laut aussprechen.</div>
  <p class="sol">&rarr; HELLEBARDE</p>
  <p class="meta">Akzeptiert: Hellebarde, Hellebarte, Helmbarte, Alabarda, Halberd.
     <b>Nicht:</b> Meteorit, Schwert, Beil, Lanze.</p>
</div>

<div class="card st bonus">
  <h3>&#9733; &middot; Le Rive &ndash; Uferpromenade <i>(Bonus)</i></h3>
  <p class="meta">Windrose statt Regattaname &ndash; Ableitung aus der Geografie</p>
  <div class="lvl"><b>Vor Ort:</b> Windrichtung sp&uuml;ren, Miramare im Nordwesten.</div>
  <div class="lvl"><b>Schwer:</b> Die Barcolana h&auml;ngt ganz am Wind; die acht Windnamen
     stammen von Seeleuten <i>in der Mitte des Mittelmeers</i>. Von dort liegt Libyen im
     S&uuml;dwesten &rarr; <i>Libeccio</i>. Von dort liegt Griechenland im Nordosten &rarr; ?
     Die Gruppe muss die Benennungsregel auf eine dritte Richtung anwenden.</div>
  <div class="lvl"><b>Mittel:</b> <i>Grecia</i> / <i>greco</i>, Endung <b>-ale</b> wie bei
     <i>maestrale</i>.</div>
  <div class="lvl"><b>Leicht:</b> <i>greco</i> ohne o, plus <i>-ale</i>; sieben Buchstaben.</div>
  <p class="sol">&rarr; GRECALE</p>
  <p class="meta">Akzeptiert: Grecale, Greco, Gregale.
     <b>Nicht:</b> Bora, Barcolana, Libeccio, Maestrale, Scirocco, Tramontana.<br>
     <b>Die Pointe steht in der Aufl&ouml;sung:</b> In Triest sagt niemand <i>Grecale</i> &ndash;
     hier hei&szlig;t der Nordostwind <b>Bora</b>, weil er hier ein Fallwind vom Karst ist und
     in B&ouml;en &uuml;ber 150&nbsp;km/h erreicht. Und ja: Er entscheidet die Regatta wirklich
     &ndash; bei Bora ist sie in gut einer Stunde gelaufen, bei Flaute dauert sie einen halben
     Tag.</p>
</div>

<h2>Hinweise zu den Orten</h2>
<div class="card">
  <ul>
    <li>Alle acht Pflichtstationen sind <b>frei zugänglich und kostenlos</b>, auch ohne
        ein Gebäude zu betreten. Die Rätsel lassen sich sämtlich von außen lösen.</li>
    <li><b>San Spiridione</b> und der <b>Dom</b> haben Öffnungszeiten und sind über Mittag
        oft geschlossen. Für die Rätsel ist das egal &ndash; wer aber hineinschauen will,
        plant den Dom besser vor 12&nbsp;Uhr oder nach 15:30&nbsp;Uhr ein. In beiden
        Kirchen gelten übliche Kleiderregeln (Schultern und Knie bedeckt).</li>
    <li>Das <b>Teatro Romano</b> ist eine Grabung unterhalb des Straßenniveaus und wird
        von der Balustrade aus betrachtet; das Areal selbst ist normalerweise nicht betretbar.</li>
    <li>Das <b>Castello di San Giusto</b> liegt direkt neben dem Dom. Der Vorplatz mit
        dem Blick über den Golf ist frei; für Museum und Wehrgang wird Eintritt verlangt.
        Die Rallye braucht ihn nicht.</li>
    <li>Der Aufstieg zum Dom über die <b>Scala dei Giganti</b> oder die Via della Cattedrale
        ist steil und bei Hitze anstrengend. Trinkwasser mitnehmen &ndash; oben gibt es
        Brunnen, unterwegs eher nicht.</li>
  </ul>
</div>

<h2>Sichern und Ger&auml;tewechsel</h2>
<div class="card">
  <p>Der Fortschritt liegt im <code>localStorage</code> des benutzten Browsers. Drei
     Wege bringen ihn woandershin:</p>
  <ul>
    <li><b>QR-Code</b> (Knopf <b>&#9638;&nbsp;QR</b> oben): erzeugt einen Link der Form
        <code>&hellip;/triest.html#r=&hellip;</code>, der den kompletten Stand
        <i>in sich</i> tr&auml;gt &ndash; Teamname, Namen, besuchte Orte, Stufen,
        verbrauchte Versuche, Punkte und Zeiten. Das andere Handy scannt ihn mit der
        normalen Kamera und ist sofort im Spiel. Gibt es dort schon einen Stand,
        fragt die Rallye vor dem &Uuml;berschreiben nach. Im QR-Fenster liegt zus&auml;tzlich
        der Knopf <b>Link kopieren</b>: Er legt genau dieselbe Adresse in die Zwischenablage,
        die auch im Bild steckt &ndash; praktisch, um sie in einen Gruppenchat zu schicken,
        falls das Scannen scheitert.</li>
    <li><b>JSON-Datei</b> (Knopf <b>&#11015;&nbsp;JSON</b>): vollst&auml;ndiger Stand als
        Datei, gut zum Einsammeln am Ende.</li>
    <li><b>Sicherungscode</b> (unter &bdquo;Hilfe&ldquo;): derselbe Inhalt als Text zum
        Kopieren in einen Chat.</li>
  </ul>
  <div class="tip">
    <b>Automatische Nachfrage:</b> Nach jedem per Ortung erreichten Ort und nach jeder
    abgeschlossenen Station blendet sich unten ein Streifen mit drei M&ouml;glichkeiten ein
    (QR / Datei / jetzt nicht). Damit es nicht nervt, kommt die Frage h&ouml;chstens alle
    90&nbsp;Sekunden.
  </div>
  <p class="meta">Technisch: Der QR-Code wird im Browser selbst gerechnet &ndash; die Seite
     l&auml;dt daf&uuml;r nichts nach. Damit er auf einem Handydisplay sicher scannbar bleibt,
     wird der Stand stark eingedampft (Bitfelder statt JSON); typisch ergibt das einen Code
     der Version&nbsp;9 bis&nbsp;12, also 53 bis 65 Module Kantenl&auml;nge. Sehr lange
     Team- und Vornamen machen ihn gr&ouml;&szlig;er; wird es zu viel, sagt die Rallye das
     und verweist auf Datei oder Code.</p>
</div>

<h2>Auswertung</h2>
<div class="card">
  <p>Die Gruppe zeigt am Ende den Reiter <b>Ergebnis</b>: Gesamtpunktzahl, Rangtitel und
     eine Tabelle, welche Station auf welcher Stufe gelöst wurde. Ein &#9873; markiert
     Stationen, die über den Freischaltcode von Hand bestätigt wurden.</p>
  <p>Zum Einsammeln eignet sich die Schaltfläche <b>Als Datei sichern</b> (JSON) oder
     der <b>Sicherungscode</b>. Beides enthält Teamname, Namen, Zeiten und Punkte.</p>
  <div class="tip" style="margin-bottom:0">
    <b>Punkteschlüssel:</b> 3&nbsp;P = auf der schweren Variante gelöst &middot;
    2&nbsp;P = mittlere &middot; 1&nbsp;P = leichte &middot; 0&nbsp;P = alle neun Versuche
    verbraucht. Maximal 24&nbsp;P, mit Bonusstation 27&nbsp;P.
  </div>
</div>

<h2 id="pwtool-h">Passwortschutz</h2>
<div class="card" id="pwtool">
  <p>Der Schutz sitzt in dieser Datei ganz unten im <code>&lt;script&gt;</code>-Block.
     <b>Eine Zeile schaltet ihn um:</b></p>
  <p><code>var PASSWORTSCHUTZ = true;</code> &nbsp;&rarr;&nbsp; auf <code>false</code>
     setzen, und die Seite ist ohne Passwort zugänglich.</p>

  <p style="margin-top:1.2rem"><b>Passwort ändern:</b> Das Passwort steht nicht im Klartext
     in der Datei, sondern als Prüfsumme. Neues Passwort hier eintippen &ndash; unten
     erscheint die Zeile zum Hineinkopieren:</p>
  <input type="text" id="newpw" placeholder="neues Passwort" autocomplete="off" spellcheck="false">
  <p style="margin:.7rem 0 0"><code id="newline">var PASSWORT_HASH  = '…';</code></p>

  <div class="warn" style="margin-top:1.2rem">
    <b>Was der Schutz leistet &ndash; und was nicht.</b> Er hält die Seite von Suchmaschinen
    und von neugierigen Blicken frei: Der Inhalt steht in einem <code>&lt;template&gt;</code>,
    wird ohne Passwort gar nicht erst in die Seite eingebaut und ist mit den
    Entwicklerwerkzeugen nicht einfach „wieder einblendbar“. Wer aber den
    <i>Quelltext</i> der Datei öffnet, liest alles &ndash; das ist bei jeder rein
    clientseitigen Lösung so, solange die Datei ohne Build-Schritt von Hand
    bearbeitbar bleiben soll. Wenn es fester sein muss, gehört zusätzlich ein
    <code>.htaccess</code>-Schutz auf den Ordner; beides zusammen ist kein Widerspruch.
  </div>
</div>

</div>

<script>
(function(){
'use strict';

/* ===================================================================
   PASSWORTSCHUTZ  –  diese eine Zeile schaltet ihn ein und aus:
   =================================================================== */
var PASSWORTSCHUTZ = true;               /* false = Seite frei zugänglich */
/* =================================================================== */

var PASSWORT_HASH  = 'a28acec8';         /* Prüfsumme des Passworts */
var SALT = 'tergeste-2026:';
var SKEY = 'edu-mrh.triest-loesungen';   /* merkt die Freigabe für diese Sitzung */

/* Dieselbe Normalisierung und Prüfsumme wie in der Rallye. */
function norm(s){
  return String(s==null?'':s)
    .normalize('NFC').toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]/g,'');
}
function fnv(s){
  var x=0x811c9dc5;
  for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,0x01000193)>>>0;}
  return ('0000000'+x.toString(16)).slice(-8);
}
function hash(s){return fnv(SALT+norm(s));}

function oeffnen(){
  var tpl=document.getElementById('inhalt');
  document.getElementById('ziel').appendChild(tpl.content.cloneNode(true));
  tpl.remove();                                  /* Vorlage aus dem DOM nehmen */
  var gate=document.getElementById('gate');
  if(gate) gate.remove();
  werkzeug();
}

/* Kleines Hilfsmittel: neues Passwort -> fertige Codezeile zum Kopieren. */
function werkzeug(){
  var inp=document.getElementById('newpw'), out=document.getElementById('newline');
  if(!inp||!out) return;
  inp.addEventListener('input',function(){
    var v=inp.value.trim();
    out.textContent = v
      ? "var PASSWORT_HASH  = '"+hash(v)+"';"
      : "var PASSWORT_HASH  = '…';";
  });
}

if(!PASSWORTSCHUTZ){
  oeffnen();
}else{
  var frei=false;
  try{frei=sessionStorage.getItem(SKEY)==='1';}catch(e){}
  if(frei){
    oeffnen();
  }else{
    var gate=document.getElementById('gate');
    gate.hidden=false;
    var pw=document.getElementById('pw'), msg=document.getElementById('msg');
    var pruefen=function(){
      if(hash(pw.value)===PASSWORT_HASH){
        try{sessionStorage.setItem(SKEY,'1');}catch(e){}
        oeffnen();
      }else{
        msg.textContent='Passwort stimmt nicht.';
        pw.value=''; pw.focus();
      }
    };
    document.getElementById('go').addEventListener('click',pruefen);
    pw.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();pruefen();}});
    pw.focus();
  }
}

})();
</script>
