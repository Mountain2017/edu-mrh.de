<h1>Lösungen, Route und Ablauf</h1>
<div class="warn">
  <b>Nur für Begleitpersonen.</b> Gebt die Adresse und das Passwort nicht an die
  Gruppen weiter &ndash; die Rallye selbst liegt unter
  <a href="triest.html">triest.html</a>.
</div>

<h2>Auf einen Blick</h2>
<div class="card">
  <table>
    <tr><th>Start &amp; Ziel</th><td>Piazza dell&rsquo;Unità d&rsquo;Italia (Bushalt an den Rive)</td></tr>
    <tr><th>Stationen</th><td>8 Pflichtstationen + 1 optionale Bonusstation</td></tr>
    <tr><th>Strecke</th><td>ca. 3&nbsp;km, davon ca. 65&nbsp;Höhenmeter hinauf zum Dom</td></tr>
    <tr><th>Reine Gehzeit</th><td>ca. 55&nbsp;Minuten</td></tr>
    <tr><th>Gesamtdauer</th><td><b>2 bis 2,5&nbsp;Stunden</b> bei mittlerem bis langsamem Rätseltempo</td></tr>
    <tr><th>Bonus</th><td>+ ca. 20&nbsp;Minuten (Uferpromenade, nur bei Zeitüberschuss)</td></tr>
    <tr><th>Punkte</th><td>max. 24 (8&nbsp;&times;&nbsp;3) + 3 Bonuspunkte</td></tr>
    <tr><th>Freischaltcode</th><td><code>LIGNANO-Q12</code> (Groß-/Kleinschreibung egal)</td></tr>
  </table>
</div>

<div class="tip">
  <b>Der Freischaltcode</b> wird in der Rallye unter &bdquo;Hilfe &rarr; Wenn das GPS streikt&ldquo;
  eingegeben. Danach erscheint in jeder Station ein Knopf, mit dem die Gruppe den Ort
  von Hand als besucht markieren kann. Solche Stationen bekommen im Ergebnis ein
  &#9873;-Zeichen &ndash; ihr seht also, wo nicht per Ortung bestätigt wurde.
  Gebt den Code nur heraus, wenn die Ortung tatsächlich nicht funktioniert.
</div>

<h2>Wie die R&auml;tsel gebaut sind</h2>
<div class="card">
  <p><b>Gedankenketten &uuml;ber mehrere Ecken.</b> Jede Station beginnt mit einer genauen
     Beobachtung vor Ort und f&uuml;hrt dann in drei bis f&uuml;nf Schritten woandershin.
     Beispiel Station&nbsp;1: vier Figuren am Brunnen &rarr; welcher Erdteil fehlt &rarr; wer ihn
     kartierte &rarr; er lief auf ein Riff &rarr; was wirft man dann &uuml;ber Bord? Antwort:
     Kanonen. Der Brunnen selbst kommt in der Antwort gar nicht mehr vor.</p>
  <p><b>Ohne Nachschlagen l&ouml;sbar.</b> Alles Sachwissen, das die Kette braucht, steht im
     R&auml;tseltext. Gefragt ist das Weiterdenken, nicht das Suchen. Ein Handy mit Netz ist
     <i>nicht</i> n&ouml;tig.</p>
  <p><b>Falsche F&auml;hrten sind Absicht.</b> Fast jede Station legt eine: Neptun steht gro&szlig;
     da, gesucht ist das Metall des Merkur. Spiridon steht &uuml;ber dem Portal, gesucht ist
     Kyrill. Der Bogen hei&szlig;t nach Riccardo, gesucht ist die Amphore. Die Hellebarde
     f&uuml;llt den halben Text, gesucht ist der Meteorit. Wer nur &uuml;berfliegt, tippt die
     F&auml;hrte ein und verliert einen Versuch &ndash; alle diese Zwischenstationen werden
     ausdr&uuml;cklich abgelehnt.</p>
  <ul>
    <li><b>Schwer (3&nbsp;P)</b> nennt kein Glied der Kette beim Namen und gibt nur die
        Wink&shy;worte.</li>
    <li><b>Mittel (2&nbsp;P)</b> l&ouml;st die mittleren Glieder auf, l&auml;sst den letzten
        Schritt offen.</li>
    <li><b>Leicht (1&nbsp;P)</b> f&uuml;hrt bis vor den letzten Schritt &ndash; der bleibt eine
        echte Leistung: ein Wort bilden, eine Endung anh&auml;ngen, eine Unterscheidung treffen.
        Wer alle neun Versuche verbraucht, bekommt <b>0&nbsp;Punkte</b>.</li>
    <li><b>Die Stufen bleiben stehen.</b> Stufe&nbsp;2 und&nbsp;3 sind <i>Nachtr&auml;ge</i>; die
        Gruppe sieht immer alles Freigeschaltete und kann am Ende die ganze Geschichte
        nachlesen.</li>
    <li><b>Vor-Ort-Hinweis:</b> zeigt auf das richtige Detail. Er verlangt N&auml;he
        (25&ndash;70&nbsp;m) <i>und</i> bleibt auf der schweren Stufe gesperrt.</li>
  </ul>
  <div class="tip" style="margin-bottom:0">
    <b>Erwartung:</b> Auf diesem Niveau wird die schwere Stufe eher selten geknackt. Rechnet mit
    Ergebnissen um 12 bis 18 von 24&nbsp;Punkten; volle 24 w&auml;ren eine Glanzleistung.
    Die Dauer bleibt bei <b>2 bis 2,5&nbsp;Stunden</b>, weil nichts gesucht werden muss &ndash;
    die Texte sind kurz, nur das Denken dauert.
  </div>
</div>

  <p class="meta">Station&nbsp;5 heißt in der Rallye bewusst nicht nach ihrem Heiligen &ndash;
     der Name wäre die halbe Lösung. Der angegebene Radius ist der Grundwert; zusätzlich zieht
     die Rallye die vom Gerät gemeldete Messungenauigkeit ab (höchstens 100&nbsp;m), damit
     schlechte Fixes in den Altstadtgassen keine Gruppe aussperren. Ein einmal besuchter Ort
     bleibt dauerhaft freigeschaltet &ndash; die Gruppen dürfen zum Knobeln ins Café.</p>
</div>

<h2>Vorher ansagen</h2>
<div class="card">
  <ul>
    <li><b>Ein Handy pro Gruppe</b> legt die Gruppe an &ndash; das mit dem meisten Akku.
        Die Dauer-Ortung zieht spürbar Strom; in der Rallye gibt es dafür einen
        Pause-Knopf für die Café-Phase.</li>
    <li><b>Standortfreigabe erlauben</b>, wenn der Browser fragt. Ohne sie schaltet
        sich keine Station frei.</li>
    <li><b>Nachschlagen ist ausdrücklich erlaubt</b> und bei den schweren Varianten oft
        nötig. Die Lösungen selbst stehen nirgends im Netz &ndash; gesucht werden muss nach
        Sachwissen, nicht nach der Rallye.</li>
    <li><b>Sichern</b>: Oben in der Leiste liegen zwei Knöpfe &ndash; <b>QR</b> und
        <b>JSON</b>. Zusätzlich fragt die Rallye nach jedem erreichten Ort und nach
        jeder abgeschlossenen Station von selbst nach (QR / Datei / jetzt nicht).
        Sagt den Gruppen, dass sie das wenigstens ein- bis zweimal annehmen sollen.</li>
    <li><b>Treffpunkt und Uhrzeit</b> an der Piazza dell&rsquo;Unità fest vereinbaren.
        Die Rallye zeigt zwar eine Uhr, aber keinen Countdown.</li>
    <li><b>Bonusstation</b> nur freigeben, wenn eine Gruppe deutlich vor der Zeit liegt.</li>
    <li><b>Verkehr:</b> Auf dem Weg zum Teatro Romano und zum Dom wird mehrfach eine
        befahrene Straße gequert. Kurz erwähnen.</li>
  </ul>
</div>

<h2>Die Lösungen</h2>

<div class="card st">
  <h3>1 &middot; Piazza dell&rsquo;Unit&agrave; d&rsquo;Italia</h3>
  <p class="meta">Kette: vier Erdteile &rarr; der fehlende &rarr; wer ihn kartierte &rarr;
     Riff &rarr; Schiff leichter machen</p>
  <div class="lvl"><b>Einstieg vor Ort:</b> Die vier Figuren am Brunnen und ihre Attribute
     (Federkrone, Kamel, Krokodil, F&uuml;llhorn) &ndash; daraus folgt, welcher Erdteil fehlt.</div>
  <div class="lvl"><b>Schwer:</b> nennt weder Australien noch Cook. Gefragt: Was warf die
     Mannschaft &uuml;ber Bord, als das Schiff auf Korallen festsa&szlig;? Der Wink lautet
     &bdquo;was am schwersten wog und das Schiff bis dahin besch&uuml;tzt hatte&ldquo;.</div>
  <div class="lvl"><b>Mittel:</b> Juni 1770, gr&ouml;&szlig;tes Riff der Welt; schwer, aus Eisen,
     aber nicht Ballast im Kiel, sondern oben an der Bordwand.</div>
  <div class="lvl"><b>Leicht:</b> sechs St&uuml;ck, 1969 geborgen, Gusseisen, &bdquo;sprachen mit
     Pulver&ldquo;.</div>
  <p class="sol">&rarr; KANONEN</p>
  <p class="meta">Akzeptiert: Kanonen, Kanone, Gesch&uuml;tze, Kanonenrohre.
     <b>Nicht</b> akzeptiert: Ballast, Anker, Australien, Endeavour.<br>
     Historisch: <i>Endeavour</i>, 11.&nbsp;6.&nbsp;1770, rund 50&nbsp;t &uuml;ber Bord, darunter
     sechs gusseiserne Kanonen; 1969 geborgen.</p>
</div>

<div class="card st">
  <h3>2 &middot; Molo Audace</h3>
  <p class="meta">Kette: Inschrift lesen &rarr; 1918 &rarr; 536 Jahre zur&uuml;ck &rarr; warum
     freiwillig &rarr; vor wem hatte Triest Angst</p>
  <div class="lvl"><b>Einstieg vor Ort:</b> die Bronzescheibe am Molokopf, Jahreszahl in
     r&ouml;mischen Zeichen (MCMXVIII).</div>
  <div class="lvl"><b>Schwer:</b> Das Haus wird nicht genannt, die Republik auch nicht.
     Wink: &bdquo;nannte das Wasser vor deinen F&uuml;&szlig;en ihren eigenen Golf&ldquo;
     (Golfo di Venezia).</div>
  <div class="lvl"><b>Mittel:</b> MCMXVIII, 14.&nbsp;Jahrhundert, &bdquo;die
     Durchlauchtigste&ldquo;, Lagune, Doge.</div>
  <div class="lvl"><b>Leicht:</b> gefl&uuml;gelter L&ouml;we mit Buch, Kan&auml;le statt
     Stra&szlig;en, Markusplatz.</div>
  <p class="sol">&rarr; VENEDIG</p>
  <p class="meta">Akzeptiert: Venedig, Venezia, Venice, Republik Venedig, Serenissima.
     <b>Nicht</b> akzeptiert: Habsburg, &Ouml;sterreich, Wien, 1918.<br>
     Historisch: 1382 Unterstellung unter Leopold&nbsp;III., 3.&nbsp;11.&nbsp;1918 Ankunft der
     <i>Audace</i> &ndash; 536 Jahre.</p>
</div>

<div class="card st">
  <h3>3 &middot; Piazza della Borsa</h3>
  <p class="meta">Kette: falscher Gott auf dem Brunnen &rarr; richtiger Gott der Kaufleute
     &rarr; das Metall, das seinen Namen tr&auml;gt</p>
  <div class="lvl"><b>Einstieg vor Ort:</b> der Dreizack der Brunnenfigur &ndash; ausdr&uuml;cklich
     die falsche F&auml;hrte &ndash; und die Tempelfassade der Borsa Vecchia.</div>
  <div class="lvl"><b>Schwer:</b> Fl&uuml;gelfersen, Schlangenstab, Schutzherr der H&auml;ndler
     und Diebe; &bdquo;sein Name h&auml;ngt an einem Metall, das davonl&auml;uft wie er&ldquo;.
     Merkur selbst ist <i>nicht</i> die Antwort.</div>
  <div class="lvl"><b>Mittel:</b> Merkur/Hermes; einziges bei Zimmertemperatur fl&uuml;ssiges
     Metall, zerf&auml;llt in zitternde Kugeln.</div>
  <div class="lvl"><b>Leicht:</b> Fieberthermometer, Barometer, Zeichen Hg, griechisch
     <i>hydrargyros</i> = Wassersilber &ndash; &bdquo;nur ist aus dem Wasser etwas Lebendiges
     geworden&ldquo;.</div>
  <p class="sol">&rarr; QUECKSILBER</p>
  <p class="meta">Akzeptiert: Quecksilber, Hg, Hydrargyrum, Mercury, Mercurius.
     <b>Nicht</b> akzeptiert: Merkur, Hermes, Neptun, Silber.<br>
     <i>queck</i> ist die alte Form von &bdquo;lebendig&ldquo;.</p>
</div>

<div class="card st">
  <h3>4 &middot; Canal Grande / Ponte Rosso</h3>
  <p class="meta">Kette: Statue &rarr; Roman &rarr; Held &rarr; die List in der Kyklopenh&ouml;hle</p>
  <div class="lvl"><b>Einstieg vor Ort:</b> die Bronzefigur mit Hut, Brille und Buch.</div>
  <div class="lvl"><b>Schwer:</b> Der Riese ruft den Namen, den der Held ihm genannt hatte
     &ndash; und die Br&uuml;der gehen wieder heim. Gefragt ist <i>dieser Name</i>.
     Die Pointe ist, dass es kein Name ist.</div>
  <div class="lvl"><b>Mittel:</b> Odysseus, Polyphem; &bdquo;seine Antwort war kein Name,
     sondern eine Falle&ldquo;.</div>
  <div class="lvl"><b>Leicht:</b> griechisch <i>Outis</i>, lateinisch <i>Nemo</i> &ndash;
     auf Deutsch &uuml;bersetzen.</div>
  <p class="sol">&rarr; NIEMAND</p>
  <p class="meta">Akzeptiert: Niemand, Outis, Nemo, Keiner.
     <b>Nicht</b> akzeptiert: Odysseus, Polyphem, Ulysses, Joyce, Kyklop.</p>
</div>

<div class="card st">
  <h3>5 &middot; Die Kirche mit den blauen Kuppeln</h3>
  <p class="meta">Kette: Kyrillisch entziffern &rarr; wie hei&szlig;t diese Schrift &rarr;
     nach wem &rarr; sein Name im Messruf</p>
  <div class="lvl"><b>Einstieg vor Ort:</b> die Zeichen &uuml;ber dem Portal, mit den drei
     T&auml;uschungen &#1057;=S, &#1053;=N, &#1056;=R. Das Entziffern ergibt <i>Spiridon</i>
     &ndash; die gelegte falsche F&auml;hrte.</div>
  <div class="lvl"><b>Schwer:</b> Gesucht ist der Mann, dessen Namen <i>die Schrift</i>
     tr&auml;gt; Wink: Thessaloniki, M&auml;hren, Bruder &ndash; und &bdquo;drei Silben, gefolgt
     von <i>eleison</i>&ldquo;.</div>
  <div class="lvl"><b>Mittel:</b> <i>Kyrie eleison</i>, griechisch <i>kyrios</i> = Herr;
     geboren als Konstantin, Slawenapostel mit Bruder Method.</div>
  <div class="lvl"><b>Leicht:</b> <i>Kyrie</i>, schlie&szlig;endes e gegen zwei l tauschen.</div>
  <p class="sol">&rarr; KYRILL</p>
  <p class="meta">Akzeptiert: Kyrill, Kyrillos, Kyrillus, Cyrill, Cyril, Konstantin-Kyrill.
     <b>Nicht</b> akzeptiert: Spiridon, Dreifaltigkeit, Method, Konstantin (allein).</p>
</div>

<div class="card st">
  <h3>6 &middot; Teatro Romano</h3>
  <p class="meta">Kette: Halbkreis sehen &rarr; verdoppeln &rarr; Amphitheater &rarr; das
     gr&ouml;&szlig;te &rarr; woher sein Name</p>
  <div class="lvl"><b>Einstieg vor Ort:</b> die halbrunde Cavea von der Br&uuml;stung aus.
     Die Form ist der Schl&uuml;ssel.</div>
  <div class="lvl"><b>Schwer:</b> &bdquo;Zwei H&auml;lften R&uuml;cken an R&uuml;cken&ldquo;
     &rarr; Amphitheater; das gr&ouml;&szlig;te steht in Rom und hei&szlig;t nach etwas
     &bdquo;ungeheuer Gro&szlig;em, das daneben stand&ldquo;. Weder Nero noch Koloss werden
     genannt.</div>
  <div class="lvl"><b>Mittel:</b> vergoldete Bronzefigur Neros, &uuml;ber 30&nbsp;m,
     <i>colossus</i>; amtlich <i>Amphitheatrum Flavium</i>.</div>
  <div class="lvl"><b>Leicht:</b> Endung <b>-eum</b> wie Museum und Mausoleum, deutsch mit K.</div>
  <p class="sol">&rarr; KOLOSSEUM</p>
  <p class="meta">Akzeptiert: Kolosseum, Colosseum, Koloseum, Amphitheatrum Flavium,
     Flavisches Amphitheater. <b>Nicht</b> akzeptiert: Amphitheater, Theater, Nero.</p>
</div>

<div class="card st">
  <h3>7 &middot; Arco di Riccardo</h3>
  <p class="meta">Kette: versunkener Bogen &rarr; der Boden stieg &rarr; Roms Scherbenberg
     &rarr; woraus er besteht</p>
  <div class="lvl"><b>Einstieg vor Ort:</b> Der Bogen steckt zwei Meter im Boden &ndash; die
     Beobachtung ist der ganze Ausgangspunkt.</div>
  <div class="lvl"><b>Schwer:</b> Monte Testaccio wird beschrieben, aber nicht benannt:
     fast 50&nbsp;m hoch, 25 Millionen zerschlagene Gef&auml;&szlig;e, Oliven&ouml;l aus Spanien,
     nicht wiederverwendbar. Gefragt ist die Gef&auml;&szlig;art.</div>
  <div class="lvl"><b>Mittel:</b> bauchiger Tonkrug, zwei Henkel, spitzer Fu&szlig; zum Stecken
     und Stapeln.</div>
  <div class="lvl"><b>Leicht:</b> <i>amphi</i> (beidseits) + <i>phoreus</i> (Tr&auml;ger),
     sieben Buchstaben, weiblich.</div>
  <p class="sol">&rarr; AMPHORE</p>
  <p class="meta">Akzeptiert: Amphore, Amphoren, Amphora, Amphorae.
     <b>Nicht</b> akzeptiert: Krug, Vase, Cardo, Testaccio.<br>
     Die <i>cardo</i>-Etymologie des Bogennamens steht jetzt in der Aufl&ouml;sung.</p>
</div>

<div class="card st">
  <h3>8 &middot; Cattedrale di San Giusto</h3>
  <p class="meta">Kette: das Eisen im Wappen &rarr; &bdquo;vom Himmel gefallen&ldquo; &rarr;
     Eisen f&auml;llt wirklich vom Himmel &rarr; wie hei&szlig;t es am Boden</p>
  <div class="lvl"><b>Einstieg vor Ort:</b> die Alabarda im Stadtwappen, die auf dem ganzen
     Aufstieg zu sehen war.</div>
  <div class="lvl"><b>Schwer:</b> Legende 303/Sergius, &auml;gyptische Dolche aus
     &bdquo;Eisen des Himmels&ldquo;. Gefragt ist ausdr&uuml;cklich der Brocken,
     <i>der den Boden erreicht</i>. Die Hellebarde ist hier nur der Aufh&auml;nger.</div>
  <div class="lvl"><b>Mittel:</b> Unterscheidung zur Sternschnuppe; &bdquo;das Wort ist
     l&auml;nger&ldquo;.</div>
  <div class="lvl"><b>Leicht:</b> Wort f&uuml;r die Himmelserscheinung + Endung wie bei
     Granit, Dolomit, Graphit.</div>
  <p class="sol">&rarr; METEORIT</p>
  <p class="meta">Akzeptiert: Meteorit, Meteoriten, Eisenmeteorit.
     <b>Nicht</b> akzeptiert: <b>Meteor</b> (genau das ist die gepr&uuml;fte Unterscheidung),
     Sternschnuppe, Hellebarde, Alabarda.<br>
     Falls eine Gruppe reklamiert: Die Frage sagt auf allen Stufen ausdr&uuml;cklich
     &bdquo;wenn er den Boden erreicht&ldquo;.</p>
</div>

  <p class="meta">Kette: wei&szlig;es Schloss &rarr; sein Erbauer &rarr; Krone in &Uuml;bersee
     &rarr; sein Bruder in Wien</p>
  <div class="lvl"><b>Einstieg vor Ort:</b> Blick nach Nordwesten auf Miramare.</div>
  <div class="lvl"><b>Schwer:</b> Admiral, Bruder eines Kaisers, erschossen; der Bruder
     regierte 68 Jahre und verlor Frau und Neffen durch M&ouml;rderhand, den Sohn durch die
     eigene. Weder Miramare noch Maximilian noch Wien-Namen werden genannt.</div>
  <div class="lvl"><b>Mittel:</b> Miramare, Maximilian, Mexiko, &bdquo;Sisi&ldquo;.</div>
  <div class="lvl"><b>Leicht:</b> zwei Vornamen &ndash; Franziskus in deutscher Form + der
     Ziehvater Jesu; Regierungszeit 1848&ndash;1916.</div>
  <p class="sol">&rarr; FRANZ JOSEPH</p>
  <p class="meta">Akzeptiert: Franz Joseph, Franz Josef, Franz Joseph&nbsp;I., Kaiser Franz Joseph.
     <b>Nicht</b> akzeptiert: Maximilian, Miramare, Mexiko, Sisi.<br>
     Schlie&szlig;t den Kreis zu Station&nbsp;2: Das Attentat auf den Neffen Franz Ferdinand
     l&ouml;ste den Krieg aus, an dessen Ende Triest italienisch wurde.</p>

<h2>Hinweise zu den Orten</h2>
<div class="card">
  <ul>
    <li>Alle acht Pflichtstationen sind <b>frei zugänglich und kostenlos</b>, auch ohne
        ein Gebäude zu betreten. Die Rätsel lassen sich sämtlich von außen lösen.</li>
    <li><b>San Spiridione</b> und der <b>Dom</b> haben Öffnungszeiten und sind über Mittag
        oft geschlossen. Für die Rätsel ist das egal &ndash; wer aber hineinschauen will,
        plant den Dom besser vor 12&nbsp;Uhr oder nach 15:30&nbsp;Uhr ein. In beiden
        Kirchen gelten übliche Kleiderregeln (Schultern und Knie bedeckt).</li>
    <li>Das <b>Teatro Romano</b> ist eine Grabung unterhalb des Straßenniveaus und wird
        von der Balustrade aus betrachtet; das Areal selbst ist normalerweise nicht betretbar.</li>
    <li>Das <b>Castello di San Giusto</b> liegt direkt neben dem Dom. Der Vorplatz mit
        dem Blick über den Golf ist frei; für Museum und Wehrgang wird Eintritt verlangt.
        Die Rallye braucht ihn nicht.</li>
    <li>Der Aufstieg zum Dom über die <b>Scala dei Giganti</b> oder die Via della Cattedrale
        ist steil und bei Hitze anstrengend. Trinkwasser mitnehmen &ndash; oben gibt es
        Brunnen, unterwegs eher nicht.</li>
  </ul>
</div>

<h2>Sichern und Ger&auml;tewechsel</h2>
<div class="card">
  <p>Der Fortschritt liegt im <code>localStorage</code> des benutzten Browsers. Drei
     Wege bringen ihn woandershin:</p>
  <ul>
    <li><b>QR-Code</b> (Knopf <b>&#9638;&nbsp;QR</b> oben): erzeugt einen Link der Form
        <code>&hellip;/triest.html#r=&hellip;</code>, der den kompletten Stand
        <i>in sich</i> tr&auml;gt &ndash; Teamname, Namen, besuchte Orte, Stufen,
        verbrauchte Versuche, Punkte und Zeiten. Das andere Handy scannt ihn mit der
        normalen Kamera und ist sofort im Spiel. Gibt es dort schon einen Stand,
        fragt die Rallye vor dem &Uuml;berschreiben nach.</li>
    <li><b>JSON-Datei</b> (Knopf <b>&#11015;&nbsp;JSON</b>): vollst&auml;ndiger Stand als
        Datei, gut zum Einsammeln am Ende.</li>
    <li><b>Sicherungscode</b> (unter &bdquo;Hilfe&ldquo;): derselbe Inhalt als Text zum
        Kopieren in einen Chat.</li>
  </ul>
  <div class="tip">
    <b>Automatische Nachfrage:</b> Nach jedem per Ortung erreichten Ort und nach jeder
    abgeschlossenen Station blendet sich unten ein Streifen mit drei M&ouml;glichkeiten ein
    (QR / Datei / jetzt nicht). Damit es nicht nervt, kommt die Frage h&ouml;chstens alle
    90&nbsp;Sekunden.
  </div>
  <p class="meta">Technisch: Der QR-Code wird im Browser selbst gerechnet &ndash; die Seite
     l&auml;dt daf&uuml;r nichts nach. Damit er auf einem Handydisplay sicher scannbar bleibt,
     wird der Stand stark eingedampft (Bitfelder statt JSON); typisch ergibt das einen Code
     der Version&nbsp;9 bis&nbsp;12, also 53 bis 65 Module Kantenl&auml;nge. Sehr lange
     Team- und Vornamen machen ihn gr&ouml;&szlig;er; wird es zu viel, sagt die Rallye das
     und verweist auf Datei oder Code.</p>
</div>

<h2>Auswertung</h2>
<div class="card">
  <p>Die Gruppe zeigt am Ende den Reiter <b>Ergebnis</b>: Gesamtpunktzahl, Rangtitel und
     eine Tabelle, welche Station auf welcher Stufe gelöst wurde. Ein &#9873; markiert
     Stationen, die über den Freischaltcode von Hand bestätigt wurden.</p>
  <p>Zum Einsammeln eignet sich die Schaltfläche <b>Als Datei sichern</b> (JSON) oder
     der <b>Sicherungscode</b>. Beides enthält Teamname, Namen, Zeiten und Punkte.</p>
  <div class="tip" style="margin-bottom:0">
    <b>Punkteschlüssel:</b> 3&nbsp;P = auf der schweren Variante gelöst &middot;
    2&nbsp;P = mittlere &middot; 1&nbsp;P = leichte &middot; 0&nbsp;P = alle neun Versuche
    verbraucht. Maximal 24&nbsp;P, mit Bonusstation 27&nbsp;P.
  </div>
</div>

<h2 id="pwtool-h">Passwortschutz</h2>
<div class="card" id="pwtool">
  <p>Der Schutz sitzt in dieser Datei ganz unten im <code>&lt;script&gt;</code>-Block.
     <b>Eine Zeile schaltet ihn um:</b></p>
  <p><code>var PASSWORTSCHUTZ = true;</code> &nbsp;&rarr;&nbsp; auf <code>false</code>
     setzen, und die Seite ist ohne Passwort zugänglich.</p>

  <p style="margin-top:1.2rem"><b>Passwort ändern:</b> Das Passwort steht nicht im Klartext
     in der Datei, sondern als Prüfsumme. Neues Passwort hier eintippen &ndash; unten
     erscheint die Zeile zum Hineinkopieren:</p>
  <input type="text" id="newpw" placeholder="neues Passwort" autocomplete="off" spellcheck="false">
  <p style="margin:.7rem 0 0"><code id="newline">var PASSWORT_HASH  = '…';</code></p>

  <div class="warn" style="margin-top:1.2rem">
    <b>Was der Schutz leistet &ndash; und was nicht.</b> Er hält die Seite von Suchmaschinen
    und von neugierigen Blicken frei: Der Inhalt steht in einem <code>&lt;template&gt;</code>,
    wird ohne Passwort gar nicht erst in die Seite eingebaut und ist mit den
    Entwicklerwerkzeugen nicht einfach „wieder einblendbar“. Wer aber den
    <i>Quelltext</i> der Datei öffnet, liest alles &ndash; das ist bei jeder rein
    clientseitigen Lösung so, solange die Datei ohne Build-Schritt von Hand
    bearbeitbar bleiben soll. Wenn es fester sein muss, gehört zusätzlich ein
    <code>.htaccess</code>-Schutz auf den Ordner; beides zusammen ist kein Widerspruch.
  </div>
</div>

<script>
(function(){
'use strict';

/* ===================================================================
   PASSWORTSCHUTZ  –  diese eine Zeile schaltet ihn ein und aus:
   =================================================================== */
var PASSWORTSCHUTZ = true;               /* false = Seite frei zugänglich */
/* =================================================================== */

var PASSWORT_HASH  = 'a28acec8';         /* Prüfsumme des Passworts */
var SALT = 'tergeste-2026:';
var SKEY = 'edu-mrh.triest-loesungen';   /* merkt die Freigabe für diese Sitzung */

/* Dieselbe Normalisierung und Prüfsumme wie in der Rallye. */
function norm(s){
  return String(s==null?'':s)
    .normalize('NFC').toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]/g,'');
}
function fnv(s){
  var x=0x811c9dc5;
  for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,0x01000193)>>>0;}
  return ('0000000'+x.toString(16)).slice(-8);
}
function hash(s){return fnv(SALT+norm(s));}

function oeffnen(){
  var tpl=document.getElementById('inhalt');
  document.getElementById('ziel').appendChild(tpl.content.cloneNode(true));
  tpl.remove();                                  /* Vorlage aus dem DOM nehmen */
  var gate=document.getElementById('gate');
  if(gate) gate.remove();
  werkzeug();
}

/* Kleines Hilfsmittel: neues Passwort -> fertige Codezeile zum Kopieren. */
function werkzeug(){
  var inp=document.getElementById('newpw'), out=document.getElementById('newline');
  if(!inp||!out) return;
  inp.addEventListener('input',function(){
    var v=inp.value.trim();
    out.textContent = v
      ? "var PASSWORT_HASH  = '"+hash(v)+"';"
      : "var PASSWORT_HASH  = '…';";
  });
}

if(!PASSWORTSCHUTZ){
  oeffnen();
}else{
  var frei=false;
  try{frei=sessionStorage.getItem(SKEY)==='1';}catch(e){}
  if(frei){
    oeffnen();
  }else{
    var gate=document.getElementById('gate');
    gate.hidden=false;
    var pw=document.getElementById('pw'), msg=document.getElementById('msg');
    var pruefen=function(){
      if(hash(pw.value)===PASSWORT_HASH){
        try{sessionStorage.setItem(SKEY,'1');}catch(e){}
        oeffnen();
      }else{
        msg.textContent='Passwort stimmt nicht.';
        pw.value=''; pw.focus();
      }
    };
    document.getElementById('go').addEventListener('click',pruefen);
    pw.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();pruefen();}});
    pw.focus();
  }
}

})();
</script>
