<script id="core">
/* ===================== Formelsatz & Zahlen ===================== */
const F=(n,d)=>`<span class="frac"><span class="fn">${n}</span><span class="fd">${d}</span></span>`;
const SQ=x=>`<span class="sqrt"><span class="radw"><svg viewBox="0 0 10 40" preserveAspectRatio="none"><path d="M0.5 25 L3 23 L6.3 39.5 L10 0.6"/></svg></span><span class="rc">${x}</span></span>`;
const CB=x=>`<span class="nw"><span class="ridx">3</span>${SQ(x)}</span>`;
const V=(s,sub)=>`<i>${s}</i>`+(sub?`<sub>${sub}</sub>`:"");
const D=`<span class="op">·</span>`, SQR=`<sup>2</sup>`, CUB=`<sup>3</sup>`, HALF=F("1","2"), PI="π";
const TS="&#8239;";
const UNITS={N:"N",kg:"kg",g:"g",t:"t",m:"m",km:"km",cm:"cm",s:"s",min:"min",h:"h",d:"d",
 "m/s":F("m","s"),"km/s":F("km","s"),"km/h":F("km","h"),"m/s2":F("m","s"+SQR),"N/kg":F("N","kg"),
 Gu:F("m"+CUB,"kg"+D+"s"+SQR),"m2/s2":F("m"+SQR,"s"+SQR)};
const G=6.67e-11;
function numStr(x,dec){let s=Math.abs(x).toFixed(dec);let [i,d]=s.split(".");if(i.length>=5)i=i.replace(/\B(?=(\d{3})+(?!\d))/g,"&#8239;");return (x<0?"−":"")+i+(d?","+d:"");}
function sigRound(x,s){if(x===0)return 0;const e=Math.floor(Math.log10(Math.abs(x)));const f=Math.pow(10,s-1-e);return Math.round(x*f)/f;}
function decs(s){const t=String(s);if(t.includes("e"))return 3;const i=t.indexOf(".");return i<0?0:Math.min(3,t.length-i-1);}
function pow10(e){return "10<sup>"+(e<0?"−":"")+Math.abs(e)+"</sup>";}
const isSci=x=>{const a=Math.abs(x);return a>=1e5||(a>0&&a<1e-2);};
/* gegebene Werte: nur nötige Stellen */
function gv(x){const a=Math.abs(x);if(a===0)return "0";
 if(isSci(x)){let e=Math.floor(Math.log10(a));let m=+(x/Math.pow(10,e)).toFixed(3);if(Math.abs(m)>=10){m=+(m/10).toFixed(3);e++;}return numStr(m,decs(m))+D+pow10(e);}
 const s=+x.toFixed(3);return numStr(s,decs(s));}
/* Ergebnisse */
function res(x,sig=3){const a=Math.abs(x);let r,s;
 if(isSci(x)){let e=Math.floor(Math.log10(a));let m=sigRound(x/Math.pow(10,e),sig);if(Math.abs(m)>=10){m/=10;e++;}r=m*Math.pow(10,e);s=numStr(m,sig-1)+D+pow10(e);}
 else if(a>=100){r=Math.round(x);s=numStr(r,0);}
 else{const e=Math.floor(Math.log10(a));const dec=Math.max(0,sig-1-e);r=sigRound(x,sig);s=numStr(r,dec);}
 const exact=Math.abs(r-x)<=Math.abs(x)*1e-12;
 if(exact&&!isSci(x)){s=gv(x);}
 return {rel:exact?"=":"≈",s,r};}
const q=(x,u)=>`<span class="nw">${gv(x)}${TS}${UNITS[u]}</span>`;
const qr=(x,u)=>`<span class="nw">${res(x).s}${TS}${UNITS[u]}</span>`;
const Gq=`<span class="nw">${gv(G)}${TS}${UNITS.Gu}</span>`;
const GVAL=`${V("G")} = ${Gq}`;
const GTXT=`<span class="const">Gravitationskonstante: ${GVAL}</span>`;
const P=x=>`(${x})`;
function resLine(sym,x,u){const r=res(x);return `<span class="resv">${sym} ${r.rel} ${r.s}${TS}${UNITS[u]}</span>`;}
function eqv(sym,x,u){const r=res(x);return `${sym} ${r.rel} ${r.s}${TS}${UNITS[u]}`;}
/* Zufall */
const ri=(a,b,st=1)=>a+st*Math.floor(Math.random()*(Math.floor((b-a)/st)+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* Himmelskörper */
const BODY={
 Erde:{M:5.97e24,R:6370,gen:"der Erde",dat:"der Erde",c:"#6fa8dc"},
 Mond:{M:7.35e22,R:1738,gen:"des Mondes",dat:"dem Mond",c:"#b7b7b7"},
 Mars:{M:6.42e23,R:3390,gen:"des Mars",dat:"dem Mars",c:"#d9875a"},
 Venus:{M:4.87e24,R:6052,gen:"der Venus",dat:"der Venus",c:"#e6c27a"},
 Merkur:{M:3.30e23,R:2440,gen:"des Merkur",dat:"dem Merkur",c:"#a39e98"},
 Jupiter:{M:1.90e27,R:71500,gen:"des Jupiters",dat:"dem Jupiter",c:"#d8a46b"},
 Saturn:{M:5.68e26,R:58200,gen:"des Saturns",dat:"dem Saturn",c:"#e3c98f"}
};
/* häufige Formeln */
const fFG=(a,b,r)=>`${V("F","G")} = ${V("G")}${D}${F(a+D+b,r+SQR)}`;
const FGform=fFG(V("m","1"),V("m","2"),V("r"));
const FZform=`${V("F","Z")} = ${V("m")}${D}${F(V("v")+SQR,V("r"))} = ${V("m")}${D}${V("ω")+SQR}${D}${V("r")}`;
const OMform=`${V("ω")} = ${F("2"+PI,V("T"))}`;
const VTform=`${V("v")} = ${F("2"+PI+D+V("r"),V("T"))}`;
const UC_F=`${UNITS.Gu}${D}${F("kg"+D+"kg","m"+SQR)} = ${F("kg"+D+"m","s"+SQR)} = N`;
const UC_g=`${UNITS.Gu}${D}${F("kg","m"+SQR)} = ${F("m","s"+SQR)}`;
const UC_v=`${SQ(UNITS.Gu+D+F("kg","m"))} = ${SQ(F("m"+SQR,"s"+SQR))} = ${F("m","s")}`;

function umlaufdauer(){

  ask:V("T"),unit:"min",ans,alts:[[2*Math.PI*Math.sqrt((c[1]*1e3)**3/(G*B.M))/60,"Achtung: Der Bahnradius ist r = R + h, nicht nur die Höhe."]],
  given:[`${V("h")} = ${q(c[1],"km")}`,`${V("M","Erde")} = ${q(B.M,"kg")}`,`${V("R","Erde")} = ${q(B.R,"km")}`,GVAL],find:V("T"),
  steps:[["Abstand",`${V("r")} = ${V("R","Erde")} + ${V("h")} = ${q(B.R+c[1],"km")} = ${q(r,"m")}`],
   ["Ansatz",`${V("m")}${D}${F("4"+PI+SQR,V("T")+SQR)}${D}${V("r")} = ${V("G")}${D}${F(V("m")+D+V("M","Erde"),V("r")+SQR)} &nbsp;| : ${V("m")} &nbsp;| ${D}${V("T")+SQR}${V("r")+SQR} &nbsp;| : ${P(V("G")+D+V("M","Erde"))}`],
   ["Umstellen",`${V("T")+SQR} = ${F("4"+PI+SQR+D+V("r")+CUB,V("G")+D+V("M","Erde"))} &nbsp;| √ &nbsp;⇒&nbsp; ${V("T")} = 2${PI}${D}${SQ(F(V("r")+CUB,V("G")+D+V("M","Erde")))}`],
   ["Einsetzen",`${V("T")} = 2${PI}${D}${SQ(F(P(q(r,"m"))+CUB,Gq+D+q(B.M,"kg")))} ${res(T).rel} ${qr(T,"s")}`],
   ["Einheiten",`${SQ(F("m"+CUB,UNITS.Gu+D+"kg"))} = ${SQ("s"+SQR)} = s`],

}

function Q(title,text,right,wrong,expl,hint,sk){return {quiz:true,title,text,opts:shuffle([{t:right,ok:true},...wrong.map(t=>({t,ok:false}))]),expl,tip:{h:hint},sk};}
function quizAbstand(){return Q("Doppelter Abstand",`Zwei Körper ziehen sich mit der Gravitationskraft ${V("F","G")} an. Nun wird der Abstand ihrer Schwerpunkte <b>verdoppelt</b>, die Massen bleiben gleich.<br>Wie groß ist die Gravitationskraft jetzt?`,
 `ein Viertel von ${V("F","G")}`,[`die Hälfte von ${V("F","G")}`,`das Doppelte von ${V("F","G")}`,`unverändert ${V("F","G")}`],
 `Im Gravitationsgesetz steht ${V("r")+SQR} im Nenner: ${V("F","G")} ~ ${F("1",V("r")+SQR)}. Bei doppeltem Abstand wird der Nenner (2${V("r")})${SQR} = 4${V("r")+SQR}, die Kraft also viermal kleiner.`,"Achte darauf, mit welcher Potenz der Abstand im Gravitationsgesetz vorkommt.",{l1:["m","1"],l2:["m","2"],rlab:"2r"});}
function quizMassen(){return Q("Masse und Abstand verändert",`Bei zwei Körpern wird die Masse des einen <b>verdreifacht</b> und gleichzeitig der Abstand ihrer Schwerpunkte <b>halbiert</b>.<br>Auf das Wievielfache ändert sich die Gravitationskraft?`,
 "auf das 12-Fache",["auf das 6-Fache","auf das 1,5-Fache","auf das 0,75-Fache"],
 `${V("F","G")} ~ ${F(V("m","1")+D+V("m","2"),V("r")+SQR)}: Die dreifache Masse liefert den Faktor 3; der halbe Abstand liefert im Nenner (${HALF})${SQR} = ${F("1","4")}, also den Faktor 4. Zusammen: 3${D}4 = 12.`,"Betrachte die beiden Änderungen nacheinander und multipliziere die Faktoren.",{l1:["m","1"],l2:["m","2"],lab1:"3m₁",rlab:"½ r"});}
function quizEisenhower(){return Q("Eisenhowers Frage",`1957 brachte die UdSSR den Satelliten Sputnik in eine Erdumlaufbahn. US-Präsident Eisenhower fragte seine Berater: „Alles, was wir sicher über den Sputnik wissen, sind Höhe und Umlaufgeschwindigkeit. Können Sie daraus die Masse von Sputnik berechnen?“<br>Was ist die richtige Antwort?`,
 "Nein – im Kraftansatz kürzt sich die Satellitenmasse heraus.",[`Ja – man stellt ${V("F","Z")} = ${V("F","G")} einfach nach der Satellitenmasse ${V("m")} um.`,`Ja – aber nur, wenn man zusätzlich die Gravitationskonstante ${V("G")} kennt.`,"Nein – in dieser Höhe wirkt keine Gravitationskraft mehr auf den Satelliten."],
 `Aus ${V("m")}${D}${F(V("v")+SQR,V("r"))} = ${V("G")}${D}${F(V("m")+D+V("M"),V("r")+SQR)} folgt ${V("v")+SQR} = ${F(V("G")+D+V("M"),V("r"))}. Die Satellitenmasse ${V("m")} kommt nicht mehr vor: Ein leichter und ein schwerer Satellit fliegen auf derselben Bahn gleich schnell. Aus Höhe und Geschwindigkeit lässt sich höchstens die Erdmasse bestimmen.`,"Schreibe den Kraftansatz Zentripetalkraft = Gravitationskraft auf und schau, welche Größen übrig bleiben.",{body:"Erde",h:1,v:1,R:0});}
function quizApfel(){return Q("Apfel und Erde",`Die Erde zieht einen Apfel mit der Gravitationskraft 1${TS}N an.<br>Wie groß ist die Kraft, mit der der Apfel die Erde anzieht?`,
 "Genau 1 N – die Kräfte sind gleich groß und entgegengesetzt gerichtet.",["Praktisch 0 N, weil der Apfel viel leichter ist.","Etwa 6 · 10<sup>24</sup> N, weil die Erde so schwer ist.","Gar keine – nur die Erde zieht an, nicht der Apfel."],
 `Nach dem Wechselwirkungsgesetz (3. Newtonsches Axiom) gilt |${V("F")}<sub>12</sub>| = |${V("F")}<sub>21</sub>|. Dass wir nur den Apfel fallen sehen, liegt an den Massen: Die gleiche Kraft beschleunigt die riesige Erdmasse nur unmessbar wenig (${V("a")} = ${F(V("F"),V("m"))}).`,"Denke an das Wechselwirkungsgesetz von Newton.",{l1:["m","Apfel"],l2:["M","Erde"],rad1:8,rad2:50,c1:"#e53935",c2:"#6fa8dc",Fshow:1,nor:1});}
function quizISS(){return Q("Schwerelos in der ISS?",`Die Astronauten in der ISS (Höhe etwa 400 km) schweben scheinbar schwerelos durch die Station.<br>Was ist der Grund dafür?`,

function quizGeo(){return Q("Geostationär über Bayern?",`Warum gibt es keinen Fernsehsatelliten, der geostationär genau über Bayern steht?`,

 `Aus dem Kraftansatz folgt ${V("v")} = ${SQ(F(V("G")+D+V("M"),V("r")))}: Je kleiner ${V("r")}, desto größer ${V("v")}. Gleichzeitig ist der Umfang 2${PI}${V("r")} kleiner – also ist die Umlaufdauer ${V("T")} kürzer. (ISS: ca. 92 min, geostationär: ca. 24 h.)`,`Nutze ${V("v")+SQR} = ${F(V("G")+D+V("M"),V("r"))} und überlege, wie sich der Weg für einen Umlauf ändert.`,{two:1});}
function quizPeter(){return Q("„Du hast dein eigenes Gravitationsfeld!“",`In der Serie Family Guy sagt der Hund Brian zu Peter Griffin: „Du hast dein eigenes Gravitationsfeld.“ Im Clip kreist daraufhin ein Apfel um Peter.<br>Welche Aussage ist physikalisch richtig?`,

/* ===================== Erster Schritt (Tipp Zeile 2) ===================== */

const S_MT=`${V("F","Z")} = ${V("F","G")} mit ${V("ω")} = ${F("2"+PI,V("T"))} &nbsp;→&nbsp; ${V("m")}${D}${F("4"+PI+SQR,V("T")+SQR)}${D}${V("r")} = ${V("G")}${D}${F(V("m")+D+V("M"),V("r")+SQR)} &nbsp;| : ${V("m")}`;

function SV(p,inner){return `<svg class="sk" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><defs>
<marker id="${p}mV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#e8710a;stroke:none"/></marker>
<marker id="${p}mF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#d32f2f;stroke:none"/></marker>
<marker id="${p}mH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" style="fill:#1565c0;stroke:none"/></marker>
<marker id="${p}mT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#5b6582;stroke:none"/></marker>
</defs>${inner}</svg>`;}
const aV=(p,x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="av" marker-end="url(#${p}mV)"/>`;
const aF=(p,x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="af" marker-end="url(#${p}mF)"/>`;
const aM=(p,x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="am" marker-start="url(#${p}mH)" marker-end="url(#${p}mH)"/>`;
const aR=(p,x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="am" marker-end="url(#${p}mH)"/>`;
const hl=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="hl"/>`;
const lab=(x,y,s,sub,anchor="middle")=>`<text x="${x}" y="${y}" text-anchor="${anchor}"><tspan class="it">${s}</tspan>${sub?`<tspan dy="4" font-size="11">${sub}</tspan>`:""}</text>`;
const tx=(x,y,s,anchor="middle",extra="")=>`<text x="${x}" y="${y}" class="tx" text-anchor="${anchor}" ${extra}>${s}</text>`;
function arcPath(cx,cy,R,a1,a2){const p=a=>[cx+R*Math.cos(a*Math.PI/180),cy-R*Math.sin(a*Math.PI/180)];const [x1,y1]=p(a1),[x2,y2]=p(a2);return `M${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 0 0 ${x2.toFixed(1)},${y2.toFixed(1)}`;}
const satIcon=(x,y,ship)=>ship?`<g transform="translate(${x},${y}) rotate(-60)"><path d="M-10,-4 L8,-4 L13,0 L8,4 L-10,4 Z" fill="#cfd8dc" stroke="#455a64" stroke-width="1.2"/><circle cx="3" cy="0" r="1.8" fill="#4fc3f7"/></g>`
 :`<g transform="translate(${x},${y}) rotate(-30)"><rect x="-4" y="-4" width="8" height="8" fill="#ffd54f" stroke="#455a64"/><rect x="-17" y="-3" width="11" height="6" fill="#64b5f6" stroke="#455a64" stroke-width=".8"/><rect x="6" y="-3" width="11" height="6" fill="#64b5f6" stroke="#455a64" stroke-width=".8"/></g>`;
function bodyFill(n){return n&&BODY[n]?BODY[n].c:"#9fb3c8";}
/* zwei Körper */
function skTwo(p,o){
 const r1=o.rad1||22,r2=o.rad2||32,x1=80,x2=240,y=88;
 const L1=o.lab1?`<text x="${x1}" y="${y-r1-10}" text-anchor="middle" class="it">${o.lab1}</text>`:lab(x1,y-r1-10,o.l1[0],o.l1[1]);
 const L2=lab(x2,y-r2-10,o.l2[0],o.l2[1]);
 let s=`<circle cx="${x1}" cy="${y}" r="${r1}" fill="${o.c1||"#90caf9"}" stroke="#455a64"/><circle cx="${x2}" cy="${y}" r="${r2}" fill="${o.c2||"#f48fb1"}" stroke="#455a64"/>`+L1+L2;
 s+=aF(p,x1+r1+3,y,x1+r1+38,y)+aF(p,x2-r2-3,y,x2-r2-38,y);
 s+=lab(x1+r1+22,y-10,"F","")+lab(x2-r2-22,y-10,"F","");
 if(!o.nor){s+=hl(x1,y,x1,170)+hl(x2,y,x2,170)+aM(p,x1,160,x2,160);
  s+=o.rlab?`<text x="${(x1+x2)/2}" y="152" text-anchor="middle" class="it">${o.rlab}</text>`:lab((x1+x2)/2,152,"r","");}
 return SV(p,s);
}
/* Planet mit Satellit */
function skSat(p,o){
 const cx=110,cy=112,pr=54,orr=94,th=30*Math.PI/180;
 const ux=Math.cos(th),uy=-Math.sin(th),sx=cx+orr*ux,sy=cy+orr*uy;
 let s=`<circle cx="${cx}" cy="${cy}" r="${orr}" class="orb"/><circle cx="${cx}" cy="${cy}" r="${pr}" fill="${bodyFill(o.body)}" stroke="#455a64"/><circle cx="${cx}" cy="${cy}" r="2.5" fill="#1b2340"/>`;
 if(o.body)s+=tx(cx,cy-16,o.body,"middle",'style="font-size:13px;font-weight:600"');
 if(o.R){const a=210*Math.PI/180,ex=cx+pr*Math.cos(a),ey=cy-pr*Math.sin(a);s+=aR(p,cx,cy,ex+3,ey-2)+lab(cx-28,cy+4,"R","");}
 if(o.h){const ox=0.5*13,oy=0.866*13,bx=cx+pr*ux+ox,by=cy+pr*uy+oy,tx2=sx-11*ux+ox,ty2=sy-11*uy+oy;
  s+=hl(cx+pr*ux,cy+pr*uy,bx,by)+aM(p,bx,by,tx2,ty2)+lab((bx+tx2)/2+14,(by+ty2)/2+14,"h","");}
 if(o.r){s+=aR(p,cx,cy,sx-9*ux,sy-9*uy)+lab(cx+40,cy-38,"r","");}
 if(o.F){s+=aF(p,sx-12*ux,sy-12*uy,sx-46*ux,sy-46*uy);const fl=o.Flab||["F","G"];s+=lab(sx-40*ux-12,sy-40*uy-6,fl[0],fl[1]);}
 if(o.v){s+=aV(p,sx-0.5*10,sy-0.866*10,sx-0.5*50,sy-0.866*50)+lab(sx-0.5*50+16,sy-0.866*50+6,"v","");}
 if(o.T){s+=`<path d="${arcPath(cx,cy,orr+9,100,135)}" fill="none" stroke="#5b6582" stroke-width="1.6" marker-end="url(#${p}mT)"/>`+lab(cx-84,cy-58,"T","");}
 s+=satIcon(sx,sy,o.ship);
 return SV(p,s);
}

function skOrbit(p,o){
 const cx=120,cy=102,pr=30,orr=80,th=35*Math.PI/180,mx=cx+orr*Math.cos(th),my=cy-orr*Math.sin(th);
 let s=`<circle cx="${cx}" cy="${cy}" r="${orr}" class="orb"/><circle cx="${cx}" cy="${cy}" r="${pr}" fill="${o.c||"#9fb3c8"}" stroke="#455a64"/><circle cx="${cx}" cy="${cy}" r="2.5" fill="#1b2340"/>`;
 s+=lab(cx,cy+18,"M","");
 if(o.r)s+=aR(p,cx,cy,mx-9*Math.cos(th),my+9*Math.sin(th))+lab(cx+28,cy-36,"r","");
 if(o.T)s+=`<path d="${arcPath(cx,cy,orr+9,200,250)}" fill="none" stroke="#5b6582" stroke-width="1.6" marker-end="url(#${p}mT)"/>`+lab(cx-82,cy+70,"T","");
 if(o.v){const tx0=-Math.sin(th),ty0=-Math.cos(th);s+=aV(p,mx+tx0*12,my+ty0*12,mx+tx0*52,my+ty0*52)+lab(mx+tx0*52-10,my+ty0*52+16,"v","");}
 s+=`<circle cx="${mx}" cy="${my}" r="8" fill="#cfd8dc" stroke="#455a64"/>`+lab(mx+18,my+14,"m","");

 vSatellit:(t,p)=>skSat(p,t.sk),kosmisch1:(t,p)=>skSat(p,t.sk),masseAusV:(t,p)=>skOrbit(p,t.sk),TausV:(t,p)=>skSat(p,t.sk),
 masseAusT:(t,p)=>skOrbit(p,t.sk),planetUnbekannt:(t,p)=>skSat(p,t.sk),apolloMond:(t,p)=>skSat(p,t.sk),geostationaer:(t,p)=>skSat(p,t.sk),
 umlaufdauer:(t,p)=>skSat(p,t.sk),hoeheAusV:(t,p)=>skSat(p,t.sk),kosmisch2:(t,p)=>skEscape(p,t.sk),gAusMond:(t,p)=>skOrbit(p,t.sk),
 quizAbstand:(t,p)=>skTwo(p,t.sk),quizMassen:(t,p)=>skTwo(p,t.sk),quizEisenhower:(t,p)=>skSat(p,t.sk),quizApfel:(t,p)=>skTwo(p,t.sk),
 quizISS:(t,p)=>skSat(p,t.sk),quizGeo:(t,p)=>skGeo(p),quizBahn:(t,p)=>skTwoOrbits(p),quizPeter:(t,p)=>skPeter(p)
};
if(typeof module!=="undefined")module.exports={TASKS,SKETCH,STEP1,res,gv};
</script>

<script>
/* ===================== Oberfläche ===================== */
const $=s=>document.querySelector(s);
const ICON_MET=`<svg class="ic" viewBox="0 0 40 40" aria-hidden="true"><path d="M1 3 L23 19 L17 25 Z" fill="#ffb74d" opacity=".85"/><path d="M8 9 L22 20 L19 23 Z" fill="#ff7043"/><circle cx="26" cy="26" r="10" fill="#8d6e63" stroke="#5d4037" stroke-width="1.2"/><circle cx="23" cy="23" r="2.6" fill="#6d4c41"/><circle cx="29.5" cy="29" r="2" fill="#6d4c41"/><circle cx="29" cy="21.5" r="1.3" fill="#6d4c41"/></svg>`;
const ICON_STAR=`<svg class="ic" viewBox="0 0 40 40" aria-hidden="true"><path d="M1 37 L20 20 L24 24 Z" fill="#fff59d" opacity=".9"/><path d="M6 37 L21 22 L22 24 Z" fill="#ffee58"/><path d="M27 4 l3 6.2 6.8.9-4.9 4.7 1.2 6.7-6.1-3.3-6.1 3.3 1.2-6.7-4.9-4.7 6.8-.9z" fill="#fdd835" stroke="#f9a825" stroke-width="1.2"/></svg>`;
const LVNAMES={1:"Leicht",2:"Mittel",3:"Schwer",4:"Quiz"};
const REWARD={1:1,2:2,3:3,4:1};
const PRAISE=["Volltreffer – Newton wäre stolz! 🍎","Einschlag mit Ansage! ☄️","Astronomisch gut!","Bahn perfekt berechnet – Houston, kein Problem! 🚀","Kepler würde applaudieren!","Das sitzt wie ein geostationärer Satellit! 🛰️","Glatter Orbit – genau richtig!","Du hast die Gravitation voll im Griff!","Punktlandung auf dem Mond! 🌕","Galaktisch gerechnet! 🌌"];
const PRAISE_Q=["Sternschnuppe gefangen – wünsch dir was! 🌠","Genau verstanden – stark!","Richtig! Newton nickt zufrieden. 🍎","Sternklar erkannt! ✨","Volltreffer im Verständnis-Orbit!"];
let level=1,task=null,tries=0,done=false,sel=null,lastName={};
const stats={ok:0,bad:0,met:0,star:0};
let history=[];const used=new Set();
$("#icMet").innerHTML=ICON_MET;$("#icStar").innerHTML=ICON_STAR;

function lvIcons(l){return l===4?ICON_STAR:ICON_MET.repeat(l);}
function openTasks(l){return TASKS[l].filter(f=>!used.has(f.name));}
function renderLevels(){
 $("#levels").innerHTML=[1,2,3,4].map(l=>{const o=openTasks(l).length;return `<button class="lvb ${l===level?"act":""}" data-l="${l}"><span class="ln">${LVNAMES[l]} ${lvIcons(l)}</span><span class="lo">${o?o+" von "+TASKS[l].length+" offen":"alle bearbeitet ✓"}</span></button>`;}).join("");
 document.querySelectorAll(".lvb").forEach(b=>b.onclick=()=>{level=+b.dataset.l;renderLevels();newTask();});
}
function newTask(){
 const open=openTasks(level);
 if(!open.length){showLevelDone();return;}
 let cand=open.length>1?open.filter(f=>f.name!==lastName[level]):open;
 const f=pick(cand);lastName[level]=f.name;
 task=f();task.name=f.name;task.level=level;task.answers=[];task.status=null;
 tries=0;done=false;sel=null;render();
}
function showLevelDone(){
 const others=[1,2,3,4].filter(l=>openTasks(l).length);
 $("#task").innerHTML=`<div class="donebox"><div class="trophy">🏆</div><h2>Niveau „${LVNAMES[level]}“ geschafft!</h2><p>Du hast alle ${TASKS[level].length} Aufgaben dieses Niveaus bearbeitet.</p>
 ${others.length?`<p>Weiter geht’s mit:</p><div class="btns">${others.map(l=>`<button class="b primary" data-go="${l}">${LVNAMES[l]} (${openTasks(l).length} offen)</button>`).join("")}</div>`:`<p><b>Du hast wirklich alle Aufgaben bearbeitet – ein ganzes Sonnensystem voller Lösungen!</b> Lade dir unten deine Zusammenfassung als PDF herunter.</p>`}</div>`;
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{level=+b.dataset.go;renderLevels();newTask();});
}
function inputHTML(t){
 const sci=isSci(t.ans);t.sci=sci;
 return `<div class="inrow"><label for="inM">${t.ask} =</label>${sci?`<span class="pw"><input id="inM" inputmode="decimal" autocomplete="off" placeholder="z. B. 6,0"><span class="ten">${D}10</span><input id="inE" class="exp" inputmode="text" autocomplete="off" placeholder="n" aria-label="Hochzahl"></span>`:`<input id="inM" inputmode="decimal" autocomplete="off">`}<span>${UNITS[t.unit]}</span></div>`;
}
function quizHTML(t){return `<div class="opts">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ol">${"ABCD"[i]}</span><span>${o.t}</span></button>`).join("")}</div>`;}
function render(){
 const t=task;
 $("#task").innerHTML=`<div class="thead"><span class="lvtag lv${t.level}">${LVNAMES[t.level]}</span><h2>${t.title}</h2></div>
 <div class="tbody"><div class="ttext">${t.text}</div><div class="sketch">${SKETCH[t.name](t,"a")}</div></div>
 ${t.quiz?quizHTML(t):inputHTML(t)}
 <div class="btns"><button id="bCheck" class="b primary">Überprüfen</button><button id="bTip" class="b">Tipp</button><button id="bNew" class="b">Neue Aufgabe</button></div>
 <div id="fb"></div><div id="tip" hidden></div><div id="sol"></div>`;
 $("#bCheck").onclick=check;$("#bTip").onclick=toggleTip;$("#bNew").onclick=newTask;
 if(t.quiz){document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;sel=+b.dataset.i;document.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",+x.dataset.i===sel));});}
 else{["#inM","#inE"].forEach(id=>{const e=$(id);if(e)e.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();check();}});});}
}
function tipHTML(t){
 if(t.quiz)return `<div class="tipbox"><div><b>Hinweis:</b> ${t.tip.h}</div></div>`;
 return `<div class="tipbox"><div><b>Formeln:</b> ${t.tip.f}</div><div><b>Erster Schritt:</b> ${STEP1[t.name](t)}</div><div><b>Hinweis:</b> ${t.tip.h}</div></div>`;
}
function toggleTip(){const e=$("#tip");if(e.hidden){e.innerHTML=tipHTML(task);e.hidden=false;$("#bTip").textContent="Tipp ausblenden";}else{e.hidden=true;$("#bTip").textContent="Tipp";}}
function solHTML(t){
 if(t.quiz){const r=t.opts.find(o=>o.ok);return `<div class="expl"><b>Richtige Antwort:</b> ${r.t}<br><br>${t.expl}</div>`;}
 return `<div class="sol"><h3>Lösungsweg</h3><div class="srow"><span class="sl">Gegeben:</span><span class="sv">${gi(t.given)}</span></div><div class="srow"><span class="sl">Gesucht:</span><span class="sv">${t.find}</span></div>${t.steps.map(s=>`<div class="srow"><span class="sl">${s[0]}:</span><span class="sv">${s[1]}</span></div>`).join("")}</div>`;
}
function parseNum(s){s=String(s||"").trim().replace(/\s/g,"").replace(/−/g,"-").replace(",",".");if(s==="")return NaN;if(!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s))return NaN;return Number(s);}
function readInput(){
 const m=parseNum($("#inM").value);
 if(!task.sci)return {v:m,txt:isNaN(m)?"":fmtUser(m)};
 const es=($("#inE").value||"").trim();const e=es===""?0:parseNum(es);
 if(isNaN(m)||isNaN(e)||!Number.isInteger(e))return {v:NaN};
 return {v:m*Math.pow(10,e),txt:numUser(m)+(e?D+pow10(e):"")};
}
function numUser(x){return String(x).replace(".",",").replace("-","−");}
function fmtUser(x){return Math.abs(x)>=1e5||(Math.abs(x)<1e-2&&x!==0)?gv(x):numUser(x);}
const close=(a,b)=>Math.abs(a-b)<=0.07*Math.abs(b);
function hintFor(v,t){
 for(const [a,h] of (t.alts||[]))if(close(v,a))return h;
 if(v===0)return "Null kann nicht stimmen – prüfe deine Rechnung.";
 const r=v/t.ans,near=x=>Math.abs(r/x-1)<0.07,nb=x=>near(x)||near(1/x);
 if(close(v,t.ans*t.ans)||close(v*v,t.ans))return "Hast du die Wurzel vergessen bzw. zu viel quadriert? Prüfe den letzten Umformungsschritt.";
 if(v<0)return "Das Vorzeichen stimmt nicht – Beträge von Kräften, Massen, Höhen und Geschwindigkeiten sind positiv.";
 const k=Math.round(Math.log10(Math.abs(r)));
 if(k!==0&&near(Math.pow(10,k))){
  if(k%3===0)return `Die Ziffern stimmen, aber die Größenordnung nicht (Faktor 10<sup>${k<0?"−":""}${Math.abs(k)}</sup>). Hast du km in m umgerechnet (beim Quadrat Faktor 10<sup>6</sup>, hoch 3 Faktor 10<sup>9</sup>) bzw. g in kg? Achte auch darauf, in welcher Einheit (${UNITS[t.unit]}) das Ergebnis gefragt ist.`;
  return `Die Ziffern stimmen, aber die Zehnerpotenz nicht. Prüfe die Hochzahl beim Rechnen mit Zehnerpotenzen.`;}
 for(const f of [60,3600,86400,24,1440])if(nb(f)||nb(f*f)||nb(Math.sqrt(f)))return "Prüfe die Zeiteinheit: Rechne die Umlaufdauer in Sekunden um (1 min = 60 s, 1 h = 3600 s, 1 d = 86 400 s) und gib das Ergebnis in der gefragten Einheit an.";
 if(nb(3.6)||nb(12.96))return `Prüfe die Umrechnung zwischen ${UNITS["km/h"]} und ${UNITS["m/s"]} (Faktor 3,6).`;
 if(nb(2*Math.PI)||nb(4*Math.PI*Math.PI)||nb(Math.PI))return `Prüfe den Faktor 2π bzw. 4π² (${OMform}).`;
 if(nb(2)||nb(Math.SQRT2))return "Da fehlt ein Faktor 2 – prüfe den Ansatz (z. B. ½ bei der Bewegungsenergie oder Radius ↔ Durchmesser).";
 if(nb(4))return "Faktor 4 daneben: Radius und Durchmesser verwechselt oder beim Quadrieren den Faktor 2 übersehen?";
 return "Noch nicht richtig. Prüfe Ansatz und Umstellen und rechne alle Größen in SI-Einheiten (m, kg, s) um. Ein Blick in den Tipp hilft!";
}
function check(){
 if(done)return;
 const t=task;
 if(t.quiz){
  if(sel===null){$("#fb").innerHTML=`<div class="fb info">Wähle zuerst eine Antwort aus.</div>`;return;}
  tries=1;done=true;history.push(t);used.add(t.name);
  const ok=t.opts[sel].ok;t.chosen=sel;t.status=ok?"ok":"bad";
  document.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(t.opts[i].ok)b.classList.add("right");else if(i===sel)b.classList.add("wrong");});
  if(ok){stats.ok++;stats.star++;$("#fb").innerHTML=`<div class="fb ok">${pick(PRAISE_Q)} +1 ${ICON_STAR}</div>`;fly("star",1);}
  else{stats.bad++;$("#fb").innerHTML=`<div class="fb bad">Leider nicht richtig – lies dir die Erklärung durch.</div>`;}
  $("#sol").innerHTML=solHTML(t);finish();return;
 }
 const inp=readInput();
 if(isNaN(inp.v)){$("#fb").innerHTML=`<div class="fb info">Bitte gib eine Zahl ein${t.sci?" (Zahl vor dem Malpunkt und ganzzahlige Hochzahl)":""}. Komma oder Punkt sind beide erlaubt.</div>`;return;}
 tries++;
 if(tries===1){history.push(t);used.add(t.name);renderLevels();}
 const ok=close(inp.v,t.ans);t.answers.push({txt:inp.txt,ok});
 if(ok){
  done=true;const n=REWARD[t.level];stats.met+=n;
  if(tries===1){stats.ok++;t.status="ok";}else t.status="ok2";
  $("#fb").innerHTML=`<div class="fb ok">${pick(PRAISE)} +${n} ${ICON_MET.repeat(n)}${tries>1?"<br><small>Im 2. Versuch gelöst – zählt in der Statistik als falsch.</small>":""}</div>`;
  fly("met",n);$("#sol").innerHTML=solHTML(t);finish();
 }else if(tries===1){
  stats.bad++;t.status="wrong1";
  $("#fb").innerHTML=`<div class="fb bad">Noch nicht ganz – du hast einen zweiten Versuch.<br><span style="font-weight:500">${hintFor(inp.v,t)}</span></div>`;
  $("#inM").select();updateStats();
 }else{
  done=true;t.status="bad";
  $("#fb").innerHTML=`<div class="fb bad">Leider wieder daneben. Hier ist der vollständige Lösungsweg – schau ihn dir genau an!</div>`;
  $("#sol").innerHTML=solHTML(t);finish();
 }
}
function finish(){
 ["#inM","#inE"].forEach(id=>{const e=$(id);if(e)e.disabled=true;});
 $("#bCheck").disabled=true;$("#bNew").classList.add("primary","hl");
 renderLevels();updateStats();
}
function fly(kind,n){
 const tgt=$(kind==="star"?"#cStar":"#cMet").getBoundingClientRect();
 const src=$("#fb").getBoundingClientRect();
 for(let i=0;i<n;i++){
  const d=document.createElement("div");d.className="fly";d.innerHTML=kind==="star"?ICON_STAR:ICON_MET;
  d.firstChild.style.width="44px";d.firstChild.style.height="44px";
  const x0=src.left+40+i*50,y0=src.top+10;d.style.left=x0+"px";d.style.top=y0+"px";document.body.appendChild(d);
  setTimeout(()=>{d.style.transform=`translate(${tgt.left+tgt.width/2-x0-22}px,${tgt.top+tgt.height/2-y0-22}px) scale(.5) rotate(${kind==="star"?360:-30}deg)`;d.style.opacity=".3";},60+i*180);
  setTimeout(()=>{d.remove();const c=$(kind==="star"?"#cStar":"#cMet");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");},1150+i*180);
 }
}
function updateStats(){
 $("#nMet").textContent=stats.met;$("#nStar").textContent=stats.star;
 const tot=stats.ok+stats.bad,pct=tot?Math.round(stats.bad/tot*100):0;
 const nm=$("#name")?$("#name").value:"";
 $("#stats").innerHTML=`<h2>Dein Stand</h2>
 <div class="kz"><div><b style="color:var(--ok)">${stats.ok}</b><span>richtig</span></div><div><b style="color:var(--bad)">${stats.bad}</b><span>falsch</span></div><div><b>${pct}${TS}%</b><span>Fehleranteil</span></div></div>
 <div class="bar">${tot?`<div class="g" style="width:${stats.ok/tot*100}%"></div><div class="r" style="width:${stats.bad/tot*100}%"></div>`:""}</div>
 <div class="rew"><span>${ICON_MET} ${stats.met} Meteorite</span><span>${ICON_STAR} ${stats.star} Sternschnuppen</span></div>
 <label for="name">Name (optional)</label><input id="name" autocomplete="off" value="${nm.replace(/"/g,"&quot;")}">
 <button class="b primary" id="bPdf" ${history.length?"":"disabled"}>Zusammenfassung als PDF</button>
 <button class="b warn" id="bReset">Stand zurücksetzen</button>`;
 $("#bPdf").onclick=makePdf;$("#bReset").onclick=askReset;
}
/* Modal */
function showModal(html,btns){$("#mText").innerHTML=html;$("#mBtns").innerHTML="";btns.forEach(([l,c,fn])=>{const b=document.createElement("button");b.className="b "+(c||"");b.textContent=l;b.onclick=fn;$("#mBtns").appendChild(b);});$("#modal").classList.add("on");}
function closeModal(){$("#modal").classList.remove("on");}
function askReset(){showModal(`<h2 style="margin-top:0">Stand zurücksetzen?</h2><p>Alle Aufgaben werden wieder freigegeben, Statistik, Meteorite und Sternschnuppen werden gelöscht.</p>`,[["Abbrechen","",closeModal],["Zurücksetzen","primary",doReset]]);}
function doReset(){closeModal();stats.ok=stats.bad=stats.met=stats.star=0;history=[];used.clear();lastName={};renderLevels();updateStats();newTask();}
/* PDF */
const BADGE={ok:["richtig","b-ok"],bad:["falsch","b-bad"],ok2:["im 2. Versuch gelöst (zählt als falsch)","b-ok2"],wrong1:["1. Versuch falsch, nicht abgeschlossen","b-open"]};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function buildSummary(){
 const nm=($("#name")||{}).value||"";const now=new Date();
 const tot=stats.ok+stats.bad,pct=tot?Math.round(stats.bad/tot*100):0;
 let h=`<div class="phead"><h1>Dein Gravitations Trainer – Zusammenfassung</h1>
 <div style="font-size:9pt;color:#555">Trainer von Peter Sobek (edu-mrh.de)</div>
 <div>${nm?"<b>Name:</b> "+esc(nm)+" &nbsp; ":""}<b>Datum:</b> ${now.toLocaleDateString("de-DE")} ${now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})} Uhr</div>
 <div class="pk"><span><b>Bearbeitet:</b> ${history.length}</span><span><b>Richtig:</b> ${stats.ok}</span><span><b>Falsch:</b> ${stats.bad}</span><span><b>Fehleranteil:</b> ${pct}${TS}%</span><span>${ICON_MET} ${stats.met} Meteorite</span><span>${ICON_STAR} ${stats.star} Sternschnuppen</span></div></div>`;
 history.forEach((t,i)=>{
  const b=BADGE[t.status]||BADGE.wrong1;
  h+=`<div class="ptask"><div class="ptop"><b>${i+1}.</b><h2>${t.title}</h2><span class="lvtag lv${t.level}">${LVNAMES[t.level]}</span><span class="badge ${b[1]}">${b[0]}</span></div>
  <div class="pbody">${SKETCH[t.name](t,"p"+i)}<div>${t.text}</div></div>`;
  if(t.quiz){h+=`<div class="ans">${t.opts.map((o,j)=>`<div class="opt ${o.ok?"right":j===t.chosen?"wrong":""}"><span class="ol">${"ABCD"[j]}</span><span>${o.t}${j===t.chosen?" &nbsp;<b>← deine Wahl "+(o.ok?"✓":"✗")+"</b>":""}</span></div>`).join("")}</div><div class="expl">${t.expl}</div>`;}
  else{h+=`<div class="ans"><b>Deine Antworten:</b> ${t.answers.map((a,j)=>`${j+1}. Versuch: ${t.ask} = ${a.txt}${TS}${UNITS[t.unit]} ${a.ok?"<span style='color:#2e7d32'>✓</span>":"<span style='color:#c62828'>✗</span>"}`).join(" &nbsp;|&nbsp; ")}</div>${solHTML(t)}`;}
  h+=`</div>`;});
 return h;
}
function fileName(){const nm=(($("#name")||{}).value||"").trim().replace(/[^\wäöüÄÖÜß-]+/g,"_");const d=new Date();return "Gravitation_Zusammenfassung"+(nm?"_"+nm:"")+"_"+d.toISOString().slice(0,10);}
function makePdf(){
 if(!history.length)return;
 $("#printArea").innerHTML=buildSummary();
 showModal(`<h2 style="margin-top:0">Zusammenfassung</h2><p>Im Druckdialog „Als PDF speichern“ wählen (iPad: Teilen → „In Dateien sichern“). Alternativ die Zusammenfassung als Datei herunterladen und später drucken.</p>`,
  [["Schließen","",closeModal],["Als Datei herunterladen","",download],["Drucken / Als PDF speichern","primary",doPrint]]);
}
function doPrint(){closeModal();const old=document.title;document.title=fileName();setTimeout(()=>{try{window.print();}catch(e){}setTimeout(()=>{document.title=old;},800);},150);}
function download(){
 const css=document.querySelector("style").textContent;
 const html=`<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${fileName()}</title><style>${css}
 body{background:#fff;padding:16px}#printArea{display:block}</style></head><body><div id="printArea" class="pa"><button class="b primary prt" onclick="window.print()">Drucken / Als PDF speichern</button>${buildSummary()}</div></body></html>`;
 try{const blob=new Blob([html],{type:"text/html"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fileName()+".html";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}catch(e){}
 closeModal();
}
renderLevels();updateStats();newTask();
</script>
<script defer src="https://edu-mrh.de/controls.js"></script>
