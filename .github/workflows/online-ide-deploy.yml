name: Build and Deploy Online-IDE (embedded)

on:
  schedule:
    # Jeden Tag um 04:00 Uhr (UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Manueller Start jederzeit möglich

jobs:
  build-online-ide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: martin-pabst/Online-IDE-new-compiler
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build-embedded
      - name: Patch base URL in includeIDE.js
        run: |
          sed -i 's|let base = "https://embed.learnj.de/include/";|let base = "https://edu-mrh.de/embed/include/";|' dist-embedded/includeIDE.js
          grep -q 'let base = "https://edu-mrh.de/embed/include/";' dist-embedded/includeIDE.js
      - name: SQL-Engine vom eigenen Server statt embed.learn-sql.de
        run: |
          # Nur im Doku-Modus (window.jo_doc) genutzt, trotzdem auf die mitgebaute Datei umbiegen.
          W=$(cd dist-embedded && ls assets/sql-wasm-*.wasm 2>/dev/null | head -1 || true)
          if [ -n "$W" ]; then
            grep -rl 'https://embed.learn-sql.de/include/lib/sql.js/sql-wasm.wasm' dist-embedded --include='*.js' \
              | xargs -r sed -i "s|https://embed.learn-sql.de/include/lib/sql.js/sql-wasm.wasm|https://edu-mrh.de/embed/include/$W|g" || true
          fi
      - name: Lizenz beilegen (GPL-3.0)
        run: |
          for f in LICENSE LICENSE.md LICENSE.txt COPYING; do
            if [ -f "$f" ]; then cp "$f" dist-embedded/LICENSE.txt; break; fi
          done
          if [ ! -f dist-embedded/LICENSE.txt ]; then
            echo "::warning::Keine Lizenzdatei im Online-IDE-Repo gefunden – GPL-Text fehlt im Deploy."
          fi
          cat > dist-embedded/QUELLE.txt <<'TXT'
          Online-IDE (eingebettete Fassung) von Martin Pabst, Lizenz: GNU GPL v3 (siehe LICENSE.txt).
          Quellcode: https://github.com/martin-pabst/Online-IDE-new-compiler
          Änderungen für edu-mrh.de: Basis-URL und Pfad der SQL-Engine auf diesen Server umgestellt
          (siehe https://github.com/Mountain2017/edu-mrh.de/blob/main/.github/workflows/online-ide-deploy.yml).
          TXT
      - name: Keine fremden Server (DSGVO-Wächter)
        run: |
          # Bricht ab, wenn der Build von CDNs, Tracking-Diensten oder den Original-Servern lädt.
          VERBOTEN='(cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com|ajax\.googleapis\.com|fonts\.googleapis\.com|fonts\.gstatic\.com|code\.jquery\.com|[a-z0-9.-]*bootstrapcdn\.com|[a-z0-9.-]*google-analytics\.com|[a-z0-9.-]*googletagmanager\.com|[a-z0-9.-]*doubleclick\.net|[a-z0-9.-]*sentry\.io|[a-z0-9.-]*matomo\.[a-z]+|[a-z0-9.-]*plausible\.io|[a-z0-9.-]*hotjar\.com|[a-z0-9.-]*clarity\.ms|embed\.learnj\.de|embed\.learn-sql\.de)'
          # Geprüfte Ausnahme (toter Code): p5.js lädt Übersetzungen von jsdelivr nur im
          # unminifizierten Build; im Minified-Build ist der Aufruf durch Promise.resolve() ersetzt.
          ERLAUBT='cdn\.jsdelivr\.net/npm/p5@'
          TREFFER=$(grep -rhoaE "(https?:)?//${VERBOTEN}[^\"'\` )]{0,80}" --exclude='*.map' dist-embedded | grep -vE "$ERLAUBT" | sort -u || true)
          if [ -n "$TREFFER" ]; then
            echo "::error::Build lädt von fremden Servern (DSGVO) – Deploy abgebrochen:"; echo "$TREFFER"; exit 1
          fi
          echo "Keine fremden Server im Build gefunden."
      - uses: actions/upload-artifact@v4
        with:
          name: dist-online-ide-embedded
          path: dist-embedded/
          retention-days: 3

  deploy-online-ide:
    needs: build-online-ide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-online-ide-embedded
          path: dist-embedded/
      - name: Deploy to Hetzner via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist-embedded/
          server-dir: /embed/include/
          timeout: 600000
          exclude: |
            **/*.map
